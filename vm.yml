# ── the omarchy VM template: the ONE base every golden in this repo derives from ──
# This project-local node is the unified template (the distro import's `omarchy.omarchy-vm`
# diverged — a different ISO + resources — and is no longer what the goldens clone).
omarchy-vm:
    vm:
        source:
            kind: iso
            distro: omarchy
            url: https://iso.omarchy.org/omarchy-4.0.4.iso
            checksum: {type: sha256, value: ddeded2758c48318d201dfdac905ecb28f570441883f0c052ea3cd5d05acf92d}
            installer:
                username: user
                password: user
                full_name: Charly
                email: charly@opencharly.invalid
                hostname: omarchy
                timezone: UTC
                keyboard: us
                locale: en_US.UTF-8
                disk: /dev/vda
                encrypt: false
        disk_size: 40G
        ram: 2G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
