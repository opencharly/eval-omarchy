# dev-migrations — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-dev-migrations:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the dev tools + migrations surface
            - check: the dev env PATH is set
              id: a-dev-env
              context: [runtime]
              command: 'test -n "$PATH"'
            - check: the migration runner lists a pending migration (the stub surface — state-independent, mirrors the upstream migrate-wrapper test; the golden is fully provisioned so the real queue is empty)
              id: a-migrate-pending
              context: [runtime]
              command: |
                  T=$(mktemp -d)
                  mkdir -p "$T/omarchy/migrations" "$T/home"
                  echo 'true' > "$T/omarchy/migrations/100-stub.sh"
                  HOME="$T/home" OMARCHY_PATH="$T/omarchy" omarchy-migrate --pending
              stdout:
                  - contains: 100-stub.sh
            - check: the retired-installer sudoers artifact is absent
              id: a-retired
              context: [runtime]
              file:
                  file: /etc/sudoers.d/omarchy-retired-installer
                  exists: false
            - check: the legacy power udev rules are absent
              id: a-legacy-udev
              context: [runtime]
              command: '! grep -rq "omarchy" /etc/udev/rules.d/ 2>/dev/null'
            - check: the git-url check answers (a transport helper is refused)
              id: a-git-url
              context: [runtime]
              omarchy:
                  args: 'git url check ext::sh -c id'
                  expect_non_zero: true

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop
