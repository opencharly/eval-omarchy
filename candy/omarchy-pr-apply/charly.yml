omarchy-pr-apply:
    candy:
        version: 2026.247.1100
        description: |
            The ONE runtime PR-apply helper for omarchy evaluations (T10 — the
            single-source apply seam; R3: no per-PR copy-paste of the git-fetch
            block ever again). Installs /usr/local/bin/pr-apply, which fetches a
            PR head (SHA-pinned) and installs ONLY its changed files over the
            installed tree. Every eval bed's apply step is exactly:
                pr-apply <pr> <sha> <changed-files...>
            The grep guard lives here: 'git fetch .* pull/<N>/head' may only
            appear in THIS candy. The same seam serves the pod venue and the VM
            venue (AGENTS.md per-PR artifact pattern, runtime lane).
        plan:
            - run: install the pr-apply helper (the single runtime apply seam; base64-embedded - the executor drops heredoc stdin, which produced a 0-byte helper that silently no-opped every apply)
              id: eval-pr-apply-install
              command: |
                  set -eu
                  printf '%s' '' | base64 -d > /usr/local/bin/pr-apply
                  chmod 0755 /usr/local/bin/pr-apply
                  test -s /usr/local/bin/pr-apply && head -1 /usr/local/bin/pr-apply | grep -q "#!/usr/bin/env bash"
            - check: the helper is installed and runnable
              id: eval-pr-apply-ok
              context: [runtime]
              command: 'test -s /usr/local/bin/pr-apply && head -1 /usr/local/bin/pr-apply | grep -q "#!/usr/bin/env bash" && pr-apply --help >/dev/null 2>&1 || true'
