omarchy-eval-record:
    candy:
        version: 2026.247.1400
        description: |
            The eval-tooling payload for omarchy PR evaluations: recording tools (tmux +
            asciinema, eval rule 6) + acpid (fast ACPI shutdown — the golden shuts down in
            seconds instead of the graceful-stop grace) + qemu-guest-agent (consistent
            snapshots, console fallback, fast shutdown) + a FULL PACKAGE UPDATE so the
            golden carries current packages at capture. Baked into the instrumented
            golden (check-omarchy-eval-base-inst); mutating steps run at deploy ONCE at
            capture (per-eval beds carry no payload). The recording tooling:
            tmux + asciinema installed natively, so a venue can run the
            record: gif loop (start a terminal recording → run a command →
            stop → render the .cast to an animated GIF with agg). agg itself
            is NOT packaged in any distro — it arrives via the asciinema
            layer's pinned prebuilt binary (layer-asciinema v2026.246.1622,
            which also ships the DejaVu monospace font). Add this candy to a
            bed whose venue derives from omarchy-vm (which does not carry the
            recording tools by default); the omarchy-suite-base already
            composes layer-tmux + layer-asciinema.
        plan:
            - run: install the recording tools (tmux + asciinema)
              id: eval-record-install
              command: |
                  set -eu
                  pacman -S --needed --noconfirm tmux asciinema acpid qemu-guest-agent
                  systemctl enable --now acpid
                  systemctl enable --now qemu-guest-agent
                  pacman -Syu --noconfirm
            - check: tmux is installed
              id: eval-record-tmux
              context:
                - build
              command: tmux -V
            - check: asciinema is installed
              id: eval-record-asciinema
              context:
                - build
              command: asciinema --version
