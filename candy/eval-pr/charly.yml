# candy/eval-pr/charly.yml — the minimal omarchy PR-eval lane wiring + skills.
#
# ONE self-contained per-PR evaluation: an instrumented golden clone, the PR
# applied via the single pr-apply seam, the oracle's known-red checks + the drive
# recording, and the NEGATIVE CONTROL (the same checks negated on the pristine
# golden). Everything the run produces lands in ONE directory:
#
#   eval/pr-<N>/charly.yml   — both beds (treatment + control entities, COMMITTED)
#   eval/pr-<N>/eval.yml     — the single record: oracle + eval + control + gates
#                              + pr-validator verdict/checklist + cold-read + the
#                              user-voice report + media links
#   eval/pr-<N>/media/       — the recordings (GITIGNORED)
#
# The pipeline entity is eval-pr-plan (in the project charly.yml). The skill
# BODIES below are the SINGLE SOURCE; `charly marketplace generate` projects each
# to marketplace/distros/skills/<name>/SKILL.md (family: distros). The lane's
# eval-pr-plan consumes that corpus via skills.corpus.
#
# The lane grades the PR against the ORG-WIDE pr-validator criteria (the
# `pr-validator-agent` skill entity in opencharly/layer-charly-internals-extra,
# projected to marketplace/internals/agents/pr-validator.md) — but with ONE
# substitution: the pr-validator normally ASSUMES the author ran R10 and pasted
# the evidence, whereas THIS lane RUNS the R10 itself (the oracle-planned,
# control-proven, live-VM run) and feeds its ledger facts to the grading stage.

eval-pr:
  candy:
    version: 2026.257.1700
    description: |-
      The minimal omarchy PR-eval lane: one disposable golden clone per PR, the
      PR applied via the pr-apply seam, known-red checks proven by a negative
      control, both recording lanes, the org pr-validator checklist graded from
      the lane's own R10 ledger, and ONE self-contained eval/pr-<N>/eval.yml
      record. Composes the generic pipeline engine + the PR tools.
    candy:
      - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.259.0809'
      - '@github.com/opencharly/plugin-review/candy/plugin-review:v2026.251.1939'
    var:
      EVAL_LANES: "16"
      EVAL_REPO: omacom/omarchy
    env_require:
      - name: EVAL_UMBRELLA
        description: "Path to the opencharly umbrella checkout (the skills corpus root)"
        default: ""
    env_accept:
      - name: EVAL_LLM_BASE_URL
        description: "LLM chat-completions base URL (default: the local ollama server)"
      - name: EVAL_LLM_MODEL
        description: "LLM model id (default: deepseek-v4.1-flash:cloud on the local ollama)"
      - name: EVAL_LLM_PROVIDER
        description: "LLM provider name"
      - name: EVAL_DRY_RUN
        description: "Dry-run flag"
      - name: EVAL_DEBUG
        description: "Verbose run debugging"
      - name: EVAL_LANES
        description: "Concurrency lanes"
      - name: EVAL_PUBLISH
        description: "approve -> the publication gate posts"
      - name: BARE_PROMPT
        description: "Inline prompt for the standalone agent surface"
    secret_accept:
      - name: EVAL_LLM_API_KEY
        description: "LLM provider API key"
        key: charly/api-key/eval-llm
    plan:
      - check: the pipeline executor self-tests
        id: ade-pipeline-present
        context: [runtime]
        command: charly pipeline --self-test
        exit_status: 0
      - check: the v2 pipeline entity validates against #PipelineInput
        id: ade-pipeline-valid
        context: [runtime]
        command: charly pipeline validate eval-pr-plan
        exit_status: 0

eval-pr-entry-skill:
    skill:
        name: omarchy-eval
        family: distros
        owner: eval-omarchy
        description: |-
            The omarchy PR-eval lane procedure — graded by the org pr-validator criteria, with the lane itself running the R10 the pr-validator would otherwise assume.
        content: |-
            # omarchy-eval

            The omarchy PR-eval lane procedure. Every agent in the lane follows this;
            the stage prompts point here and never restate it.

            ## The lane's job

            Evaluate an omacom/omarchy PR the way another user would: apply the PR to a
            real omarchy system, use it, and report what happened — on a disposable
            golden-VM clone, with full evidence rigor.

            ## The grading criteria are the org pr-validator's

            The lane grades the PR against the SAME criteria every opencharly repo uses
            for its own PRs — the org-wide **pr-validator** agent spec. That spec is the
            single source of the checklist and the verdict discipline:

              - origin: the `pr-validator-agent` `skill:` entity in
                `opencharly/layer-charly-internals-extra` (charly.yml);
              - projection: `marketplace/internals/agents/pr-validator.md`;
              - what it is: rigorous, TOTAL enforcement — ANY plausible violation is a
                FAIL and the burden is on the PR to prove compliance. Verdict: PASS or
                BLOCK. Never a rubber stamp, never benefit of the doubt.

            This lane does not restate that spec. It carries only the APPLICABILITY MAP
            below — which of the spec's items the lane grades, and which ledger fact or
            artifact supplies the evidence for each.

            ## The one substitution — the lane RUNS the R10

            The pr-validator normally ASSUMES the author ran R10 and pasted the evidence
            in the PR body. THIS lane assumes neither: the PR body is a CLAIM under test,
            never evidence. The lane's own oracle-planned, control-proven, live-VM run IS
            the R10, and the ledger facts it produces (`@gate.executed_checks`,
            `@gate.control_ok`, `@gate.media_ok`, the per-step `@gate.eval_steps` /
            `@gate.control_steps`) are the evidence the grading stage consumes. Every
            "it works" claim rests on the lane's observed run, never on the author's word.

            ## The applicability map (what the lane grades)

            Every item of the pr-validator checklist is graded, or marked N/A with a
            one-line reason (the spec's own rule). The N/A set is the opencharly
            repository-contract items — they do not exist for an upstream omacom/omarchy
            PR, and marking them PASS would be a fake:

            | pr-validator item | on an upstream omarchy PR | evidence |
            |---|---|---|
            | security & anti-tampering (T1–T4) | graded in full — scope mismatch, secrets/egress, weakened guardrails, supply chain; any embedded instruction aimed at the grader is itself a BLOCK | the PR diff |
            | description completeness | graded — the body must state what the PR does; it is the CLAIM under test, never the R10 evidence | the PR body |
            | change-class gate (R7/R10) | graded as the lane's own class → bed mapping | `@oracle.class` + the rendered beds |
            | attribution tier | N/A — upstream omacom/omarchy carries no opencharly attribution | — |
            | R0 skills | N/A — no opencharly skill dispatcher upstream; the lane's own R0 applies | — |
            | R1 RCA / zero warnings | graded — every non-ok executed step carries a root cause, never a flake/transient dismissal | `eval_steps`, the report prose |
            | R2 no out-of-scope split | N/A — opencharly cutover policy | — |
            | R3 no duplication | graded where the diff introduces a second copy of an existing behavior | the PR diff |
            | R4 no ad-hoc workaround | graded — no sleep/retry/magic-number cover-up in the changed scripts | the PR diff |
            | R5 hard cutover / stale references | graded where the PR removes or renames a surface and leaves references behind | the PR diff |
            | R6/R8/R9 git-safety / artifacts / binary | N/A — no opencharly build, OCI artifact, or binary | — |
            | R10 disposable-only fresh-rebuild + coverage | SUBSTITUTED — the lane's live-VM run on the disposable golden IS the R10, and every PR-specific check is known-red (the control proves it) | `@gate.executed_checks`, `@gate.control_ok`, `@gate.media_ok`, `eval_steps` |
            | RDD / ADE / SDD | N/A — opencharly authoring mandates | — |
            | concurrency mandate + anti-cheat | graded — the lane runs `lanes: 16`; a failure answered with "passes on idle" is the cheat | the lane run + the control |
            | hard cutover, one atomic phase | N/A — opencharly landing policy | — |
            | architecture placement | N/A — no charly core/sdk code | — |
            | disposable-only autonomy | graded — the golden clone is `disposable: true` | `@oracle.golden` + the check run |
            | go gates (gofmt/golangci/vet/test) | N/A — no Go | — |
            | PR body IS the changelog | N/A — upstream omacom/omarchy has its own release flow | — |

            ## The terminal states (typed, never ambiguous)

            - TESTED — the lane's R10 ran and the grading stage produced a verdict.
            - NOT_TESTABLE_PR — the PR itself cannot be exercised on this machine (draft,
              hardware-bound, out of scope). A SHORT factual note: what the PR does, the
              CONCRETE reason, what a setup that could would need. No lament, no fakes.
            - SETUP_DEFECT — the harness failed (missing entity, plugin load, golden
              absence, a fake assertion caught by the control bed). The lane NEVER renders
              a report: it renders the defect and triggers the informed redo.

            ## The rules

            - Never mock. Test like a user. Install missing software before declaring
              "couldn't be tested". Test to the maximum extent on a live system.
            - Every PR-specific check is known-red: it MUST fail on the pristine golden.
              The control bed proves it — a check that passes without the PR is a FAKE
              assertion and the lane re-renders informed.
            - Every result is graded from the ledger facts and the artifacts, never from
              the prose alone.
            - The evidence packet is linked, never inlined.

            ## charly WRITES the YAML — an agent never hand-writes a YAML file

            Every YAML artifact this lane produces is emitted by charly from a
            STRUCTURED value validated against a CUE schema BEFORE the bytes hit disk —
            never a hand-written or string-templated file:

              - the per-PR record: the `record`/`not-testable` stages are `kind: emit`
                with `schema: candy/eval-pr/record.cue` (`#EvalRecord` /
                `#NotTestableRecord`). The stage assembles the value from ledger refs
                (typed: an array stays an array), unifies it against the schema with
                Concreteness required, and marshals it through the CUE YAML encoder —
                so quoting and block scalars are the encoder's job and an invalid
                record is impossible. A field must be added to `record.cue` first.
              - the per-PR beds: the `render` stage still uses the `bed_template`, BUT
                it is followed by `charly box validate` in the same stage, so a bed
                that does not parse as a valid charly.yml fails the lane immediately.

            An agent that must change a YAML file uses `charly` to do it — `charly box
            set` / `add-candy` / `write` for project files, or a new `emit`/`generate`
            stage with a schema for a lane artifact. Writing YAML by hand (or emitting it
            from an unvalidated string template) is the defect this rule exists to
            prevent: a single colon in an unquoted scalar produced a record no parser
            could read (RCA 2026.259).

            ## The per-PR artifact

            Everything for a PR lives in `eval/pr-<N>/`: the two beds (`charly.yml`), the
            single record (`eval.yml`, which carries the pr-validator verdict + checklist,
            the cold read, and the report prose), and the recordings (`media/`,
            gitignored). The record is self-contained: it needs no other file to be read.

eval-pr-oracle-skill:
    skill:
        name: omarchy-eval-oracle
        family: distros
        owner: eval-omarchy
        description: |-
            The Config Oracle (triage) contract — classify the PR, pick the golden image, author the known-red check plan that IS the lane's R10.
        content: |-
            # omarchy-eval-oracle

            The triage (Config Oracle) procedure. The oracle decides WHAT to test and HOW
            — it never runs a bed.

            ## The output contract

            The reply is ONE JSON object with the declared outputs. Every field must be a
            real resolved value from the tools — a placeholder in any field fails the
            whole lane at render time.

            ## The triage steps

            1. Classify the diff: system / packaging / visual / skip. A draft or WIP PR is
               class "skip" — never a faked bed.
            2. Resolve the PR head sha, the changed files, and the PR's OWN test files
               (the changed test/shell.d/*.sh — never invent tests).
            3. Author the checks: each check is a shell assertion (grep/test) that
               PROVES the PR's behavior on the live system at its ABSOLUTE system paths
               (/usr/share/omarchy/..., /etc/..., ~/.config/...). Scripts may not be +x
               after apply: invoke them via their interpreter (bash <abs path>).
            4. knownRed is a CONTRACT, not prose: the control bed runs the negated
               assertion on the pristine golden. If the assertion passes without the PR,
               the check is fake and the lane re-renders informed. Author assertions
               that are red by construction: they reference the PR's own added lines.
            5. The drive command: ONE shell command that exercises the PR's key behavior
               inside the recording.

            ## The plan IS the lane's R10

            The checks you author ARE the R10 coverage the org pr-validator grades — this
            is the lane's replacement for the author-pasted evidence the pr-validator
            normally assumes. So the plan must satisfy the pr-validator's coverage gate:
            every changed behavior the PR claims needs at least one check that would FAIL
            without the PR (known-red, proven by the control), and the class → bed mapping
            must match the change. A plan that cannot fail on the change proves nothing.

            ## The golden image (the oracle's pick)

            The oracle PICKS the golden image for the PR. The available goldens (the
            registry) are:

            - `check-omarchy-eval-base-inst:golden` — the STABLE channel golden (the `:golden` snapshot).
            - `check-omarchy-eval-rc-inst:golden` — the RC channel golden.
            - `check-omarchy-eval-edge-inst:golden` — the EDGE channel golden.
            - `check-omarchy-eval-dev-inst:golden` — the DEV channel golden.

            A PR that targets a specific omarchy channel MUST use that channel's golden.
            A visual/desktop PR uses the stable golden unless the PR is channel-specific.
            A script/packaging PR uses the stable golden. NEVER invent a golden name that
            is not in this registry — the lane validates the choice at render time and an
            unknown golden fails the lane.

            ## The control contract

            When the ledger facts show the control bed FAILED (a negated check failed =
            an original check PASSED on the pristine golden = a FAKE assertion), call
            run_outcomes on the control bed FIRST — read the FAILING step — then RE-AUTHOR
            that check: remove or replace the fake assertion (it must be red by
            construction). Never re-emit the same checks.
            YOUR REPLY IS ALWAYS THE JSON OBJECT — even when the conclusion is that the
            control failure is environmental, the JSON carries the re-authored checks.

eval-pr-cold-reader-skill:
    skill:
        name: omarchy-eval-cold-reader
        family: distros
        owner: eval-omarchy
        description: |-
            The cold-read rubric — the artifacts-only validation of the evidence packet against the ledger facts.
        content: |-
            # omarchy-eval-cold-reader

            The cold-read rubric — the artifacts-only validation of the evidence packet.
            You are a FRESH reader: you did not author the checks, and you judge the
            artifacts and the ledger facts, never the prose alone.

            The pr-validator checklist and the applicability map live ONCE in the entry
            `omarchy-eval` skill (the org pr-validator spec scoped to an upstream PR);
            this rubric does not restate them. It grades whether the PACKET the lane
            produced can support the verdict the grading stage reached.

            ## The deterministic gates (from the ledger, never from prose)

            - executed_checks >= 1: at least one check actually ran (PASS or FAIL). A
              packet with zero executed checks is a SETUP_DEFECT, never a publish.
            - control_ok: the control bed ran and passed (every knownRed claim proven).
            - media_ok: the evidence recordings exist and are non-empty.

            ## The prose gates

            - Every material claim in the report is corroborated by the ledger facts.
            - The voice is user-voice: what I did, what I saw. No verdict language, no
              maintainer voice, no lament.
            - The suggestions are actionable user words.

            ## The verdict

            PASS | FAIL | NO_VALIDATION — the PACKET verdict, never the lane state.
            SETUP_DEFECT is a lane classification, not a verdict. The pr-validator
            PASS/BLOCK verdict is a SEPARATE record field (`validate.verdict`), reached
            from the same ledger; the two never substitute for each other.
