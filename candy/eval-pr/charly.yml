# candy/eval-pr/charly.yml — the minimal omarchy PR-eval lane wiring + skills.
#
# ONE self-contained per-PR evaluation: an instrumented golden clone, the PR
# applied via the single pr-apply seam, the oracle's known-red checks + the drive
# recording, and the NEGATIVE CONTROL (the same checks negated on the pristine
# golden). Everything the run produces lands in ONE directory:
#
#   eval/pr-<N>/charly.yml   — both beds (treatment + control entities, COMMITTED)
#   eval/pr-<N>/eval.yml     — the single record: oracle + eval + control + gates
#                              + pr-validator verdict/checklist + cold-read + the
#                              user-voice report + media links
#   eval/pr-<N>/media/       — the recordings (GITIGNORED)
#
# The pipeline entity is eval-pr-plan (in the project charly.yml). Each skill's
# BODY is the SINGLE SOURCE, authored at .agents/skills/<name>/SKILL.md (the repo
# root); the `skill:` entities below carry the metadata and route to it. `charly
# marketplace generate` projects each to marketplace/distros/skills/<name>/SKILL.md
# (family: distros). The lane's eval-pr-plan consumes that corpus via skills.corpus.
#
# The lane grades the PR against the ORG-WIDE pr-validator criteria (the
# `pr-validator-agent` skill entity in opencharly/layer-charly-internals-extra,
# projected to marketplace/internals/agents/pr-validator.md) — but with ONE
# substitution: the pr-validator normally ASSUMES the author ran R10 and pasted
# the evidence, whereas THIS lane RUNS the R10 itself (the oracle-planned,
# control-proven, live-VM run) and feeds its ledger facts to the grading stage.

eval-pr:
  candy:
    description: |-
      The minimal omarchy PR-eval lane: one disposable golden clone per PR, the
      PR applied via the pr-apply seam, known-red checks proven by a negative
      control, both recording lanes, the org pr-validator checklist graded from
      the lane's own R10 ledger, and ONE self-contained eval/pr-<N>/eval.yml
      record. Composes the generic pipeline engine + the PR tools.
    candy:
      - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.295.0740'
      - '@github.com/opencharly/plugin-review/candy/plugin-review:v2026.272.0450'
    var:
      EVAL_LANES: "16"
      EVAL_REPO: omacom/omarchy
    env_require:
      - name: EVAL_UMBRELLA
        description: "Path to the opencharly umbrella checkout (the skills corpus root)"
        default: ""
    env_accept:
      - name: EVAL_LLM_BASE_URL
        description: "LLM chat-completions base URL (default: the local ollama server)"
      - name: EVAL_LLM_MODEL
        description: "LLM model id (default: deepseek-v4.1-flash:cloud on the local ollama)"
      - name: EVAL_LLM_PROVIDER
        description: "LLM provider name"
      - name: EVAL_DRY_RUN
        description: "Dry-run flag"
      - name: EVAL_DEBUG
        description: "Verbose run debugging"
      - name: EVAL_LANES
        description: "Concurrency lanes"
      - name: EVAL_PUBLISH
        description: "approve -> the publication gate posts"
      - name: BARE_PROMPT
        description: "Inline prompt for the standalone agent surface"
    secret_accept:
      - name: EVAL_LLM_API_KEY
        description: "LLM provider API key"
        key: charly/api-key/eval-llm
    plan:
      - check: the pipeline executor self-tests
        id: ade-pipeline-present
        context: [runtime]
        command: charly pipeline --self-test
        exit_status: 0
      - check: the v2 pipeline entity validates against #PipelineInput
        id: ade-pipeline-valid
        context: [runtime]
        command: charly pipeline validate eval-pr-plan
        exit_status: 0

eval-pr-entry-skill:
    skill:
        name: omarchy-eval
        family: distros
        owner: eval-pr
        description: |-
            The omarchy PR-eval lane procedure — graded by the org pr-validator criteria, with the lane itself running the R10 the pr-validator would otherwise assume.

eval-pr-oracle-skill:
    skill:
        name: omarchy-eval-oracle
        family: distros
        owner: eval-pr
        description: |-
            The Config Oracle (triage) contract — classify the PR, pick the golden image, author the known-red check plan that IS the lane's R10.

eval-pr-cold-reader-skill:
    skill:
        name: omarchy-eval-cold-reader
        family: distros
        owner: eval-pr
        description: |-
            The cold-read rubric — the artifacts-only validation of the evidence packet against the ledger facts.
