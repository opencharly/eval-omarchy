# The omarchy test-corpus equivalence manifest.
#
# The charly-native translation is INCREMENTAL: each wave maps a batch of
# omarchy test files to their covering charly steps, and the coverage
# counters record the honest state. A mapped entry's steps are exercised by
# the corpus beds (the check-live proof). An unmapped file is a translation-
# batch todo — never a faked pass.
#
# THE LANE'S GAP SURFACE: a SETUP_DEFECT is recorded when the ORACLE selects
# a corpus bed the registry does not carry (the oracle's real failure mode),
# and when a NEW upstream test file lands with no covering bed (the
# registry's coverage counter against the upstream corpus makes it visible).
#
# class: runnable | partial (the hardware-bound / nested-VM classes are
# mapped but honestly not runnable on this venue - PARTIAL with the reason).
omarchy_ref: quattro
corpus_source: applied PR tree (/usr/share/omarchy after pr-apply)
coverage:
    cli: { mapped: 1, upstream_files: 1, note: the whole cli suite maps to the cli-help batch }
    shell: { mapped: 2, upstream_files: 237, note: the remaining files are the later translation batches (Waves 4) }
    acceptance: { mapped: 0, upstream_files: 9, note: Wave 5 }
suites:
    cli:
        upstream: test/cli
        mapped:
            - { file: test/cli, steps: [cli-help-renders, cli-help-hw, cli-help-pkg] }
    shell:
        upstream: test/shell.d/*-test.sh (237 files)
        mapped:
            - { file: test/shell.d/config-test.sh, steps: [shell-config-valid-json, shell-config-version-1, shell-config-bar-layouts, shell-config-clock-format] }
            - { file: test/shell.d/notifications-test.sh, steps: [notifications-logic-present] }
    acceptance:
        upstream: test/acceptance.d/*-test.sh (9 files)
        mapped: []
    partial:
        # the hardware-bound / nested-VM classes - mapped but not runnable on
        # this venue, with the reason recorded (the tiers skill: PARTIAL,
        # never a faked pass)
        - { files: [hw-*, t2-*, brcmfmac-*, hybrid-gpu-*, windows-vm-*], reason: the venue lacks the hardware / the nested substrate }
