omarchy-corpus:
    candy:
        version: 2026.253.2700
        description: |-
            The charly-native equivalents of omarchy's own tests - the
            declarative translation of the omacom/omarchy test corpus into
            check plans served by the charly verb catalog. One check step per
            upstream assertion, grouped by feature. registry.yaml maps every
            omarchy test file to its covering steps; a test file with no step
            is a registry gap (a SETUP_DEFECT record, never a faked pass).
            The corpus runs against the eval VM (the installed product after
            pr-apply) via the lane's check-live surface - a corpus result is a
            live-system claim (tier-2).
        distro:
            arch:
                # the tool manifest (M7): the acceptance helpers upstream's own
                # tests need — grim (screenshot), tesseract (OCR), wtype (input),
                # jq (state assertions). The golden carries them so the
                # corroboration lane can run upstream's OWN test files live.
                package: [jq, tesseract, grim, wtype]
        plan:
            # the upstream test tree (M7): the quattro/test corpus at the pinned
            # hash, carried on the golden so the corroboration lane executes
            # upstream's OWN test files (bash <file>) — the charly-native
            # translation is strictly stronger, the upstream run is the
            # corroboration fact. A run: step on the install timeline (the
            # install ledger skips it on re-apply).
            - run: fetch the upstream quattro/test tree at the pinned hash
              id: corpus-fetch-upstream-tests
              command: |
                  set -eu
                  rm -rf /opt/omarchy-upstream-test
                  mkdir -p /opt/omarchy-upstream-test
                  curl -fsSL https://github.com/omacom/omarchy/archive/8ea51516390320f8e768808b230098e67bdaa82c.tar.gz | tar -xz --strip-components=1 -C /opt/omarchy-upstream-test
                  test -d /opt/omarchy-upstream-test/test/shell.d
                  test -d /opt/omarchy-upstream-test/test/acceptance.d

            # === test/cli - the omarchy CLI suite ===
            - check: the omarchy CLI main help renders the command-center banner
              id: cli-help-renders
              context: [runtime]
              omarchy:
                  args: --help
              stdout:
                  - contains: Omarchy command center
            - check: the omarchy CLI main help includes the hardware group
              id: cli-help-hw
              context: [runtime]
              omarchy:
                  args: --help
              stdout:
                  - contains: hw
            - check: the omarchy CLI main help includes the package group
              id: cli-help-pkg
              context: [runtime]
              omarchy:
                  args: --help
              stdout:
                  - contains: pkg
            # === test/shell.d/config-test.sh - the default shell.json ===
            - check: the default shell.json is valid JSON
              id: shell-config-valid-json
              context: [runtime]
              command: 'jq empty /usr/share/omarchy/config/omarchy/shell.json'
            - check: the default shell.json has a version-1 bar layout
              id: shell-config-version-1
              context: [runtime]
              command: 'jq -e ".version == 1" /usr/share/omarchy/config/omarchy/shell.json'
            - check: the default shell.json bar layout carries left/center/right arrays
              id: shell-config-bar-layouts
              context: [runtime]
              command: 'jq -e ".bar.layout.left | length > 0" /usr/share/omarchy/config/omarchy/shell.json && jq -e ".bar.layout.center | length > 0" /usr/share/omarchy/config/omarchy/shell.json && jq -e ".bar.layout.right | length > 0" /usr/share/omarchy/config/omarchy/shell.json'
            - check: the default clock carries the week-format alt date (no leading zero)
              id: shell-config-clock-format
              context: [runtime]
              command: 'jq -r ".bar.layout.center[].formatAlt? // empty" /usr/share/omarchy/config/omarchy/shell.json | grep -q "ww yyyy"'
            # === test/acceptance.d - the ocr surface assertion (the wl: ocr method's live proof) ===
            - check: the ocr reads the shell's update prompt off the screen (the native-res capture + tesseract; the always-on shell unit renders it — the retry rides the shell's render window)
              id: ocr-screen-text
              context: [runtime]
              eventually: 120s
              retry_interval: 5s
              wl:
                  method: ocr
                  text: Update System
            # === test/shell.d/bar-test.sh - the bar QML invariants (the applied-tree scans) ===
            - check: bar module dragging leaves layout-managed slots in place (the Bar.qml scan)
              id: bar-drag-no-slot-mutation
              context: [runtime]
              command: 'perl -0ne "exit(/drag\\s*\\.\\s*target\\s*:\\s*[^;]*\\bslot\\b/s ? 1 : 0)" /usr/share/omarchy/shell/plugins/bar/Bar.qml'
            - check: the bar move outline has no post-release settling state
              id: bar-move-no-settle
              context: [runtime]
              command: '! rg -q "barMoveSettling|barMoveSettleTimer" /usr/share/omarchy/shell/plugins/bar/Bar.qml'
            # === test/shell.d/hyprland-default-config-test.sh - the default bindings ===
            - check: the default hyprland config applies without a lua syntax error (the installed bindings source)
              id: hyprland-default-config-parses
              context: [runtime]
              command: 'test -s /usr/share/omarchy/config/hypr/bindings.lua && test -s /usr/share/omarchy/config/hypr/hyprland.lua'
            # === test/shell.d/update-* - the update machinery ===
            - check: the omarchy update command center is discoverable (the CLI help names update)
              id: update-cli-discoverable
              context: [runtime]
              omarchy:
                  args: update --help
              stdout:
                  - contains: update

            # === test/acceptance.d/session-test.sh - the session health (the wl/quickshell surfaces) ===
            - check: the omarchy shell responds to the quickshell IPC ping
              id: accept-shell-ping
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy omarchy-shell shell ping'
            - check: the bar and background layers are on screen (the shell layer surfaces)
              id: accept-bar-background-layers
              context: [runtime]
              wl:
                  method: hypr-layers
              stdout:
                  - contains: omarchy-bar
            - check: the root filesystem is btrfs as installed
              id: accept-root-btrfs
              context: [runtime]
              command: 'test "$(findmnt -no FSTYPE /)" = btrfs'
            - check: omarchy-version works
              id: accept-omarchy-version
              context: [runtime]
              omarchy:
                  args: version
            - check: pipewire is running (the audio stack)
              id: accept-pipewire-running
              context: [runtime]
              command: 'wpctl status >/dev/null'
            # === test/shell.d/battery-test.sh - the battery model (the applied-tree module) ===
            - check: the battery model module is installed with the discharging-state logic
              id: battery-model-present
              context: [runtime]
              command: 'test -s /usr/share/omarchy/shell/plugins/services/battery/BatteryModel.js && grep -q isDischarging /usr/share/omarchy/shell/plugins/services/battery/BatteryModel.js'
            # === test/shell.d/bluetooth-test.sh - the bluetooth panel (the applied-tree scans) ===
            - check: the bt-agent unit carries the no-Bluetooth-hardware skip guard (ConditionPathIsDirectory=/sys/class/bluetooth)
              id: bluetooth-bt-agent-guard
              context: [runtime]
              command: 'grep -q "ConditionPathIsDirectory=/sys/class/bluetooth" /usr/share/omarchy/default/systemd/user/bt-agent.service'
            - check: the bluetooth panel model module is installed
              id: bluetooth-panel-model
              context: [runtime]
              command: 'test -s /usr/share/omarchy/shell/plugins/panels/bluetooth/Model.js'
            # === test/shell.d/clipboard-test.sh - the clipboard history model ===
            - check: the clipboard history model module is installed
              id: clipboard-model-present
              context: [runtime]
              command: 'test -s /usr/share/omarchy/shell/plugins/clipboard/ClipboardHistory.js'
            # === test/acceptance.d/system-test.sh - the installed system audit ===
            - check: the omarchy core package manifest is installed
              id: accept-core-manifest
              context: [runtime]
              command: 'test -s /usr/share/omarchy/install/omarchy-base.packages'
            - check: chromium is the default browser (the omarchy CLI default)
              id: accept-default-browser
              context: [runtime]
              omarchy:
                  args: default browser
              stdout:
                  - contains: chromium
            # === test/acceptance.d/cups-test.sh - the print service ===
            - check: the cups print service unit is installed and enabled
              id: accept-cups-unit
              context: [runtime]
              command: 'test -s /usr/lib/systemd/system/cups.service && systemctl is-enabled cups.service >/dev/null'
            # === test/shell.d/notifications-test.sh - the notifications logic ===
            - check: the notifications logic module is installed with the chromium-derived heuristic
              id: notifications-logic-present
              context: [runtime]
              command: 'test -s /usr/share/omarchy/shell/plugins/notifications/NotificationLogic.js && grep -q isChromiumDerived /usr/share/omarchy/shell/plugins/notifications/NotificationLogic.js'
