# the acceptance plugin meta-candy (R3): composes the 7 plugin providers the
# acceptance beds need. Each bed's add_candy is just [omarchy-accept-plugins,
# omarchy-corpus] — the 9-line list collapsed to one ref.
omarchy-accept-plugins:
    candy:
        version: 2026.253.2700
        description: |-
            The acceptance plugin meta-candy: composes the record/spice/omarchy/
            wl/quickshell/dbus/media plugin providers for the acceptance
            beds. The providers register at check-run time (the 'no provider
            registered' lesson — never baked); the canary dispatches the omarchy
            version verb through the host registry to prove the composition
            registers.
        candy:
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.254.0459'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.254.0449'
            - '@github.com/opencharly/plugin-omarchy/candy/plugin-omarchy:v2026.253.1645'
            - '@github.com/opencharly/plugin-wl/candy/plugin-wl:v2026.254.0527'
            - '@github.com/opencharly/plugin-quickshell/candy/plugin-quickshell:v2026.243.1942'
            - '@github.com/opencharly/plugin-dbus/candy/plugin-dbus:v2026.242.0556'
            - '@github.com/opencharly/plugin-media/candy/plugin-media:v2026.254.0445'
        plan:
            - check: the acceptance plugin providers are registered (the meta-candy's composition)
              id: accept-plugins-present
              context: [runtime]
              omarchy: {method: version}
              stdout:
                  - matches: '^[0-9]+.[0-9]+.[0-9]+'
