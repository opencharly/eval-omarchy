omarchy-eval-harden:
    candy:
        version: 2026.248.0100
        description: |
            The eval-lane golden hardening whose steps run at DEPLOY time (the only
            mutation path the check-run honors — plan `run:` steps are verify-only
            skips by design). Installs: the guest sshd MaxStartups raise (the wave's
            ssh burst refused the pulls), the pr-apply bare-clone pre-seed (the batch
            PR heads pre-fetched — the per-lane apply fully local), and the guest
            charly warm (the resolution cache filled for the deploy's own refs).
        plan:
            - run: raise the guest sshd MaxStartups (the eval-wave ssh burst refused the default 10:30:100 — the rec-stop .cast pulls failed)
              id: hard-sshd
              command: 'printf "\nMaxStartups 200:60:200\n" >> /etc/ssh/sshd_config; systemctl restart sshd >/dev/null 2>&1 || true'
            - run: pre-seed the pr-apply bare clone with the FULL eval head set and VERIFY every head object (a silent fetch failure makes every pr-apply for that PR a silent no-op; R3 cutover - this candy is the ONE canonical preseed, the entity-plan duplicate is removed)
              id: hard-preseed
              command: |
                  set -eu
                  R=/root/.cache/omarchy-pr-apply.git
                  if [ ! -d "$R" ]; then git clone --bare -q https://github.com/omacom/omarchy "$R"; fi
                  HEADS='0681cadf28aae14f9cc46271ecb2af76e5958a36 075feebd8248a31f35a8c5914083bdb0f0aa615b 16a6ede2687255e198281a11969152a33d1d337a 21992f03f72c2b15bdeb135e9ae8e8bb21274e95 2f44cf431c58fb7e796e6f54e8dfac2c14bb2a52 38c07810ee3d06e22eaa069c630d7a33fbbf3475 399665b58a317c50ff134555a9d9188d10ab4c9e 411736590c4e6699d43980c511c843bfb3052b5a 4e022c0940ab2630e8d0ac46c597dc94b2981ce8 51bbe4a4ea03bccd51f53ce0882db96fef233c79 51c4cf8148922ccb6f213f6f399856ace93bff32 5245d3f78e077e1efd3d0a662900f0f921ab08ad 65fa55975f6e54757d3a087534f107b28005077b 6be10b410a14114cf75007ae2a2b1054c793aa42 6e735dde6b505d6de73977ec6650b997b6d970f4 6ebb7e1b319a9f477d8242d02fefa62e886339bb 70047956fac8bdfe36aabb9dea82b4eee50e1b2c 73a09695f98c7d4c95d88040b5876c858cc5e02e 7afa9ddd518fc2c1dda38033f5f4c54c5c05f4ad 87f2bf1e72e60de3a49531f0e65aeb7c5d4f5f02 977e0fcdc2ca46b2fbf7dbeab6bd5b29b49b1398 a3e951158dcac624ced50d4df9b0a33e68539468 a68df9c8cac7a78925001006fe64d9f7bfbf9429 b9f53d4bbdd64900cb0f66a3ac0d4eac36811bc2 ca17c1854aca4c0ed4d1bcd7818e4132c172ad05 d06853a760955a09ef5a014a4f28584c6d1f0ec9 e13b3b4f83010ebeb894dc34f478a054b945cb39 e523d5da1699c5d2fc6adec2c628c9f34ae0ce0d e65f2f6c5f2cb015ca5cd4a841e9f4d6d64b7008 e9d011328f230aab529d4020499222eb15343c3c ecb69659d9d66cb56ec2b8a5a1f9bf846e8ebe2d f0bc41fb263362cdf8fcdb3b14ea9ac024c17a32'
                  for h in $HEADS; do git -C "$R" fetch -q origin "$h" || true; done
                  for h in $HEADS; do git -C "$R" cat-file -e "$h^{commit}" || { echo "preseed: head object $h missing - the fetch silently failed"; exit 1; }; done
            - run: disable every screenlocker path (a lock overlay blanks the SPICE capture; RCA 2026.252 - the golden sat at a rendered lock screen while a cloned bed showed the bare 0x111111 background; RCA 2026.253.2216 - the shell's OWN idle plugin (omarchy.idle) arms screensaver+lock after 150s/300s idle, so the provision bed locked mid-run and every screen check observed the lock screen - the stay-awake state file disables it, and the shell's dir watcher picks it up mid-session)
              id: hard-disable-screenlock
              command: 'systemctl --global mask omarchy-sleep-lock.service 2>/dev/null || true; systemctl --global mask hyprlock.service 2>/dev/null || true; systemctl --user disable --now hypridle.service 2>/dev/null || true; mkdir -p "$HOME/.local/state/omarchy/indicators" && touch "$HOME/.local/state/omarchy/indicators/stay-awake"; true'
            - run: ensure the agg gif generator binary is present (the asciinema candy download is transient-failure-prone - a golden without agg fails every rec-gif step)
              id: hard-ensure-agg
              command: 'test -x /usr/local/bin/agg || { curl -fsSL https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu -o /usr/local/bin/agg && chmod 0755 /usr/local/bin/agg; }; test -x /usr/local/bin/agg'
            - run: install an always-on shell launcher unit (the omarchy shell launches ONLY via the first-run onboarding; the golden bakes the COMPLETED first-run state so clones never launch the shell - RCA 2026.252, the bed ran 3x with a bare 0x111111 desktop)
              id: hard-shell-unit
              command: |
                  set -eu
                  printf '%s\n' '[Unit]' 'Description=Omarchy eval shell (always-on for eval beds)' 'PartOf=graphical-session.target' 'After=graphical-session.target' '' '[Service]' 'ExecStart=/usr/bin/quickshell -p /usr/share/omarchy/shell' '' '[Install]' 'WantedBy=graphical-session.target' > /etc/systemd/user/omarchy-eval-shell.service
                  systemctl --global enable omarchy-eval-shell.service
            - run: warm the guest charly resolution cache (the deploy's refs resolve locally at the first bed run)
              id: hard-warm
              command: 'charly box list >/dev/null 2>&1 || true; true'
            - check: the guest sshd carries the raised MaxStartups
              id: hard-check-sshd
              command: 'grep -q "^MaxStartups 200" /etc/ssh/sshd_config'
            - check: the pr-apply pre-seed clone exists with the head objects
              id: hard-check-preseed
              command: 'sudo -n test -d /root/.cache/omarchy-pr-apply.git'

