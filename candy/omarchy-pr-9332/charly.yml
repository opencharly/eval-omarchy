omarchy-pr-9332:
    candy:
        version: 2026.244.0000
        description: |
            Applies PR #9332 (omacom/omarchy) to the omarchy system at BUILD time:
            fetches the PR head and installs its changed files over the installed
            tree. The PR migrates hybrid GPU switching from supergfxctl to
            cardwire: bin/omarchy-hw-hybrid-gpu and bin/omarchy-toggle-hybrid-gpu
            now drive cardwire (install + enable cardwired, retire a leftover
            supergfxd, query via `cardwire get`, switch via `cardwire set`), and
            the supergfxd-only workarounds (force-igpu sleep hook,
            supergfxd.service.d delay-start drop-in) are dropped from the
            installed default tree. A candy's run steps are the install timeline —
            they emit as Containerfile RUN directives (as root), so the PR's files
            land in the image once, and the checks that follow are idempotent
            state/behavior assertions with no side effects.
        plan:
            - run: fetch PR #9332's head and install its changed files
              id: pr-apply
              command: |
                  set -eu
                  rm -rf /tmp/pr-src
                  git init -q /tmp/pr-src
                  cd /tmp/pr-src
                  git remote add origin https://github.com/omacom/omarchy
                  git fetch -q --depth 1 origin pull/9332/head
                  git checkout -q FETCH_HEAD
                  cp bin/omarchy-hw-hybrid-gpu /usr/share/omarchy/bin/omarchy-hw-hybrid-gpu
                  cp bin/omarchy-toggle-hybrid-gpu /usr/share/omarchy/bin/omarchy-toggle-hybrid-gpu
                  rm -f /usr/share/omarchy/default/systemd/system-sleep/force-igpu
                  rm -rf /usr/share/omarchy/default/systemd/system/supergfxd.service.d
            - check: the PR's cardwire-based scripts are installed
              id: pr-applied
              context:
                - build
              file:
                  file: /usr/share/omarchy/bin/omarchy-toggle-hybrid-gpu
                  exists: true
