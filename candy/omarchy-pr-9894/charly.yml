omarchy-pr-9894:
    candy:
        version: 2026.244.0000
        description: |
            Applies PR #9894 (omacom/omarchy) to the omarchy system at BUILD time:
            fetches the PR head and installs its changed files over the installed
            tree. The PR fixes the Tailscale panel failing to reconnect when
            accept-routes is enabled: Model.js resumes via the localapi prefs PATCH
            (WantRunning) instead of `tailscale up` (which refuses when a saved
            option differs from its flag defaults) and uses login-interactive for
            authorization; Panel.qml shows a connecting state and gates peers/exit
            nodes on tailscale.running. A candy's run steps are the install timeline
            — they emit as Containerfile RUN directives (as root), so the PR's files
            land in the image once, and the checks that follow are idempotent
            state/behavior assertions with no side effects.
        plan:
            - run: fetch PR #9894's head and install its changed files
              id: pr-apply
              command: |
                  set -eu
                  rm -rf /tmp/pr-src
                  git init -q /tmp/pr-src
                  cd /tmp/pr-src
                  git remote add origin https://github.com/omacom/omarchy
                  git fetch -q --depth 1 origin pull/9894/head
                  git checkout -q FETCH_HEAD
                  cp shell/plugins/panels/tailscale/Model.js /usr/share/omarchy/shell/plugins/panels/tailscale/Model.js
                  cp shell/plugins/panels/tailscale/Panel.qml /usr/share/omarchy/shell/plugins/panels/tailscale/Panel.qml
                  cp shell/plugins/panels/tailscale/Service.qml /usr/share/omarchy/shell/plugins/panels/tailscale/Service.qml
            - check: the PR's tailscale panel files are installed
              id: pr-applied
              context:
                - build
              file:
                  file: /usr/share/omarchy/shell/plugins/panels/tailscale/Model.js
                  exists: true
