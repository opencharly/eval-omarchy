# candy/eval-lane/charly.yml — the omarchy PR-eval lane skill corpus.
#
# The skill BODIES below are the SINGLE SOURCE. `charly marketplace generate`
# (rooted at the opencharly/marketplace refs list) projects each entity to
# marketplace/distros/skills/<name>/SKILL.md (family: distros). The lane's
# eval-lane-plan pipeline consumes that generated corpus via
# skills.corpus: "$env.EVAL_UMBRELLA/marketplace/distros/skills".
#
# DO NOT re-add hand-authored candy/eval-lane/skills/*/SKILL.md files.

omarchy-eval-skill:
    skill:
        name: omarchy-eval
        family: distros
        owner: eval-omarchy
        description: |-
            The omarchy PR-eval lane procedure — the terminal states, the never-mock rule, known-red checks, the control bed, and cold-read validation.
        content: |-
            # omarchy-eval

            The omarchy PR-eval lane procedure. Every agent in the lane follows this; the
            stage prompts point here and never restate it.

            ## The lane's job

            Evaluate an omacom/omarchy PR the way another user would: apply the PR to a
            real omarchy system, use it, and report what happened — on a disposable
            golden-VM bed, with full evidence rigor.

            ## The terminal states (typed, never ambiguous)

            - TESTED — real observed outcomes; renders the user-voice report.
            - NOT_TESTABLE_PR — the PR itself cannot be exercised on this machine (draft,
              hardware-bound, out of scope). A SHORT factual note: what the PR does, the
              CONCRETE reason this setup cannot exercise it, what a setup that could
              would need. No lament, no fake outcomes.
            - SETUP_DEFECT — the harness failed (missing entity, plugin load, golden
              absence, a fake assertion caught by the control bed). The lane NEVER
              renders a report: it renders a structured defect record and triggers the
              informed reconfiguration.

            ## The rules

            - Never mock. Test like a user. Install missing software before declaring
              "couldn't be tested". Test to the maximum extent on a live system.
            - Every PR-specific check is known-red: it MUST fail on the pristine golden.
              The control bed proves it — a check that passes without the PR is a FAKE
              assertion and the lane re-renders informed.
            - Every result is cold-read validated against the ledger, never against prose.
            - The evidence packet is linked, never inlined.

omarchy-eval-oracle-skill:
    skill:
        name: omarchy-eval-oracle
        family: distros
        owner: eval-omarchy
        description: |-
            The Config Oracle (triage) contract — classify the PR, pick the channel golden, author the known-red check plan and the corpus selection.
        content: |-
            # omarchy-eval-oracle

            The triage (Config Oracle) procedure. The oracle decides WHAT to test and HOW
            — it never runs a bed.

            ## The output contract

            The reply is ONE JSON object with the declared outputs. Every field must be a
            real resolved value from the tools — a placeholder in any field fails the
            whole lane at render time.

            ## The triage steps

            1. Classify the diff (the venue ladder): system / packaging / visual / skip.
               A draft or WIP PR is class "skip" — never a faked bed.
            2. Resolve the PR head sha, the changed files, and the PR's OWN test files
               (the changed test/shell.d/*.sh — never invent tests).
            3. Author the checks: each check is a shell assertion (grep/test) that
               PROVES the PR's behavior on the live system at its ABSOLUTE system paths
               (/usr/share/omarchy/..., /etc/..., ~/.config/...). Scripts may not be +x
               after apply: invoke them via their interpreter (bash <abs path>).
            4. knownRed is a CONTRACT, not prose: the control bed runs the negated
               assertion on the pristine golden. If the assertion passes without the PR,
               the check is fake and the lane re-renders informed. Author assertions
               that are red by construction: they reference the PR's own added lines.
            5. The drive command: ONE shell command that exercises the PR's key behavior
               inside the recording.

omarchy-eval-tiers-skill:
    skill:
        name: omarchy-eval-tiers
        family: distros
        owner: eval-omarchy
        description: |-
            What each evidence tier proves (container pod vs live VM vs visual/GPU) and the mandatory routing rule behind it.
        content: |-
            # omarchy-eval-tiers

            The tier semantics — a claim in a report is only as strong as the tier that
            produced it. Never claim live-system behavior from a container run.

            - Tier-1 container (pod): proves the PR's files are applied to the installed
              tree and the script-level logic with the container's REAL tools. Does NOT
              prove live system behavior.
            - Tier-2 live VM (omarchy-vm): proves the PR's behavior on a real omarchy
              system — real cardwire, real btrfs snapshots, real flatpak, real network,
              real desktop. The tier for system-behavior claims.
            - Tier-2 visual / L3 GPU: desktop evidence and hardware-bound classes
              (NOT_TESTABLE_PR when the hardware is unavailable — never a faked bed).

            The routing rule: the class decides the tier. Hardware-bound classes are
            NOT_TESTABLE_PR with the concrete reason, never a faked bed.

omarchy-eval-tests-skill:
    skill:
        name: omarchy-eval-tests
        family: distros
        owner: eval-omarchy
        description: |-
            The omarchy test-corpus map — the Config Oracle's guide to selecting the charly-native corpus beds that make sense for a PR.
        content: |-
            # omarchy-eval-tests

            The omarchy test-corpus map — the Config Oracle's guide to the charly-native
            equivalents of omarchy's own tests. The oracle consults this skill to SELECT
            the corpus surfaces that make sense for a PR; the lane runs them against the
            eval VM.

            ## The corpus lives in charly.yml — ONE source, CUE-validated

            The corpus is the `omarchy-corpus` candy in this repo's `charly.yml`
            (`candy/omarchy-corpus/charly.yml`, flattened into the project charly.yml by
            the box load). There is NO side manifest file: **charly.yml is the single
            source** and `charly box validate` CUE-validates it. The mapping data is the
            plan itself:

            - every check step's `id:` is the corpus bed identity the oracle selects;
            - the step's section comment names the upstream test file
              (`# === test/shell.d/<feature>-test.sh - ... ===`) — the PROVENANCE
              convention, greppable from charly.yml;
            - the coverage is DERIVED, never authored: the count of the corpus steps in
              the candy's plan vs the upstream corpus size (the config-audit computes it
              from charly.yml — no side file to drift).

            ## The selection vocabulary (the CURRENT corpus step ids — select ONLY these)

            The corpus step ids in the omarchy-corpus candy's plan (charly.yml) — the
            oracle selects from THIS list, never a description fragment:

            - cli-help-renders, cli-help-hw, cli-help-pkg (test/cli)
            - shell-config-valid-json, shell-config-version-1, shell-config-bar-layouts,
              shell-config-clock-format (test/shell.d/config-test.sh)
            - notifications-logic-present (test/shell.d/notifications-test.sh)
            - bar-drag-no-slot-mutation, bar-move-no-settle (test/shell.d/bar-test.sh)
            - hyprland-default-config-parses (test/shell.d/hyprland-default-config-test.sh)
            - update-cli-discoverable (test/shell.d/update-*)
            - battery-model-present (test/shell.d/battery-test.sh)
            - bluetooth-bt-agent-guard, bluetooth-panel-model (test/shell.d/bluetooth-test.sh)
            - clipboard-model-present (test/shell.d/clipboard-test.sh)
            - ocr-screen-text (test/acceptance.d/session-test.sh)
            - accept-shell-ping, accept-bar-background-layers, accept-root-btrfs,
              accept-omarchy-version, accept-pipewire-running (test/acceptance.d/session-test.sh)
            - accept-core-manifest, accept-default-browser (test/acceptance.d/system-test.sh)
            - accept-cups-unit (test/acceptance.d/cups-test.sh)

            A selected id NOT in this list fails the corpus-gate (the oracle's gap) and
            re-authors informed. The corpus RUN is the whole candy (the add_candy — the
            surfaces run per PR); the SELECTION is the report emphasis.

            ## The selection heuristic ("if it makes sense")

            1. ALWAYS include the PR's own changed test files (the existing contract,
               unchanged).
            2. ADD the corpus beds by changed-file adjacency:
               - a PR touching `bin/omarchy-*` → the matching `cli-*` bed steps;
               - `config/`/`shell/` changes → the shell-corpus steps whose feature name
                 matches the changed paths;
               - migration PRs → their named migration steps;
               - visual PRs → the acceptance steps (the screenshots flow into the media
                 lane).
            3. NEVER select hardware-bound surfaces (`hw-*`, `t2-*`, `brcmfmac-*`) or
               nested-VM surfaces (`windows-vm-*`) unless the venue truly has the
               hardware — record PARTIAL instead (the tiers skill).
            4. NEVER run the whole corpus per PR — full-corpus runs are the CALIBRATION
               bed's job.
            5. A PR with no sensible corpus surface has an EMPTY corpus — `corpus_note`
               says why. Empty is legal; an unexplained empty is not.

            ## The invocation contract

            - The selected steps run against the eval VM via the lane's existing
              check-live surface; results are structured PASS/FAIL/skip — never parsed
              prose.
            - Corpus steps run AFTER the oracle-authored checks and BEFORE the drive
              recording; the acceptance surfaces run LAST (they open/close apps and
              mutate desktop config).
            - No mock, ever: the surfaces run against the installed product
              (`/usr/share/omarchy` after pr-apply).
            - knownRed stays oracle-checks-only — corpus surfaces are upstream's own
              contract, never negated into the control bed.
            - One failing surface never masks the rest: per-surface results are evidence
              (keep-going semantics).

            ## The lane's gap surface

            - A SETUP_DEFECT is recorded when the ORACLE selects a corpus step the candy's
              plan does not carry — the triage's validate gate rejects the selection
              (every selected id must exist as a step `id:` in charly.yml), and the
              informed redo re-authors.
            - A NEW upstream test file with no covering corpus step is visible to the
              oracle reading charly.yml — the translation-batch todo, never a faked pass.
            - The hardware-bound and nested-VM classes are PARTIAL with the recorded
              reason — mapped, honestly not runnable on this venue.

omarchy-eval-full-loop-skill:
    skill:
        name: omarchy-eval-full-loop
        family: distros
        owner: eval-omarchy
        description: |-
            The FULL LOOP contract — every stage grades the previous stage and can trigger a change (redo-plan/redo-run/redo-read/escalate).
        content: |-
            # omarchy-eval-full-loop

            The FULL LOOP contract: every stage grades the previous stage and can trigger
            a change.

            - The runner CONFIG AUDIT: the oracle bed against the lane rules.
            - The control bed: the negated checks on the pristine golden — the
              assertion-integrity proof. A fake assertion re-renders informed.
            - The ADE eval: the bed's plan runs through the org's check-run; the
              deterministic verdict (PASS/FAIL/SKIP/NO_VALIDATION) is the gate input.
            - The evidence audit: media + locks.
            - The report: the user-voice narrative from the ledger facts.
            - The cold-read: the artifacts-only validation against the ledger — the
              worthless-eval catch.
            - The runner never leaves a VM running when done.
            - A SETUP_DEFECT triggers the informed reconfiguration (the defect record ->
              the reconfigure agent -> re-run), bounded by the redo budget, escalating to
              the operator-visible defect record after exhaustion.

omarchy-eval-cold-reader-skill:
    skill:
        name: omarchy-eval-cold-reader
        family: distros
        owner: eval-omarchy
        description: |-
            The cold-read rubric — the artifacts-only validation of the evidence packet against the ledger facts.
        content: |-
            # omarchy-eval-cold-reader

            The cold-read rubric — the artifacts-only validation of the evidence packet.

            ## The deterministic gates (from the ledger, never from prose)

            - executed_checks >= 1: the report must name at least one executed check with
              an observed outcome. A report with zero executed checks is a SETUP_DEFECT,
              never a publish.
            - control_ok: the control bed ran and passed (every knownRed claim proven).
            - media_ok: the evidence paths resolve and the artifacts are non-empty.

            ## The prose gates

            - Every material claim in the report is corroborated by the ledger facts.
            - The voice is user-voice: what I did, what I saw. No verdict language, no
              maintainer voice, no lament.
            - The suggestions are actionable user words, informed by the setup-defects
              ledger (what the lane already learned).

omarchy-eval-golden-skill:
    skill:
        name: omarchy-eval-golden
        family: distros
        owner: eval-omarchy
        description: |-
            The golden provisioning contract — the stable/rc/edge/dev instrumented goldens, per-PR clones, presence gates, and re-provisioning.
        content: |-
            # omarchy-eval-golden

            The golden provisioning contract.

            - Four instrumented goldens back the eval-lane channels:
              - `check-omarchy-eval-base-inst` — the STABLE channel golden (charly,
                autologin, the record tools, pr-apply, the harden candy, omarchy-corpus;
                the screenlocker disabled, the always-on shell unit).
              - `check-omarchy-eval-rc-inst` — the RC channel twin.
              - `check-omarchy-eval-edge-inst` — the EDGE channel twin (also the golden the
                acceptance corpus clones).
              - `check-omarchy-eval-dev-inst` — the DEV channel twin.
              Each twin clones `omarchy.omarchy-vm`, switches the channel with
              `omarchy-channel-bootstrap <ch>`, applies the pending migrations, and
              captures its own `golden` snapshot.
            - The live `channel-map` probe exposes all four; the Config Oracle selects the
              golden that fits the PR's class/channel.
            - Per-PR evals clone from the selected golden; per-eval add_candy carries ONLY
              the record/spice PLUGIN providers (verbs register at check-run time).
            - The goldens are disposable: true. Re-provision = delete-before-recapture +
              golden-presence verification.
            - The runner stops the domain after capture.

omarchy-eval-media-skill:
    skill:
        name: omarchy-eval-media
        family: distros
        owner: eval-omarchy
        description: |-
            The media contract — the terminal .cast/.gif lane and the SPICE MJPEG/MP4/PNG lane every eval captures.
        content: |-
            # omarchy-eval-media

            The media contract.

            - Every eval captures BOTH lanes: the terminal recording (.cast -> .gif) and
              the SPICE display capture (MJPEG -> MP4) plus a screenshot (PNG).
            - The media gate asserts the artifacts exist with the min sizes and are not
              uniform (a blank capture is a failure).
            - The evidence packet is linked in the report, never inlined.
            - Media presence NEVER implies verification: the recording runs before the
              checks. The executed-check count is the verification signal, not the media.

omarchy-eval-sequencing-skill:
    skill:
        name: omarchy-eval-sequencing
        family: distros
        owner: eval-omarchy
        description: |-
            The sequencing gate — deterministic stage ordering, orphan discipline, and the concurrency budget.
        content: |-
            # omarchy-eval-sequencing

            The sequencing gate: the deterministic ordering of the lane stages and the
            concurrency budget. The lane runs one PR per lane; the batch runs lanes in
            parallel up to the concurrency budget. Every stage grades the previous stage
            and can trigger a change (the redo edges). The gate asserts the budget and
            the golden presence before the eval.

omarchy-eval-work-lane-skill:
    skill:
        name: omarchy-eval-work-lane
        family: distros
        owner: eval-omarchy
        description: |-
            The work-lane fields — the per-PR identity carried through the lane and rendered into the report frontmatter.
        content: |-
            # omarchy-eval-work-lane

            The work-lane fields: the per-PR identity (pr, head sha, channel, class,
            tier) carried through the lane and rendered into the report frontmatter. The
            frontmatter schema validates the report's identity fields.
