check-omarchy-eval-edge-inst:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        add_candy:
            - omarchy-eval-instrumentation
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - check: the edge twin reaches the FULL desktop (the shell stack required)
              id: inst-autologin
              context: [runtime]
              command: 'pgrep -x quickshell >/dev/null'
              eventually: 240s
              retry_interval: 10s
            - check: switch the base to the edge channel (channel-set + full update accepting downgrades)
              id: inst-channel-switch
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy channel-bootstrap edge'
              timeout: 10m
            - check: the active channel is edge (the round-trip via the reader)
              id: inst-channel-edge
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy omarchy-channel-current'
              stdout:
                  - contains: edge
            - check: apply the pending omarchy migrations (the edge channel's migration set — the golden must be fully provisioned for the accept corpus; channel-bootstrap's raw pacman update never runs them)
              id: inst-migrate-apply
              context: [runtime]
              command: 'omarchy-migrate'
              timeout: 10m
            # the shared tail (R3): the 8 identical steps of every channel twin
            # live ONCE in candy/omarchy-eval-golden-steps.
            - include: candy:omarchy-eval-golden-steps
