omarchy-suite-base-pr9912:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9912: the suite-base
            image with PR #9912 applied at BUILD time via the omarchy-pr-9912 candy,
            plus the declarative behavior checks — REAL tools only (never mock),
            every PR-specific check fails without the PR (known-red). The PR makes `omarchy pkg add` group-aware. The container tier verifies the script logic with the container's REAL pacman (never mock): the group-aware missing-detection works for installed packages, missing packages, fully-installed groups, and groups with missing members. The live `omarchy pkg add <group>` install path on a real system is not exercised here — it requires the Tier-2 live VM.
            All checks are idempotent behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9912
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.245.1438'
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.240.0119'
        plan:
            - check: an installed package is not reported missing (real pacman)
              id: pr9912-installed-not-missing
              context:
                - build
              command: |
                  set -eu
                  if /usr/share/omarchy/bin/omarchy-pkg-missing bash; then
                    echo "installed package bash reported missing" >&2
                    exit 1
                  fi

            - check: a missing package is detected (real pacman)
              id: pr9912-missing-detected
              context:
                - build
              command: |
                  set -eu
                  /usr/share/omarchy/bin/omarchy-pkg-missing definitely-not-a-real-package-xyz

            - check: a fully-installed package group is not reported missing (known-red — without the PR, pacman -Q base fails and this exits 0)
              id: pr9912-group-fully-installed
              context:
                - build
              command: |
                  set -eu
                  if /usr/share/omarchy/bin/omarchy-pkg-missing base; then
                    echo "fully-installed group 'base' reported missing" >&2
                    exit 1
                  fi

            - check: a group with missing members is detected (real pacman, exercises the group path)
              id: pr9912-group-missing-member
              context:
                - build
              command: |
                  set -eu
                  /usr/share/omarchy/bin/omarchy-pkg-missing lv2-plugins

            - check: pkg add uses the group-aware check for verification (known-red — without the PR it uses pacman -Q directly)
              id: pr9912-pkg-add-uses-group-check
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'omarchy-pkg-missing' /usr/share/omarchy/bin/omarchy-pkg-add
