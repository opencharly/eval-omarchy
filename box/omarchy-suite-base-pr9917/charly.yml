omarchy-suite-base-pr9917:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9917: the suite-base
            image with PR #9917 applied at BUILD time via the omarchy-pr-9917 candy,
            plus the declarative behavior checks — REAL tools only (never mock),
            every PR-specific check fails without the PR (known-red). The PR speeds up Super+Return terminal launch. The container tier verifies the fast path is present and correctly authored (known-red content checks). The actual launch latency on a real desktop requires the Tier-2 live VM.
            All checks are idempotent behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9917
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.245.1438'
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.240.0119'
        plan:
            - check: the launch fast path resolves the default terminal (known-red)
              id: pr9917-default-terminal
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'default_terminal()' /usr/share/omarchy/bin/omarchy-launch-terminal
                  grep -qF 'xdg-terminals.list' /usr/share/omarchy/bin/omarchy-launch-terminal

            - check: the launch fast path uses setsid + direct exec (known-red)
              id: pr9917-setsid-fast-path
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'setsid' /usr/share/omarchy/bin/omarchy-launch-terminal
                  grep -qF -e '--working-directory' /usr/share/omarchy/bin/omarchy-launch-terminal

            - check: the fallback path still uses xdg-terminal-exec (known-red)
              id: pr9917-fallback-path
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'xdg-terminal-exec' /usr/share/omarchy/bin/omarchy-launch-terminal

            - check: cwd resolution reads /proc children, not the pgrep -P command line (known-red)
              id: pr9917-proc-children
              context:
                - build
              command: |
                  set -eu
                  grep -qF '/proc/$terminal_pid/task/$terminal_pid/children' /usr/share/omarchy/bin/omarchy-cmd-terminal-cwd
                  if grep -qF 'pgrep -P "$terminal_pid"' /usr/share/omarchy/bin/omarchy-cmd-terminal-cwd; then
                    echo "pgrep -P command line still present" >&2
                    exit 1
                  fi
