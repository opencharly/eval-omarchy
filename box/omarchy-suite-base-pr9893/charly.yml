omarchy-suite-base-pr9893:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9893: the suite-base
            image with PR #9893 applied at BUILD time via the omarchy-pr-9893 candy,
            plus the declarative behavior checks — REAL tools only (never mock),
            every PR-specific check fails without the PR (known-red). The PR makes low-space update failures explainable (btrfs snapshot boot detection). The container tier verifies the snapshot message and detection logic are present (known-red content checks). The real behavior — a system booted from a btrfs snapshot with low disk — is not testable in a container and requires the Tier-2 live VM.
            All checks are idempotent behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9893
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.245.1438'
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.240.0119'
        plan:
            - check: the snapshot-boot message is present in the free-space script (known-red)
              id: pr9893-snapshot-message
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'booted from a Btrfs snapshot' /usr/share/omarchy/bin/omarchy-update-requires-free-space

            - check: the snapshot detection uses findmnt on the root mount (known-red)
              id: pr9893-snapshot-detection
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'findmnt -no OPTIONS /' /usr/share/omarchy/bin/omarchy-update-requires-free-space
                  grep -qF '.snapshots/.*/snapshot' /usr/share/omarchy/bin/omarchy-update-requires-free-space
