omarchy-suite-base-pr9893:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9893: the suite-base
            image with PR #9893 applied at BUILD time via the omarchy-pr-9893 candy,
            plus the declarative behavior checks — the charly consequence-check
            variant of the PR's own shell tests. The PR makes low-space update
            failures explainable: the free-space check detects a Btrfs snapshot boot
            and tells the user to reboot into the regular Omarchy entry. Per the
            eval guidelines (never mock), the container tier verifies only what the
            container's real tools can prove: the snapshot message and detection
            logic are present. The real low-disk btrfs snapshot behavior requires
            the Tier-2 live VM. All checks are idempotent behavior assertions with
            no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9893
        plan:
            - check: the snapshot-boot message is present in the free-space script
              id: pr9893-snapshot-message
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'booted from a Btrfs snapshot' /usr/share/omarchy/bin/omarchy-update-requires-free-space

            - check: the snapshot detection uses findmnt on the root mount
              id: pr9893-snapshot-detection
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'findmnt -no OPTIONS /' /usr/share/omarchy/bin/omarchy-update-requires-free-space
                  grep -qF '.snapshots/.*/snapshot' /usr/share/omarchy/bin/omarchy-update-requires-free-space

            # The real low-disk btrfs snapshot behavior is NOT testable in a
            # container (no real btrfs snapshot boot, no real low-disk system) —
            # per the eval guidelines (never mock) it is not mocked here; it
            # requires the Tier-2 live VM.
