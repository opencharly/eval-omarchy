omarchy-suite-base-pr9923:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9923: the suite-base
            image with PR #9923 applied at BUILD time via the omarchy-pr-9923 candy,
            plus the declarative behavior checks — the charly consequence-check
            variant of the PR's own tests. The PR fixes the network panel's
            split-brain (wifi route up but Quickshell's connected-network lookup
            lagging): a wifiRebind nudge re-runs the lookup on the existing poller
            cadence, kind stays "wifi" when the interface is up, and NOT CONNECTED
            is only painted when there is no interface. All checks are idempotent
            behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9923
        plan:
            - check: the wifiRebind nudge is present in the network panel
              id: pr9923-wifi-rebind-nudge
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'property int wifiRebind: 0' /usr/share/omarchy/shell/plugins/panels/network/Panel.qml
                  grep -qF 'onInfoChanged:' /usr/share/omarchy/shell/plugins/panels/network/Panel.qml
                  grep -qF 'wifiRebind++' /usr/share/omarchy/shell/plugins/panels/network/Panel.qml

            - check: kind stays wifi when the interface is up
              id: pr9923-kind-wifi-inference
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'if (info.iface && info.type === "wifi") return "wifi"' /usr/share/omarchy/shell/plugins/panels/network/Panel.qml

            - check: NOT CONNECTED is only painted when there is no interface
              id: pr9923-not-connected-guard
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'root.kind === "disconnected" && !root.info.iface' /usr/share/omarchy/shell/plugins/panels/network/Panel.qml
