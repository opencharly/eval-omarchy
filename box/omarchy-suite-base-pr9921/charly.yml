omarchy-suite-base-pr9921:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9921: the suite-base
            image with PR #9921 applied at BUILD time via the omarchy-pr-9921 candy,
            plus the declarative behavior checks — REAL tools only (never mock),
            every PR-specific check fails without the PR (known-red). The PR adds a SUPER+A "Universal select all" keybinding. The container tier verifies the binding is present and correctly authored (known-red content checks). The live keypress behavior — select-all in GUI apps, no-op in terminals — requires the Tier-2 live VM with a real desktop.
            All checks are idempotent behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9921
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.245.1438'
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.240.0119'
        plan:
            - check: the SUPER+A universal select-all binding is present (known-red)
              id: pr9921-super-a-binding
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'o.bind("SUPER + A", "Universal select all"' /usr/share/omarchy/default/hypr/bindings/clipboard.lua

            - check: the binding forwards CTRL+A with the terminal skip (known-red)
              id: pr9921-select-all-shape
              context:
                - build
              command: |
                  set -eu
                  grep -qF 'universal_clipboard_shortcut("CTRL", "A", "CTRL SHIFT", "A")' /usr/share/omarchy/default/hypr/bindings/clipboard.lua

            - check: the binding is added exactly once (known-red)
              id: pr9921-binding-once
              context:
                - build
              command: |
                  set -eu
                  [[ $(grep -cF 'SUPER + A' /usr/share/omarchy/default/hypr/bindings/clipboard.lua) -eq 1 ]]
