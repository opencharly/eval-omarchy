omarchy-suite-base-pr9332:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9332: the suite-base
            image with PR #9332 applied at BUILD time via the omarchy-pr-9332 candy,
            plus the declarative behavior checks — REAL tools only (never mock),
            every PR-specific check fails without the PR (known-red). The PR migrates hybrid GPU switching from supergfxctl to cardwire. Per the eval guidelines (never mock), the container tier verifies only what its real tools can prove: the PR's files are applied (known-red) and the retired supergfxd workarounds are gone from the installed tree. The toggle's behavior with REAL cardwire is not testable in a container (cardwire is not in the omarchy package repository) — it requires the Tier-2 live VM once the package ships.
            All checks are idempotent behavior assertions with no side effects.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9332
            - omarchy-eval-cardwire
            - '@github.com/opencharly/layer-yay:v2026.240.0121'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.245.1438'
            - '@github.com/opencharly/layer-tmux:v2026.240.0202'
            - '@github.com/opencharly/layer-asciinema:v2026.240.0119'
        plan:
            - check: the retired supergfxd workarounds are gone from the installed tree (known-red — present without the PR)
              id: pr9332-retired-files-absent
              context:
                - build
              command: |
                  set -eu
                  for f in \
                    /usr/share/omarchy/default/systemd/system-sleep/force-igpu \
                    /usr/share/omarchy/default/systemd/system/supergfxd.service.d/delay-start.conf; do
                    if [[ -e $f ]]; then echo "still present: $f" >&2; exit 1; fi
                  done
