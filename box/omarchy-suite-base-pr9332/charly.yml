omarchy-suite-base-pr9332:
    candy:
        version: 2026.244.0000
        description: |
            The Tier-1 PR-injection image for omacom/omarchy#9332: the suite-base
            image with PR #9332 applied at BUILD time via the omarchy-pr-9332 candy,
            plus the declarative behavior checks. The PR migrates hybrid GPU switching
            from supergfxctl to cardwire. Per the eval guidelines (never mock), the
            container tier verifies only what the container's real tools can prove:
            the PR's files are applied and the retired supergfxd workarounds are gone
            from the installed tree. The toggle's behavior with REAL cardwire is not
            testable in a container (cardwire is not in the omarchy package
            repository) — it requires the Tier-2 live VM once the package ships.
        base: omarchy.omarchy-suite-base
        build:
            - pac
        platform:
            - linux/amd64
        distro:
            - omarchy
            - arch
        candy:
            - omarchy-pr-9332
        plan:
            - check: the retired supergfxd workarounds are gone from the installed tree
              id: pr9332-retired-files-absent
              context:
                - build
              command: |
                  set -eu
                  for f in \
                    /usr/share/omarchy/default/systemd/system-sleep/force-igpu \
                    /usr/share/omarchy/default/systemd/system/supergfxd.service.d/delay-start.conf; do
                    if [[ -e $f ]]; then echo "still present: $f" >&2; exit 1; fi
                  done
