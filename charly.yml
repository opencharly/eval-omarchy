#  opencharly/eval-omarchy — the omarchy PR evaluation repo.
#
#  Dedicated home for the omarchy evaluation beds and their results. The beds
#  derive from the shipped distro-omarchy boxes (imported as the `omarchy`
#  namespace) and inject a PR's files at BUILD time via a per-PR candy
#  (candy/omarchy-pr-<N>), then assert the PR's BEHAVIOR as charly consequence
#  checks — the charly variant of the PR's own shell tests, strictly stronger
#  than upstream's mocked call sequences. Eval results land in eval/.
#
#  Every evaluation report (eval/pr-<N>.md) and every posted PR comment is
#  rendered from eval/PR-EVAL-TEMPLATE.md and carries its EXTERNAL,
#  direct: what was tested and how — no boilerplate.
#
#  Usage:
#      charly check run check-omarchy-pr-<N>-vm  (oracle-generated bed under pr-beds/pr-<N>/)
version: 2026.249.2125
repo: github.com/opencharly/eval-omarchy
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # The omarchy image family (base box, suite-base, VM templates) lives in
    # opencharly/distro-omarchy. Qualified refs: omarchy.omarchy-suite-base.
    - omarchy: '@github.com/opencharly/distro-omarchy:v2026.250.0359'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
    - path: pr-beds
      recursive: true

# ── the omarchy VM template (local copy — the import does not expose the entity) ──
omarchy-vm:
    vm:
        source:
            kind: iso
            distro: omarchy
            url: https://iso.omarchy.org/omarchy-4.0.3.iso
            checksum: {type: sha256, value: 03d60bc74306dca51f96e1a84b690871d8d606826b260edd0208962da8507d14}
            installer:
                username: user
                password: user
                full_name: Charly
                email: charly@opencharly.invalid
                hostname: omarchy
                timezone: UTC
                keyboard: us
                locale: en_US.UTF-8
                disk: /dev/vda
                encrypt: false
        disk_size: 40G
        ram: 2G
        cpu: 1
        machine: q35
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"

# ── the golden base: provisions the omarchy VM and captures the golden ──────
check-omarchy-eval-base:
    vm:
        from: omarchy-vm
        disposable: true
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
        plan:
            - check: the omarchy guest reports its hostname
              id: ocb-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]

# ── the INSTRUMENTED golden base (the stable channel): the golden PLUS the
# eval-tooling payload (charly, autologin, record tools incl. acpid, pr-apply)
# captured as its own golden. Per-PR evals clone from THIS golden; per-eval
# add_candy carries ONLY the record/spice PLUGIN providers (verbs register at
# check-run time — baking them gave 'no provider registered'). Provision once via
# the FRESH lane; re-provision = delete-before-recapture + golden-presence
# verification (RCA #7); the runner stops the domain after capture (RCA #3).
check-omarchy-eval-base-inst:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        # NOTE: derives from omarchy-vm (post-#32); the [charly] repo configured in the base
        # golden's pacman.conf is NOT inherited here and must not be re-added — re-adding
        # a registered repo fails pacman with 'database already registered' (errors_fatal).
        add_candy:
            - omarchy-autologin
            - omarchy-eval-record
            - omarchy-eval-harden
            - omarchy-pr-apply
            - '@github.com/opencharly/layer-asciinema:v2026.246.1622'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - run: full system upgrade + omarchy channel update (bakes the current channel state into the golden)
              id: inst-full-upgrade
              command: 'OMARCHY_ALLOW_DIRECT_PACMAN=1 pacman -Syu --noconfirm && omarchy-channel-update 2>/dev/null || true'
              context: [runtime]
            - run: clean the pacman cache (keeps the golden lean)
              id: inst-clean-cache
              command: 'pacman -Scc --noconfirm >/dev/null 2>&1; rm -rf /var/cache/pacman/pkg/* 2>/dev/null; true'
              context: [runtime]
            - run: pre-seed the pr-apply bare clone with the eval head objects (removes the guest-side clone/fetch from every eval)
              id: inst-preseed-pr-apply
              command: 'set -eu; R=/root/.cache/omarchy-pr-apply.git; if [ ! -d "$R" ]; then git clone --bare -q https://github.com/omacom/omarchy "$R"; fi; for h in 0681cadf28aae14f9cc46271ecb2af76e5958a36 075feebd8248a31f35a8c5914083bdb0f0aa615b 16a6ede2687255e198281a11969152a33d1d337a 21992f03f72c2b15bdeb135e9ae8e8bb21274e95 2f44cf431c58fb7e796e6f54e8dfac2c14bb2a52 38c07810ee3d06e22eaa069c630d7a33fbbf3475 399665b58a317c50ff134555a9d9188d10ab4c9e 411736590c4e6699d43980c511c843bfb3052b5a 4e022c0940ab2630e8d0ac46c597dc94b2981ce8 51bbe4a4ea03bccd51f53ce0882db96fef233c79 51c4cf8148922ccb6f213f6f399856ace93bff32 5245d3f78e077e1efd3d0a662900f0f921ab08ad 65fa55975f6e54757d3a087534f107b28005077b 6be10b410a14114cf75007ae2a2b1054c793aa42 6e735dde6b505d6de73977ec6650b997b6d970f4 6ebb7e1b319a9f477d8242d02fefa62e886339bb 70047956fac8bdfe36aabb9dea82b4eee50e1b2c 73a09695f98c7d4c95d88040b5876c858cc5e02e 7afa9ddd518fc2c1dda38033f5f4c54c5c05f4ad 87f2bf1e72e60de3a49531f0e65aeb7c5d4f5f02 977e0fcdc2ca46b2fbf7dbeab6bd5b29b49b1398 a3e951158dcac624ced50d4df9b0a33e68539468 a68df9c8cac7a78925001006fe64d9f7bfbf9429 b9f53d4bbdd64900cb0f66a3ac0d4eac36811bc2 ca17c1854aca4c0ed4d1bcd7818e4132c172ad05 d06853a760955a09ef5a014a4f28584c6d1f0ec9 e13b3b4f83010ebeb894dc34f478a054b945cb39 e523d5da1699c5d2fc6adec2c628c9f34ae0ce0d e65f2f6c5f2cb015ca5cd4a841e9f4d6d64b7008 e9d011328f230aab529d4020499222eb15343c3c ecb69659d9d66cb56ec2b8a5a1f9bf846e8ebe2d f0bc41fb263362cdf8fcdb3b14ea9ac024c17a32; do git -C "$R" fetch -q origin "$h" || true; done'
              context: [runtime]
            - run: warm the guest charly resolution cache (bakes the git metadata for the eval's deploy + pr-apply refs — removes the guest-side first-run fetch from every deploy-add)
              id: inst-warm-charly-cache
              command: 'charly box list >/dev/null 2>&1; charly box validate /root >/dev/null 2>&1 || true; find /root/.cache/charly -type f 2>/dev/null | head -1'
              context: [runtime]
            - check: the instrumented golden reaches the desktop
              id: inst-autologin
              context: [runtime]
              command: 'pgrep -fx quickshell >/dev/null || pgrep -f hyprland >/dev/null'
              eventually: 240s
              retry_interval: 10s
            - check: acpid is enabled (ACPI power-off handling present in the golden)
              id: inst-acpid
              context: [runtime]
              service:
                  service: acpid
                  enabled: true
            - check: the pr-apply helper is present
              id: inst-pr-apply
              context: [runtime]
              file:
                  file: /usr/local/bin/pr-apply
                  exists: true

# ---- the omarchy PR-eval lane (folded from the retired eval-charly repo) ----
eval-lane:
  candy:
    version: 2026.251.0000
    description: |
      The omarchy PR-eval lane wiring: composes the generic pipeline engine + the
      PR-tool plugin, declares the complete env/secret contract, and carries the ADE
      self-checks. The pipeline itself is the eval-lane-plan kind:pipeline entity in
      this file — every stage, prompt, template, and schema INLINE.
    candy:
      - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.251.2226'
      - '@github.com/opencharly/plugin-review/candy/plugin-review:v2026.251.1939'
    var:
      EVAL_LANES: "16"
      EVAL_CHANNEL: stable
      EVAL_MAX_REDO: "2"
      EVAL_REDO_ESCALATE: "3"
      EVAL_REPO: omacom/omarchy
    env_require:
      - name: EVAL_LLM_BASE_URL
        description: "LLM chat-completions base URL (the agent endpoint)"
      - name: EVAL_LLM_MODEL
        description: "LLM model id"
      - name: EVAL_UMBRELLA
        description: "Path to the opencharly umbrella checkout"
        default: ""
    env_accept:
      - name: EVAL_LLM_SYSTEM_PROMPT
        description: "Optional per-run system prompt override"
      - name: EVAL_LLM_PROVIDER
        description: "LLM provider name"
      - name: EVAL_DRY_RUN
        description: "Dry-run flag"
      - name: EVAL_DEBUG
        description: "Verbose run debugging"
      - name: EVAL_CHANNEL
        description: "Channel override (stable/rc/edge/dev)"
      - name: EVAL_LANES
        description: "Concurrency lanes"
      - name: EVAL_MAX_REDO
        description: "Redo bound"
      - name: EVAL_PUBLISH
        description: "approve -> the publication gate posts"
      - name: PIPELINE_SKILLS
        description: "Comma-separated @github candy refs for the agent skills"
      - name: PIPELINE_CORPUS_DIR
        description: "Marketplace corpus dir (rendered skill content)"
      - name: BARE_PROMPT
        description: "Inline prompt for the standalone agent surface"
    secret_accept:
      - name: EVAL_LLM_API_KEY
        description: "LLM provider API key"
        key: charly/api-key/eval-llm
    plan:
      - check: the pipeline executor self-tests
        id: ade-pipeline-present
        context: [runtime]
        command: charly pipeline --self-test
        exit_status: 0
      - check: the pipeline entity validates against #PipelineInput
        id: ade-pipeline-valid
        context: [runtime]
        command: charly pipeline validate eval-lane-plan
        exit_status: 0

ade-grader:
  agent:
    description: "The ADE in-bed grader (bare agent with the PR tools)"
    command: [charly, pipeline, agent, --system-prompt, "${PROMPT}", --tools, pr]
    prompt_via: argv
    timeout: 5m
    env:
      PIPELINE_SKILLS: '@github.com/opencharly/distro-omarchy:v2026.251.1654'
    credential:
      - {src: charly/api-key/eval-llm, dst: EVAL_LLM_API_KEY}

eval-lane-plan:
  pipeline:
    gates: [sequencing, lock_audit]
    redo: { max: 2, escalate_after: 3 }
    concurrency: { lanes: 16 }
    channels:
      stable: { golden: check-omarchy-eval-base-inst:golden, provision: eval-lane-plan-channel-stable }
      rc:     { golden: check-charly-omarchy-rc-vm:golden,     provision: eval-lane-plan-channel-rc }
      edge:   { golden: check-charly-omarchy-edge-vm:golden,   provision: eval-lane-plan-channel-edge }
      dev:    { golden: check-charly-omarchy-dev-vm:golden,    provision: eval-lane-plan-channel-dev }
    media:
      files: [cast, gif, mjpeg, mp4, png]
      min: { cast: 200, gif: 1024, mjpeg: 4096, mp4: 4096, png: 1024 }
      dir: "media/pr-$pr-$calver"
    report:
      template: |-
        ---
        verdict: ${verdict}
        triage: ${class}
        channel: ${channel}
        tier: ${tier}
        ---
        # I tested omacom/omarchy#$pr
        *Rendered by the charly PR-eval lane — every section filled; N/A with a reason.*
        > ## EXTERNAL, NON-AUTHORITATIVE evaluation — read first
        > This is an EXTERNAL, NON-AUTHORITATIVE evaluation performed by opencharly.ai.
        > **Results can go STALE**: compare with the PR's current head before acting.
        ## What was tested and how
        **Overall:** @cold-read.verdict
        **Head tested:** $pr — **results can go STALE**.
        ## Recordings
        - Terminal lane: ${cast}
        - Full-screen lane: ${mp4} (${mjpeg}, ${png}, ${gif})
        *Assisted-by: <Harness> <Provider Full Model Name> (<confidence>)*
      frontmatter_schema: |-
        { "type": "object", "required": [pr, verdict, triage, channel, tier, posted],
          "properties": { "verdict": { "enum": [PASS, FAIL, NO_VALIDATION] } } }
      bed_template: |-
        version: 2026.249.2125
        check-omarchy-pr-$pr-vm:
          vm:
            from: ${golden}
            disposable: true
            lifecycle: dev
            update_gate: restart-only
            add_candy:
              - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
              - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
            plan:
              - check: apply PR $pr via the single apply seam
                id: pr-apply
                context: [runtime]
                command: 'pr-apply $pr ${sha} ${files}'
              - check: stamp the apply marker (the RED->GREEN probe evidence)
                id: mark-applied
                context: [runtime]
                command: 'touch /var/tmp/omarchy-pr-$pr-applied'
              - check: the PR's OWN test suite passes on the applied system
                id: pr-tests
                context: [runtime]
                command: 'for t in ${tests}; do bash "$t" || exit 1; done'
              ${checks}
              - check: start a terminal recording
                id: rec-start
                context: [runtime]
                record: {method: start, record_mode: terminal, record_name: pr-$pr}
              - check: start the SPICE display video capture
                id: rec-spice-start
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: record, action: start, record_name: pr-$pr, fps: 5}
              - check: drive the PR key command inside the recording
                id: rec-drive
                context: [runtime]
                record: {method: run, record_name: pr-$pr, text: $drive, settle_ms: 1000}
              - check: capture the VM display via SPICE
                id: rec-screen-spice
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: screenshot, artifact: /tmp/pr-$pr.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
              - check: stop the SPICE capture and pull the MJPEG stream
                id: rec-spice-stop
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: record, action: stop, record_name: pr-$pr, artifact: /tmp/pr-$pr.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
              - check: stop the terminal recording and pull the .cast
                id: rec-stop
                context: [runtime]
                record: {method: stop, record_name: pr-$pr, artifact: /tmp/pr-$pr.cast, artifact_min_bytes: 200}
              - check: render the .cast to an animated GIF
                id: rec-gif
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                record: {method: gif, record_name: pr-$pr, artifact: /tmp/pr-$pr.gif, artifact_min_bytes: 100}
              - run: transcode the SPICE MJPEG capture to MP4
                id: rec-mp4
                context: [runtime]
                command: 'ffmpeg -y -loglevel error -i /tmp/pr-$pr.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-$pr.mp4'
        # the RED-PROBE twin: the SAME golden WITHOUT the PR (no apply/marker/media).
        # On the pristine golden the marker is absent -> the check FAILS -> the
        # check run exits 2 (known-red contract, legacy driver parity). Pre-apply
        # the bed must be RED; post-apply (marker stamped) it must be GREEN.
        check-omarchy-pr-$pr-vm-probe:
          vm:
            from: ${golden}
            disposable: true
            lifecycle: dev
            update_gate: restart-only
            plan:
              - check: the PR apply marker must be ABSENT on the pristine golden (KNOWN-RED)
                id: pr-not-applied
                context: [runtime]
                command: 'test -e /var/tmp/omarchy-pr-$pr-applied'
    stages:
      - id: channel-select
        kind: probe
        verbs: [resolve_channel]
        input:
          channels:
            stable: { golden: check-omarchy-eval-base-inst:golden, provision: eval-lane-plan-channel-stable }
            rc:     { golden: check-charly-omarchy-rc-vm:golden,     provision: eval-lane-plan-channel-rc }
            edge:   { golden: check-charly-omarchy-edge-vm:golden,   provision: eval-lane-plan-channel-edge }
            dev:    { golden: check-charly-omarchy-dev-vm:golden,    provision: eval-lane-plan-channel-dev }
          default: "$env.EVAL_CHANNEL"
        outputs: [channel]
      - id: triage
        kind: agent
        skill:
          - '@github.com/opencharly/distro-omarchy:v2026.251.1654'
          - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.251.2226'
        tools: [pr, resolve_channel, ledger]
        prompt: |-
          You are the Config Oracle for the omarchy PR-eval lane. You decide WHAT to
          test and HOW — never DO the testing. TRIAGE (useful? new insight? testable
          on this hardware? tier?) then PLAN. NEVER run a bed.
          Your ENTIRE reply MUST be ONE JSON object, no prose, no markdown fences, no
          trailing text:
          {"class": "system|packaging|visual", "channel": "stable", "tier": "vm",
          "sha": "<the PR head sha>",
          "files": "<the PR's changed file paths, space-separated (use the PR tools)",
          "drive": "<one shell command that exercises the PR's key behavior>",
          "tests": "<the PR's OWN changed test/shell.d/*.sh files, space-separated ABSOLUTE paths in the applied system (resolve them from the PR file list - NEVER invent tests; if the PR adds/changes tests, those are the tests)>"
          "checks": [{"id": "<slug>", "what": "<one-line behavior assertion>",
          "assertion": "<exact shell snippet, exit nonzero on failure, that proves the
          PR's behavior on the live system>", "knownRed": "<why it fails on the pristine
          golden>"}], "record": true, "visual": true}.
          Scripts may NOT be +x after apply: invoke script files via their interpreter 
          (bash <abs path>, python3 <abs path>); use command -v for binaries; keep 
          assertions idempotent and fast.
          The checks run INSIDE the applied VM (the PR was applied to the live OS at
          its system paths): use ABSOLUTE paths ONLY (/usr/share/omarchy/..., /etc/...,
          ~/.config/...), never relative repo paths. Reference example that works:
          grep -qi Wallclock /usr/share/omarchy/shell/plugins/panels/clock/BarWidget.qml
          If the PR is a draft or WIP, reply {"class": "skip", "record": false}.
        outputs: [plan-json]
      - id: bed-render
        kind: generate
        template: "$report.bed_template"
        vars:
          pr: "$pr"
          golden: "@channel-select.golden"
          sha: "$env.PR_HEAD_SHA"
          files: "@triage.plan-json.files"
          drive: "@triage.plan-json.drive"
          channel: "@channel-select.channel"
          checks: "@triage.plan-json.checks"
          tests: "@triage.plan-json.tests"
        out: "pr-beds/pr-$pr/charly.yml"
        validate: charly-box-validate
      - id: config-audit
        kind: probe
        verbs: [config_audit]
        input: { bed: "pr-beds/pr-$pr/charly.yml", pr: "$pr" }
        redo: { on_fail: bed-render }
      - id: red-probe
        kind: check
        bed: check-omarchy-pr-$pr-vm-probe
        expect_exit: "2"
        teardown: probe
      - id: eval
        kind: check
        bed: check-omarchy-pr-$pr-vm
        # 0 = the PR passed its behavior checks; 2 = genuine failures recorded
        # (the report grades both — the checks' results are the verdict data).
        expect_exit: "any"
        teardown: true
      - id: assemble-media
        kind: media
        assemble: true
        transcode: mjpeg:mp4
      - id: evidence-audit
        kind: probe
        verbs: [media_gate, lock_audit]
        input:
          media_gate: { dir: "media/pr-$pr-$calver", files: [cast, gif, mjpeg, mp4, png], min: {cast: 200, gif: 1024, mjpeg: 4096, mp4: 4096, png: 1024} }
          lock_audit: { trees: ["$workdir/.check"] }
        redo: { on_fail: [eval, assemble-media] }
      - id: report
        kind: agent
        skill:
          - '@github.com/opencharly/distro-omarchy:v2026.251.1654'
          - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.251.2226'
        tools: [pr, ledger]
        prompt: |-
          Render eval/pr-$pr.md from the ledger per the template: first-person What I
          tested, the step matrices from the run summaries, the media table, the
          EXTERNAL NON-AUTHORITATIVE disclaimer verbatim, the Assisted-by footer.
          Do NOT post.
      - id: cold-read
        kind: agent
        skill:
          - '@github.com/opencharly/distro-omarchy:v2026.251.1654'
          - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.251.2226'
        tools: [ledger, read]
        max_turns: 30
        outputs: [verdict]
        prompt: |-
          Fresh-context validation of the evidence packet: SUBJECT (PASS/FAIL/
          NO_VALIDATION) + PROCESS.
          After at most TWO tool calls, emit your final verdict JSON ONLY:
          {"verdict": "PASS|FAIL|NO_VALIDATION", "subject": "...", "process": "..."}.
          Never call a tool more than twice; always end with the verdict. (known-red, tier compliance, claims scoped, media
          non-empty + showing the commands, Assisted-by present). Every material
          vision claim corroborated by a deterministic source. Map findings to
          triggers: redo-plan / redo-run / redo-read / escalate.
        redo:
          triggers: { redo-plan: bed-render, redo-run: eval, redo-read: cold-read }
      - id: render-report
        kind: generate
        template: "$report.template"
        vars:
          pr: "$pr"
          cold_read: "@cold-read.verdict"
          verdict: "@eval.verdict"
          class: "@triage.plan-json.class"
          channel: "@channel-select.channel"
          tier: "@triage.plan-json.tier"
          cast: "media/pr-$pr-$calver/pr-$pr.cast"
          mp4: "media/pr-$pr-$calver/pr-$pr.mp4"
          mjpeg: "media/pr-$pr-$calver/pr-$pr.mjpeg"
          png: "media/pr-$pr-$calver/pr-$pr.png"
          gif: "media/pr-$pr-$calver/pr-$pr.gif"
        out: "eval/pr-$pr.md"
        validate: report-frontmatter
      - id: publish
        kind: gate
        condition: "$env.EVAL_PUBLISH == approve"

