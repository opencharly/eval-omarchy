#  opencharly/eval-omarchy — the omarchy PR evaluation repo.
#
#  Dedicated home for the omarchy evaluation beds and their results. The beds
#  derive from the shipped distro-omarchy boxes (imported as the `omarchy`
#  namespace) and inject a PR's files at BUILD time via a per-PR candy
#  (candy/omarchy-pr-<N>), then assert the PR's BEHAVIOR as charly consequence
#  checks — the charly variant of the PR's own shell tests, strictly stronger
#  than upstream's mocked call sequences. Eval results land in eval/.
#
#  Every evaluation report (eval/pr-<N>.md) and every posted PR comment is
#  rendered from eval/PR-EVAL-TEMPLATE.md and carries its EXTERNAL,
#  direct: what was tested and how — no boilerplate.
#
#  Usage:
#      charly check run check-omarchy-pr-<N>-vm  (oracle-generated bed under pr-beds/pr-<N>/)
version: 2026.249.2125
repo: github.com/opencharly/eval-omarchy
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
import:
    # The omarchy image family (base box, suite-base, VM templates) lives in
    # opencharly/distro-omarchy. Qualified refs: omarchy.omarchy-suite-base.
    - omarchy: '@github.com/opencharly/distro-omarchy:v2026.251.2301'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
    - path: pr-beds
      recursive: true

# ── the omarchy VM template (local copy — the import does not expose the entity) ──
omarchy-vm:
    vm:
        source:
            kind: iso
            distro: omarchy
            url: https://iso.omarchy.org/omarchy-4.0.3.iso
            checksum: {type: sha256, value: 03d60bc74306dca51f96e1a84b690871d8d606826b260edd0208962da8507d14}
            installer:
                username: user
                password: user
                full_name: Charly
                email: charly@opencharly.invalid
                hostname: omarchy
                timezone: UTC
                keyboard: us
                locale: en_US.UTF-8
                disk: /dev/vda
                encrypt: false
        disk_size: 40G
        ram: 2G
        cpu: 1
        machine: q35
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"

check-omarchy-eval-edge-inst:
    vm:
        from: omarchy.omarchy-vm
        disposable: true
        lifecycle: dev
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        add_candy:
            - omarchy-autologin
            - omarchy-channel-bootstrap
            - omarchy-eval-record
            - omarchy-eval-harden
            - omarchy-pr-apply
            - '@github.com/opencharly/layer-asciinema:v2026.246.1622'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
            - '@github.com/opencharly/plugin-omarchy/candy/plugin-omarchy:v2026.253.1645'
            - '@github.com/opencharly/plugin-wl/candy/plugin-wl:v2026.253.1044'
            - '@github.com/opencharly/plugin-quickshell/candy/plugin-quickshell:v2026.243.1942'
            - '@github.com/opencharly/plugin-cdp/candy/plugin-cdp:v2026.250.1422'
            - '@github.com/opencharly/plugin-dbus/candy/plugin-dbus:v2026.242.0556'
            - '@github.com/opencharly/plugin-media/candy/plugin-media:v2026.251.1349'
            - omarchy-corpus
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - check: the edge twin reaches the FULL desktop (the shell stack required)
              id: inst-autologin
              context: [runtime]
              command: 'pgrep -x quickshell >/dev/null'
              eventually: 240s
              retry_interval: 10s
            - check: switch the base to the edge channel (channel-set + full update accepting downgrades)
              id: inst-channel-switch
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy channel-bootstrap edge'
              timeout: 10m
            - check: the active channel is edge (the round-trip via the reader)
              id: inst-channel-edge
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy omarchy-channel-current'
              stdout:
                  - contains: edge
            - check: apply the pending omarchy migrations (the edge channel's migration set — the golden must be fully provisioned for the accept corpus; channel-bootstrap's raw pacman update never runs them)
              id: inst-migrate-apply
              context: [runtime]
              command: 'omarchy-migrate'
              timeout: 10m
            - check: no pending omarchy migrations remain (the golden is fully provisioned; the runner exits 1 when the queue is empty)
              id: inst-migrate-pending
              context: [runtime]
              command: 'omarchy-migrate --pending'
              exit_status: 1
            - check: the screenlocker is disabled in the golden (the systemd paths AND the shell's own idle lock — the stay-awake state file; RCA 2026.253.2216 the shell's idle plugin locked the provision bed mid-run)
              id: inst-screenlock-disabled
              context: [runtime]
              command: '! pgrep -x hypridle >/dev/null && ! systemctl is-active omarchy-sleep-lock.service >/dev/null 2>&1 && test -f ~/.local/state/omarchy/indicators/stay-awake'
            - check: the always-on shell unit is enabled for every future user session
              id: inst-shell-unit-enabled
              context: [runtime]
              command: 'systemctl --global is-enabled omarchy-eval-shell.service | grep -q enabled'
            - check: the agg gif generator is installed and runnable
              id: inst-agg-present
              context: [runtime]
              command: 'test -s /usr/local/bin/agg && /usr/local/bin/agg --version'
            - check: acpid is enabled (ACPI power-off handling present)
              id: inst-acpid
              context: [runtime]
              service:
                  service: acpid
                  enabled: true
            - check: the pr-apply helper is present NON-EMPTY
              id: inst-pr-apply
              context: [runtime]
              command: 'test -s /usr/local/bin/pr-apply && head -1 /usr/local/bin/pr-apply | grep -q "#!/usr/bin/env bash"'
            - check: the upstream test tree is carried on the golden (M7)
              id: inst-upstream-tests
              context: [runtime]
              command: 'test -d /opt/omarchy-upstream-test/test/shell.d && test -d /opt/omarchy-upstream-test/test/acceptance.d'
            - check: the tool manifest is present (grim, tesseract, wtype, jq)
              id: inst-tool-manifest
              context: [runtime]
              command: 'for t in grim tesseract wtype jq; do command -v $t >/dev/null || exit 1; done'

# session — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-session:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - '@github.com/opencharly/plugin-cdp/candy/plugin-cdp:v2026.250.1422'
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the ground-up health checks
            - check: the compositor reports a monitor
              id: a-monitors
              context: [runtime]
              wl: {method: hypr-monitors}
              stdout:
                  - contains: Virtual-1
            - check: the shell answers the IPC ping
              id: a-shell-ping
              context: [runtime]
              quickshell: {method: ping, config: /usr/share/omarchy/shell}
            - check: the 13 core shell plugins are loaded
              id: a-plugins
              context: [runtime]
              omarchy: {method: shell-list-plugins}
              stdout:
                  - contains: omarchy.audio
                  - contains: omarchy.weather
            - check: the bar and background layers are on screen
              id: a-layers
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-bar
                  - contains: omarchy-background
            - check: pipewire is running
              id: a-pipewire
              context: [runtime]
              command: 'wpctl status'
            - check: the root filesystem is btrfs
              id: a-btrfs
              context: [runtime]
              command: 'findmnt -no FSTYPE /'
              stdout:
                  - contains: btrfs
            - check: omarchy reports its version
              id: a-version
              context: [runtime]
              omarchy: {method: version}
              stdout:
                  - matches: '^[0-9]+.[0-9]+.[0-9]+'
            - check: no failed system units
              id: a-failed-system
              context: [runtime]
              command: 'systemctl --failed --system --no-legend'
              stdout:
                  - matches: '^$'
            - check: no failed user units
              id: a-failed-user
              context: [runtime]
              command: 'systemctl --failed --user --no-legend'
              stdout:
                  - matches: '^$'
            - check: the shell restart is idempotent
              id: a-restart
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy omarchy-restart-shell'
              eventually: 30s
              retry_interval: 5s
            - check: the shell answers after the restart
              id: a-restart-ping
              context: [runtime]
              quickshell: {method: ping, config: /usr/share/omarchy/shell}
              eventually: 30s
              retry_interval: 5s

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# shell-surfaces — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-shell-surfaces:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the shell surface round-trips
            - check: the emoji picker opens
              id: a-emoji-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.emojis}
            - check: the emoji picker layer is present
              id: a-emoji-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-emojis
              eventually: 15s
              retry_interval: 3s
            - check: type into the emoji picker
              id: a-emoji-type
              context: [runtime]
              wl: {method: type, text: rocket}
            - check: the emoji picker selection closes
              id: a-emoji-close
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the clipboard history captures seeded text
              id: a-clipboard-seed
              context: [runtime]
              command: 'export WAYLAND_DISPLAY=$(ls -t /run/user/1000/wayland-* 2>/dev/null | grep -v "\.lock$" | head -1 | xargs -r basename); printf "Omarchy acceptance clipboard %s" "$(date +%s)" | wl-copy >/dev/null 2>&1'
            - check: the clipboard history file records it
              id: a-clipboard-history
              context: [runtime]
              command: 'grep -Fq "Omarchy acceptance clipboard" "$HOME/.local/state/omarchy/clipboard-history.json"'
              eventually: 15s
              retry_interval: 3s
            - check: the clipboard picker opens
              id: a-clipboard-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.clipboard}
            - check: the clipboard search finds the text
              id: a-clipboard-search
              context: [runtime]
              wl: {method: type, text: Omarchy acceptance clipboard}
            - check: the clipboard selection restores the text
              id: a-clipboard-restore
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the notification popup renders
              id: a-notify-send
              context: [runtime]
              omarchy: {args: 'notification send "Acceptance notification" "Shell notification rendering" --expire-time=15000'}
            - check: the notification layer is present
              id: a-notify-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-notifications
              eventually: 15s
              retry_interval: 3s
            - check: the notification dismisses
              id: a-notify-dismiss
              context: [runtime]
              omarchy: {args: 'shell notifications dismissOne'}
            - check: the apps menu launcher loop (omawrite)
              id: a-apps-menu
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.menu, payload: '{"menu":"apps"}'}
            - check: the apps menu launches the top hit
              id: a-apps-launch
              context: [runtime]
              wl: {method: type, text: omawrite}
            - check: the apps menu confirms the top hit
              id: a-apps-enter
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the omawrite window appears
              id: a-apps-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: omawrite
              eventually: 60s
              retry_interval: 5s
            - check: the omawrite window closes
              id: a-apps-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.class == "omawrite") | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -q '"class": "omawrite"'

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# menu-bar — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-menu-bar:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the menu-driven bar position round-trip
            - check: the root menu opens
              id: a-menu-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.menu, payload: '{"menu":"root"}'}
            - check: the menu layer is present
              id: a-menu-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-menu
              eventually: 15s
              retry_interval: 3s
            - check: the bar layer is mapped
              id: a-bar-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-bar
            - check: the clock renders (OCR)
              id: a-clock-ocr
              context: [runtime]
              wl: {method: screenshot, artifact: /tmp/bar.png, artifact_not_uniform: true}
            - check: the bar config is valid JSON
              id: a-bar-config
              context: [runtime]
              command: 'jq empty /usr/share/omarchy/config/omarchy/shell.json'
            - check: the bar config carries the version-1 layout
              id: a-bar-layout
              context: [runtime]
              command: 'jq -e ".version == 1" /usr/share/omarchy/config/omarchy/shell.json'
            - check: the bar reload is stable
              id: a-bar-reload
              context: [runtime]
              omarchy: {method: shell-reload-config}
            - check: the bar layer survives the reload
              id: a-bar-after-reload
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-bar
              eventually: 15s
              retry_interval: 3s

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# panels — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-panels:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the panel round-trips (weather, bluetooth, battery)
            - check: the weather location is set deterministically
              id: a-weather-loc
              context: [runtime]
              omarchy: {method: weather-location, args: '--set "San Francisco" "37.7749,-122.4194"'}
            - check: the weather panel opens
              id: a-weather-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.weather}
            - check: the weather panel layer is present
              id: a-weather-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-keyboard-panel
              eventually: 15s
              retry_interval: 3s
            - check: the weather location is visible (OCR)
              id: a-weather-ocr
              context: [runtime]
              wl: {method: screenshot, artifact: /tmp/weather.png, artifact_not_uniform: true}
            - check: the weather panel closes
              id: a-weather-close
              context: [runtime]
              omarchy: {method: shell-hide, plugin: omarchy.weather}
            - check: the bluetooth panel opens
              id: a-bt-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.bluetooth}
            - check: the bluetooth panel layer is present
              id: a-bt-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-keyboard-panel
              eventually: 15s
              retry_interval: 3s
            - check: the bluetooth panel closes
              id: a-bt-close
              context: [runtime]
              omarchy: {method: shell-hide, plugin: omarchy.bluetooth}
            - check: the bluetooth stack serves (the no-hardware daemon is the honest state)
              id: a-bt-stack
              context: [runtime]
              command: '! systemctl is-active bluetooth'
            - check: the bt-agent unit is enabled (the user manager — the unit is a user service)
              id: a-bt-agent
              context: [runtime]
              service:
                  service: bt-agent
                  scope: user
                  enabled: true
            - check: the battery status is reported (the VM's absent battery is the honest skip)
              id: a-battery
              context: [runtime]
              omarchy:
                  args: battery-status

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# apps — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-apps:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the app launch round-trips
            - check: the default browser is chromium
              id: a-default-browser
              context: [runtime]
              omarchy: {method: default-browser}
              stdout:
                  - contains: chromium
            - check: the default terminal is foot
              id: a-default-terminal
              context: [runtime]
              omarchy: {method: default-terminal}
              stdout:
                  - contains: foot
            - check: the default editor is nvim
              id: a-default-editor
              context: [runtime]
              omarchy: {method: default-editor}
              stdout:
                  - contains: nvim
            - check: the HTTP MIME handler is chromium
              id: a-mime-http
              context: [runtime]
              command: 'xdg-mime query default x-scheme-handler/http'
              stdout:
                  - contains: chromium.desktop
            - check: the directory MIME handler is nautilus
              id: a-mime-dir
              context: [runtime]
              command: 'xdg-mime query default inode/directory'
              stdout:
                  - contains: org.gnome.Nautilus.desktop
            - check: foot launches a window
              id: a-foot-launch
              context: [runtime]
              wl: {method: exec, command: foot}
            - check: the foot window appears
              id: a-foot-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: foot
              eventually: 45s
              retry_interval: 5s
            - check: the foot window closes
              id: a-foot-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.class == "foot") | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -q '"class": "foot"'
            - check: chromium launches a window
              id: a-chromium-launch
              context: [runtime]
              wl: {method: exec, command: 'chromium --new-window'}
            - check: the chromium window appears
              id: a-chromium-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: Chromium
              eventually: 60s
              retry_interval: 5s
            - check: the chromium window closes
              id: a-chromium-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.title | test("Chromium")) | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -qi chromium

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# system — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-system:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the system audit
            - check: the core package manifest exists
              id: a-manifest
              context: [runtime]
              file:
                  file: /usr/share/omarchy/install/omarchy-base.packages
            - check: the core packages are installed (the manifest audit)
              id: a-packages
              context: [runtime]
              command: 'while read -r p; do [ -z "$p" ] && continue; case "$p" in \#*) continue;; esac; pacman -Q "$p" >/dev/null 2>&1 || exit 1; done < /usr/share/omarchy/install/omarchy-base.packages'
            - check: a current theme is configured
              id: a-theme
              context: [runtime]
              omarchy: {method: theme-current}
              stdout:
                  - matches: '.+'
            - check: a current background is configured
              id: a-bg
              context: [runtime]
              omarchy: {method: theme-bg-current}
              stdout:
                  - matches: '.+'
            - check: a monospace font is configured
              id: a-font
              context: [runtime]
              omarchy: {method: font-current}
              stdout:
                  - matches: '.+'
            - check: the printing packages are in the base package set (the upstream cups-hardening assertion)
              id: a-cups-pkgs
              context: [runtime]
              command: 'for p in cups cups-filters system-config-printer cups-pk-helper; do grep -qxF "$p" /usr/share/omarchy/install/omarchy-base.packages || exit 1; done'
            - check: cups-browsed is out of the base package set (the upstream cups-hardening assertion)
              id: a-cups-browsed
              context: [runtime]
              command: '! grep -qxF cups-browsed /usr/share/omarchy/install/omarchy-base.packages'
            - check: the cups service is enabled
              id: a-cups-service
              context: [runtime]
              service:
                  service: cups
                  enabled: true
            - check: the timezone is UTC
              id: a-timezone
              context: [runtime]
              command: 'timedatectl show -p Timezone'
              stdout:
                  - contains: UTC
            - check: the locale is en_US.UTF-8
              id: a-locale
              context: [runtime]
              command: 'localectl status'
              stdout:
                  - contains: en_US.UTF-8

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# security — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-security:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the security posture
            - check: the user is not in the input group
              id: a-input-group
              context: [runtime]
              command: '! id -nG | grep -qw input'
            - check: the asdcontrol sudoers grant is absent
              id: a-asdcontrol
              context: [runtime]
              file:
                  file: /etc/sudoers.d/omarchy-asdcontrol
                  exists: false
            - check: the fido2 opt-in is absent
              id: a-fido2
              context: [runtime]
              command: '! pacman -Q fido2-* >/dev/null 2>&1'
            - check: the sshd hardening flow completes (the golden's passwordless sudo)
              id: a-sshd-setup
              context: [runtime]
              command: 'ssh-keygen -t ed25519 -N "" -q -f /tmp/omarchy-sshd-key && omarchy-setup-security-sshd --key="$(cat /tmp/omarchy-sshd-key.pub)"'
            - check: sshd is active after the setup
              id: a-sshd-active
              context: [runtime]
              service:
                  service: sshd
                  running: true
            - check: password authentication is off
              id: a-sshd-password
              context: [runtime]
              command: 'sudo -n sshd -T | grep -qixF "passwordauthentication no"'
            - check: the key is authorized
              id: a-sshd-key
              context: [runtime]
              command: 'grep -Fq "$(cat /tmp/omarchy-sshd-key.pub)" "$HOME/.ssh/authorized_keys"'
            - check: the dns sudoers grant is absent
              id: a-dns-sudoers
              context: [runtime]
              file:
                  file: /etc/sudoers.d/omarchy-dns
                  exists: false

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

