# the acceptance MATRIX: the 16 beds in parallel lanes (the batch drive)
check-omarchy-accept-matrix:
    pipeline:
        concurrency: {lanes: 16}
        stages:
            - id: bed
              kind: command
              command: 'charly check run check-omarchy-accept-$pr'
              expect_exit: 0
            - id: media
              kind: command
              command: 'mkdir -p media/accept-$pr-$calver && cp .check/check-omarchy-accept-$pr/*/evidence/* media/accept-$pr-$calver/ 2>/dev/null; for f in cast gif mjpeg mp4 png; do find media/accept-$pr-$calver -name "*.$f" | grep -q . || { echo "missing $f for $pr" >&2; exit 1; }; done'
              expect_exit: 0

# the acceptance SUITE: the ONE-command wrapper (zero extra parameters)
check-omarchy-accept-suite:
    pipeline:
        stages:
            - id: provision
              kind: command
              command: 'if ! charly vm snapshot list check-omarchy-eval-edge-inst 2>/dev/null | grep -q golden; then charly check run check-omarchy-eval-edge-inst; fi'
              expect_exit: 0
            - id: lock
              kind: command
              command: 'charly vm stop check-omarchy-eval-edge-inst 2>/dev/null || true'
              expect_exit: 0
            - id: matrix
              kind: command
              command: 'charly pipeline run check-omarchy-accept-matrix --prs session shell-surfaces menu-bar panels apps system security hyprland monitors network update plugins agents theme-media power-audio dev-migrations --lanes 16'
              expect_exit: 0
            - id: aggregate
              kind: command
              command: 'for b in session shell-surfaces menu-bar panels apps system security hyprland monitors network update plugins agents theme-media power-audio dev-migrations; do test -d ".check/check-omarchy-accept-$b" || { echo "missing run dir: $b" >&2; exit 1; }; for f in cast gif mjpeg mp4 png; do find "media/accept-$b-"* -name "*.$f" | grep -q . || { echo "missing $f for $b" >&2; exit 1; }; done; done'
              expect_exit: 0
            - id: report
              kind: command
              command: 'echo "# Omarchy acceptance matrix" > eval/omarchy-acceptance-matrix.md; for b in session shell-surfaces menu-bar panels apps system security hyprland monitors network update plugins agents theme-media power-audio dev-migrations; do echo "- $b: $(ls media/accept-$b-*/ 2>/dev/null | tr "
" " ")" >> eval/omarchy-acceptance-matrix.md; done'
              expect_exit: 0

# ── the golden base: provisions the omarchy VM and captures the golden ──────
check-omarchy-eval-base:
    vm:
        from: omarchy-vm
        disposable: true
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
        plan:
            - check: the omarchy guest reports its hostname
              id: ocb-hostname
              command: "uname -n"
              stdout:
                matches: ".+"
              eventually: 300s
              retry_interval: 10s
              context: [runtime]

# ── the INSTRUMENTED golden base (the stable channel): the golden PLUS the
# eval-tooling payload (charly, autologin, record tools incl. acpid, pr-apply)
# captured as its own golden. Per-PR evals clone from THIS golden; per-eval
# add_candy carries ONLY the record/spice PLUGIN providers (verbs register at
# check-run time — baking them gave 'no provider registered'). Provision once via
# the FRESH lane; re-provision = delete-before-recapture + golden-presence
# verification (RCA #7); the runner stops the domain after capture (RCA #3).
check-omarchy-eval-base-inst:
    vm:
        from: omarchy-vm
        disposable: true
        lifecycle: dev
        snapshot:
            on_finalize: golden
            mode: external
            keep_venue: true
        # NOTE: derives from omarchy-vm (post-#32); the [charly] repo configured in the base
        # golden's pacman.conf is NOT inherited here and must not be re-added — re-adding
        # a registered repo fails pacman with 'database already registered' (errors_fatal).
        add_candy:
            - omarchy-autologin
            - omarchy-eval-record
            - omarchy-eval-harden
            - omarchy-pr-apply
            - '@github.com/opencharly/layer-asciinema:v2026.246.1622'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
            - '@github.com/opencharly/plugin-omarchy/candy/plugin-omarchy:v2026.253.0930'
            - omarchy-corpus
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            # VALIDATION-ONLY: every mutation lives on the INSTALL timeline (candy
            # plans re-apply on every deploy-add; the entity plan's run: steps
            # execute once and are then skipped by the install ledger - RCA
            # 2026.252.1152). The omarchy-eval-harden candy owns: the FULL verified
            # preseed, the screenlocker disable, the agg ensure, the always-on
            # shell unit. These checks prove all of it on the final golden.
            - check: the instrumented golden reaches the FULL desktop (the shell stack required - Hyprland alone is a bare 0x111111 background that blanks every capture)
              id: inst-autologin
              context: [runtime]
              command: 'pgrep -x quickshell >/dev/null'
              eventually: 240s
              retry_interval: 10s
            - check: the screenlocker is disabled in the golden (no active sleep-lock, no hypridle running)
              id: inst-screenlock-disabled
              context: [runtime]
              command: '! pgrep -x hypridle >/dev/null && ! systemctl is-active omarchy-sleep-lock.service >/dev/null 2>&1'
            - check: the always-on shell unit is enabled for every future user session
              id: inst-shell-unit-enabled
              context: [runtime]
              command: 'systemctl --global is-enabled omarchy-eval-shell.service | grep -q enabled'
            - check: the agg gif generator is installed and runnable (the rec-gif step depends on it)
              id: inst-agg-present
              context: [runtime]
              command: 'test -s /usr/local/bin/agg && /usr/local/bin/agg --version'
            - check: acpid is enabled (ACPI power-off handling present in the golden)
              id: inst-acpid
              context: [runtime]
              service:
                  service: acpid
                  enabled: true
            - check: the pr-apply helper is present NON-EMPTY (the executor drops heredoc stdin - an empty helper silently no-ops every apply)
              id: inst-pr-apply
              context: [runtime]
              command: 'test -s /usr/local/bin/pr-apply && head -1 /usr/local/bin/pr-apply | grep -q "#!/usr/bin/env bash"'
            - check: the pr-apply pre-seed clone exists with the head objects
              id: inst-preseed-ok
              context: [runtime]
              command: 'sudo -n test -d /root/.cache/omarchy-pr-apply.git'
eval-lane:
  candy:
    version: 2026.251.0000
    description: |
      The omarchy PR-eval lane wiring: composes the generic pipeline engine + the
      PR-tool plugin, declares the complete env/secret contract, and carries the ADE
      self-checks. The pipeline itself is the eval-lane-plan kind:pipeline entity in
      this file — every stage, prompt, template, and schema INLINE.
    candy:
      - '@github.com/opencharly/plugin-pipeline/candy/plugin-pipeline:v2026.253.1141'
      - '@github.com/opencharly/plugin-review/candy/plugin-review:v2026.251.1939'
    var:
      EVAL_LANES: "16"
      EVAL_MAX_REDO: "2"
      EVAL_REDO_ESCALATE: "3"
      EVAL_REPO: omacom/omarchy
    env_require:
      - name: EVAL_UMBRELLA
        description: "Path to the opencharly umbrella checkout"
        default: ""
    env_accept:
      - name: EVAL_LLM_BASE_URL
        description: "LLM chat-completions base URL (default: the local ollama server)"
      - name: EVAL_LLM_MODEL
        description: "LLM model id (default: deepseek-v4-flash:cloud on the local ollama)"
      - name: EVAL_LLM_PROVIDER
        description: "LLM provider name"
      - name: EVAL_DRY_RUN
        description: "Dry-run flag"
      - name: EVAL_DEBUG
        description: "Verbose run debugging"
      - name: EVAL_LANES
        description: "Concurrency lanes"
      - name: EVAL_MAX_REDO
        description: "Redo bound"
      - name: EVAL_PUBLISH
        description: "approve -> the publication gate posts"
      - name: BARE_PROMPT
        description: "Inline prompt for the standalone agent surface"
    secret_accept:
      - name: EVAL_LLM_API_KEY
        description: "LLM provider API key"
        key: charly/api-key/eval-llm
    plan:
      - check: the pipeline executor self-tests
        id: ade-pipeline-present
        context: [runtime]
        command: charly pipeline --self-test
        exit_status: 0
      - check: the pipeline entity validates against #PipelineInput
        id: ade-pipeline-valid
        context: [runtime]
        command: charly pipeline validate eval-lane-plan
        exit_status: 0

eval-lane-plan:
  pipeline:
    repo: omacom/omarchy
    skills:
      corpus: "candy/eval-lane/skills"
    gates: [sequencing, lock_audit]
    redo: { max: 2, escalate_after: 3 }
    concurrency: { lanes: 16 }
    channels:
      stable: { golden: check-omarchy-eval-base-inst:golden, provision: eval-lane-plan-channel-stable }
      rc:     { golden: check-charly-omarchy-rc-vm:golden,     provision: eval-lane-plan-channel-rc }
      edge:   { golden: check-charly-omarchy-edge-vm:golden,   provision: eval-lane-plan-channel-edge }
      dev:    { golden: check-charly-omarchy-dev-vm:golden,    provision: eval-lane-plan-channel-dev }
    media:
      files: [cast, gif, mjpeg, mp4, png]
      min: { cast: 200, gif: 1024, mjpeg: 4096, mp4: 4096, png: 1024 }
      dir: "media/pr-$pr-$calver"
    report:
      # the user-voice report contract (2026.252): the eval reads like a fellow
      # omarchy user who pulled the PR and tested it — NOT a maintainer audit.
      # No verdict section: what I did, what happened, what I'd suggest.
      template: |-
        ---
        head: ${sha}
        channel: ${channel}
        class: ${class}
        tier: ${tier}
        posted: false
        ---
        # I tested omacom/omarchy#$pr — here's what happened
        ## Tests
        ${tests_body}
        Recordings: terminal ${cast} · desktop ${mp4} (${png}, ${gif}) · full run matrix: .check/check-omarchy-pr-$pr-vm/
        Upstream's own corpus surfaces ran: ${corpus_run} (passed ${corpus_ok}) — the charly-native equivalents of omarchy's own tests, per the omarchy-corpus plan in charly.yml.
        ## Suggestions
        ${suggestions_body}
        *Assisted-by: charly eval-lane agent ollama/deepseek-v4-flash:cloud (fully tested and validated)*
        *Tested-by: charly eval-lane (channel ${channel}, golden ${golden}, bed check-omarchy-pr-$pr-vm @ $calver)*
      frontmatter_schema: |-
        { "type": "object", "required": [pr, head, channel, class, tier, posted] }
      bed_template: |-
        version: 2026.249.2125
        check-omarchy-pr-$pr-vm:
          vm:
            from: ${golden}
            disposable: true
            lifecycle: dev
            update_gate: restart-only
            add_candy:
              - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
              - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
              # the updated pr-apply (the test-context closure) overwrites the
              # golden's baked script at deploy time — no golden re-provision.
              - omarchy-pr-apply
              # upstream's own contract surfaces run per PR (the whole corpus is
              # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
              # drives the report emphasis, the corpus facts land in the ledger)
              - omarchy-corpus
            plan:
              - check: apply PR $pr via the single apply seam
                id: pr-apply
                context: [runtime]
                command: 'pr-apply $pr ${sha} ${files}'
              - check: the PR's OWN test suite passes on the applied system
                id: pr-tests
                context: [runtime]
                command: 'for t in ${tests}; do bash "$t" || exit 1; done'
              ${checks}
              - check: start a terminal recording
                id: rec-start
                context: [runtime]
                record: {method: start, record_mode: terminal, record_name: pr-$pr}
              - check: start the SPICE display video capture
                id: rec-spice-start
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: record, action: start, record_name: pr-$pr, fps: 5}
              - check: drive the PR key command inside the recording
                id: rec-drive
                context: [runtime]
                record:
                  method: run
                  record_name: pr-$pr
                  # the drive is ARBITRARY shell — a block scalar, never a flow
                  # mapping (RCA 2026.252.2250: the inlined text broke the
                  # rendered YAML on shell metacharacters).
                  text: |-
                    ${drive}
                  settle_ms: 1000
              - check: capture the VM display via SPICE
                id: rec-screen-spice
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: screenshot, artifact: /tmp/pr-$pr.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
              - check: stop the SPICE capture and pull the MJPEG stream
                id: rec-spice-stop
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                spice: {method: record, action: stop, record_name: pr-$pr, artifact: /tmp/pr-$pr.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
              - check: stop the terminal recording and pull the .cast
                id: rec-stop
                context: [runtime]
                record: {method: stop, record_name: pr-$pr, artifact: /tmp/pr-$pr.cast, artifact_min_bytes: 200}
              - check: render the .cast to an animated GIF
                id: rec-gif
                eventually: 25s
                retry_interval: 3s
                context: [runtime]
                record: {method: gif, record_name: pr-$pr, artifact: /tmp/pr-$pr.gif, artifact_min_bytes: 100}
              - run: transcode the SPICE MJPEG capture to MP4
                id: rec-mp4
                context: [runtime]
                command: 'ffmpeg -y -loglevel error -i /tmp/pr-$pr.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-$pr.mp4'
      control_bed_template: |-
        version: 2026.249.2125
        check-omarchy-pr-$pr-control:
          vm:
            from: ${golden}
            disposable: true
            lifecycle: dev
            update_gate: restart-only
            plan:
              # the NEGATIVE CONTROL: the negated checks on the PRISTINE golden.
              # Every negated step must PASS (every original check failed without
              # the PR = every knownRed claim holds). A control step failing means
              # the original check passed without the PR — a FAKE assertion,
              # caught at render, never shipped to a real eval.
              ${checks}

    stages:
      - id: triage
        kind: agent
        skill: [omarchy-eval-lane, omarchy-eval-oracle, omarchy-eval-tiers, omarchy-eval-tests]
        tools: [pr, ledger]
        max_turns: 10
        # the informed retry: a typed-output contract violation fails the stage
        # with the redo-plan trigger; the chain restarts from triage and the
        # retried agent sees the violation in the ledger facts. The budget is
        # generous (the retry is cheap — no VM runs) while the VM redo edges
        # stay tight.
        redo:
          max: 4
          escalate_after: 5
          triggers: { redo-plan: triage }
        outputs:
          class: { type: enum, enum: [system, packaging, visual, skip], description: "the PR's change class" }
          tier: { type: enum, enum: [pod, vm, visual, gpu], description: "the evidence tier" }
          channel: { type: enum, enum: [stable, rc, edge, dev], description: "the channel whose golden best fits the PR's class/tier — the oracle decides the venue" }
          sha: { type: string, description: "the PR head sha" }
          files: { type: string_list, description: "the PR's changed file paths" }
          drive: { type: string, description: "one shell command exercising the PR's key behavior" }
          tests: { type: string_list, description: "the PR's own test files, absolute paths in the applied system" }
          corpus: { type: string_list, description: "the selected omarchy-corpus bed names (the charly-native equivalents that make sense for this PR)" }
          corpus_note: { type: string, description: "one line WHY these corpus beds (or why empty)" }
          checks: { type: object, description: "the behavior checks: [{id, what, assertion, knownRed}]" }
          what: { type: string, description: "one line: what the PR does (its key behavior)" }
          record: { type: bool, description: "whether to record the eval" }
          visual: { type: bool, description: "whether the class is visual" }
        prompt: |-
          REPLY CONTRACT (read this FIRST): your ENTIRE reply is ONE JSON object
          and NOTHING else. The first character is '{'. No prose, no preamble, no
          markdown fences, no trailing text. The object carries EXACTLY these
          fields, every one present:
            class: "system" | "packaging" | "visual" | "skip"
            tier: "pod" | "vm" | "visual" | "gpu"   (the ENUM KEY, never a prose label)
            channel: "stable" | "rc" | "edge" | "dev"   (the GOLDEN VM selection — NOT the tier)
            sha: the PR head sha
            files: [the PR's changed file paths]
            drive: one shell command exercising the PR's key behavior
            tests: [the PR's own test files, absolute paths in the applied system]
            corpus: [the selected omarchy-corpus bed names, or [] if none make sense]
            corpus_note: one line WHY these corpus beds (or why empty)
            checks: [ {id, what, assertion, knownRed}, ... ]   (OBJECTS — never bare strings)
            what: one line describing what the PR does (its key behavior)
            record: true | false   (a JSON boolean, never a string)
            visual: true | false
          After you have the PR facts, produce the JSON immediately — do not call
          more tools.
          You are the Config Oracle for the omarchy PR-eval lane. You decide WHAT to
          test and HOW — never DO the testing. TRIAGE (useful? new insight? testable
          on this hardware? tier?) then PLAN. NEVER run a bed.
          Follow the omarchy-eval-oracle skill: classify the diff, resolve the PR
          head sha + changed files + the PR's OWN test files (never invent tests),
          and author the behavior checks.
          Every check is a shell assertion (grep/test) that PROVES the PR's behavior
          on the live system at its ABSOLUTE system paths (/usr/share/omarchy/...,
          /etc/..., ~/.config/...). Scripts may not be +x after apply: invoke them
          via their interpreter (bash <abs path>). knownRed is a CONTRACT: the
          control bed runs the negated assertion on the pristine golden — an
          assertion that passes without the PR is a FAKE check and the lane
          re-renders informed. Author assertions that are red by construction:
          they reference the PR's own added lines.
          The drive command: ONE shell command that exercises the PR's key behavior
          inside the recording.
          A draft or WIP PR is class "skip" — never a faked bed.
          THE CORPUS CONTRACT (follow the omarchy-eval-tests skill): after the
          PR's own test files, select the omarchy-corpus beds that make sense
          for this PR (changed-file adjacency: bin/omarchy-* → the cli beds;
          config/shell changes → the feature-matched shell beds; migration
          PRs → their named beds; visual PRs → the acceptance beds). NEVER
          select hardware-bound beds (hw-*, t2-*, brcmfmac-*) or nested-VM beds
          (windows-vm-*) — record PARTIAL instead. NEVER select the whole
          corpus. corpus_note says WHY (an empty corpus with an unexplained
          note fails the lane). Corpus beds run after your checks, before the
          drive recording; the acceptance beds last.
          The channel output is YOUR decision — the oracle picks the GOLDEN VM
          from the AVAILABLE channels (the registry): currently ONLY "stable"
          (the instrumented full desktop golden). A visual/desktop PR needs
          stable; a script/packaging PR can use it too. Never invent a channel
          that is not in the registry — an unavailable channel fails the lane
          and you re-author informed.
          THE CONTROL CONTRACT: when the ledger facts show the control bed
          FAILED (a negated check failed = an original check PASSED on the
          pristine golden = a FAKE assertion), call run_outcomes on the control
          bed FIRST — read the FAILING step — then RE-AUTHOR that check: remove
          or replace the fake assertion (it must be red by construction: it
          references the PR's own added lines). Never re-emit the same checks.
          YOUR REPLY IS ALWAYS THE JSON OBJECT — even when you conclude the
          control failure is environmental, the JSON carries the re-authored
          checks (or the unchanged checks with the reasoning in knownRed).
          NEVER reply with prose analysis — the analysis belongs in the JSON.
      - id: corpus-gate
        kind: probe
        # THE CORPUS GATE (the charly.yml single source): every oracle-selected
        # corpus step id MUST exist as a step id: in the omarchy-corpus candy
        # charly.yml — the CUE-validated single source. A selected id the plan
        # does not carry is the oracle's gap; the informed redo re-authors.
        # An empty selection is legal (the corpus_note says why).
        verbs: [corpus_audit]
        input:
          corpus: "candy/omarchy-corpus/charly.yml"
          ids: "@triage.corpus"
        redo:
          triggers: { redo-plan: triage }
      - id: channel-map
        kind: probe
        verbs: [resolve_channel]
        input:
          channels:
            # the AVAILABLE VENUES: the channels whose goldens resolve in the
            # vm from: (the qualified namespace refs are not from:-compatible).
            # The oracle picks among these — the registry is the deterministic
            # mapping, never an env var.
            stable: { golden: check-omarchy-eval-base-inst:golden, provision: eval-lane-plan-channel-stable }
          channel: "@triage.channel"
        outputs: [golden, provision]
        # an unavailable channel is an informed redo: the triage re-authors
        # with the ledger facts showing exactly which channels exist.
        redo:
          triggers: { redo-plan: triage }
      - id: bed-render
        kind: generate
        template: "$report.bed_template"
        # a class "skip" (a draft/WIP PR) never renders a bed — the
        # NOT_TESTABLE_PR report renders instead.
        skip_when: "@triage.class == skip"
        vars:
          pr: "$pr"
          golden: "@channel-map.golden"
          sha: "$env.PR_HEAD_SHA"
          files: "@triage.files"
          drive: "@triage.drive"
          channel: "@channel-select.channel"
          checks: "@triage.checks"
          tests: "@triage.tests"
        out: "pr-beds/pr-$pr/charly.yml"
        validate: |
          set -eu
          test -s "pr-beds/pr-$pr/charly.yml"
          # the missed control (RCA 2026.252): a bed whose rendered steps carry
          # placeholder or empty substitutions is REJECTED at render time -
          # never shipped to a real bed run.
          if grep -qE -e 'text: [$]drive' -e "pr-apply [0-9]+  '" "pr-beds/pr-$pr/charly.yml"; then
            echo "bed-render: placeholder or empty substitution in the rendered bed" >&2
            exit 1
          fi
          # the checks are DETERMINISTIC command steps now — an inert agent-check
          # step (the no-grader-bound SKIP era) is rejected at render time.
          if grep -qE "agent-check|verify with" "pr-beds/pr-$pr/charly.yml"; then
            echo "bed-render: an inert agent-check step rendered — the checks must be command steps" >&2
            exit 1
          fi
          "${CHARLY_BIN:-charly}" box validate
      - id: control-render
        kind: generate
        template: "$report.control_bed_template"
        negate_checks: true
        skip_when: "@triage.class == skip"
        vars:
          pr: "$pr"
          golden: "@channel-map.golden"
          checks: "@triage.checks"
        out: "pr-beds/pr-$pr-control/charly.yml"
        validate: |
          set -eu
          test -s "pr-beds/pr-$pr-control/charly.yml"
          if grep -qE "agent-check|verify with" "pr-beds/pr-$pr-control/charly.yml"; then
            echo "control-render: an inert agent-check step rendered" >&2
            exit 1
          fi
          "${CHARLY_BIN:-charly}" box validate
      - id: control
        kind: ade
        bed: check-omarchy-pr-$pr-control
        skip_when: "@triage.class == skip"
        # the negative control: the negated checks must PASS on the pristine
        # golden (every original check failed without the PR = every knownRed
        # claim holds). A FAIL verdict = a FAKE assertion (an original check
        # passed without the PR) -> the setup-defect record renders, naming the
        # failing check (the control's summary) + the informed fix. The
        # setup-defects ledger is the self-improving loop's memory — the
        # cold-read reads it for informed suggestions.
        fail_on: [FAIL]
        redo:
          triggers: { redo-plan: setup-defect }
      - id: config-audit
        kind: probe
        verbs: [config_audit]
        input: { bed: "pr-beds/pr-$pr/charly.yml", pr: "$pr" }
        skip_when: "@triage.class == skip"
        redo:
          triggers: { redo-plan: bed-render }
      - id: eval
        kind: ade
        bed: check-omarchy-pr-$pr-vm
        # the verdict is a GATE: NO_VALIDATION/SKIP are LANE DEFECTS (the
        # harness failed) — the stage fails and the setup-defect record renders
        # instead of a worthless eval. PASS/FAIL are real outcomes and flow on.
        # A class "skip" (a draft/WIP PR) never runs a bed — the NOT_TESTABLE_PR
        # report renders instead.
        skip_when: "@triage.class == skip"
        fail_on: [NO_VALIDATION, SKIP]
        redo:
          triggers: { redo-plan: setup-defect }
      - id: assemble-media
        kind: media
        assemble: true
        transcode: mjpeg:mp4
        skip_when: "@triage.class == skip"
      - id: evidence-audit
        kind: probe
        verbs: [media_gate, lock_audit]
        skip_when: "@triage.class == skip"
        input:
          media_gate: { dir: "media/pr-$pr-$calver", files: [cast, gif, mjpeg, mp4, png], min: {cast: 200, gif: 1024, mjpeg: 4096, mp4: 4096, png: 1024} }
          # the lock audit scopes to THIS run's trees — the whole .check tree
          # carries stale .lock files from unrelated historical runs.
          lock_audit: { trees: ["$workdir/.check/check-omarchy-pr-$pr-vm", "$workdir/.check/check-omarchy-pr-$pr-control"] }
        redo:
          triggers: { redo-run: eval }
      - id: ledger-gate
        kind: probe
        verbs: [ledger_gate]
        skip_when: "@triage.class == skip"
        input:
          # bed_name/control_bed_name are ENTITY NAMES — the probe's path
          # rooting (the bed/dir keys) would corrupt them into absolute paths.
          bed_name: "check-omarchy-pr-$pr-vm"
          control_bed_name: "check-omarchy-pr-$pr-control"
          media_dir: "media/pr-$pr-$calver"
          # the corpus facts: the omarchy-corpus charly.yml is the identity source
          # for the corpus-surface results (never conflated with the oracle's checks)
          corpus_file: "candy/omarchy-corpus/charly.yml"
        outputs: [executed_checks, control_ok, media_ok, corpus_run, corpus_ok, corpus_skipped]
      - id: not-testable
        kind: generate
        template: |-
          ---
          head: ${sha}
          channel: ${channel}
          class: skip
          tier: ${tier}
          posted: false
          ---
          # I looked at omacom/omarchy#$pr — this one is not testable yet
          ## Tests
          This PR is a draft or WIP — there is no testable behavior to exercise
          on this setup yet. What it does: ${what}. When it is ready for review,
          the lane will evaluate it like any other PR.
          ## Suggestions
          - Mark the PR ready for review when the behavior is implemented.
          *Assisted-by: charly eval-lane agent ollama/deepseek-v4-flash:cloud (fully tested and validated)*
          *Tested-by: charly eval-lane (channel ${channel}, golden ${golden}, bed check-omarchy-pr-$pr-vm)*
        vars:
          pr: "$pr"
          sha: "$env.PR_HEAD_SHA"
          channel: "@triage.channel"
          tier: "@triage.tier"
          golden: "@channel-map.golden"
          what: "@triage.what"
        out: "eval/pr-$pr.md"
        skip_when: "@triage.class != skip"
      - id: setup-defect
        kind: generate
        template: |-
          # SETUP DEFECT — $pr @ $calver
          The lane could NOT evaluate this PR: the harness failed, not the PR.
          This is the clear result for a setup failure — never a whiny eval.

          - failing stage: @control.verdict (the control bed) or @eval.verdict (the eval bed)
          - stderr signature: @control.summary @eval.summary
          - classified cause: the check-run could not produce a verdict, or a
            knownRed claim is unproven (a FAKE assertion — the control's FAIL
            line names the check)
          - informed fix: read the signature above; fix the setup (the golden,
            the plugin refs, the discover paths, the triage's checks) and
            re-run the lane
        out: "setup-defects/$calver-pr-$pr.md"
        skip_when: "@eval.verdict == PASS || @eval.verdict == FAIL || @triage.class == skip"
      - id: report
        kind: agent
        skill: [omarchy-eval-lane, omarchy-eval-full-loop]
        tools: [ledger]
        max_turns: 6
        skip_when: "@eval.verdict != PASS && @eval.verdict != FAIL"
        # the informed retry: a typed-output contract violation (e.g. the tests
        # field as an array instead of a string) fails with the redo-plan
        # trigger; the chain restarts from report and the retried agent sees
        # the violation in the ledger facts.
        redo:
          max: 3
          escalate_after: 4
          triggers: { redo-plan: report }
        outputs:
          tests: { type: string, description: "the user-voice Tests paragraph" }
        prompt: |-
          You are a fellow omarchy user who pulled this PR onto your machine and
          tested it — NOT the repo maintainer, NOT an audit. Write like a user in
          an issue comment: first person, plain words, what you did and what you
          actually saw happen.
          The ledger facts in your user message carry the triage plan, the eval
          verdict, and the executed step outcomes — narrate from THOSE facts, never
          from guessing. Name every executed check with its observed outcome; say
          plainly what you could NOT test and why — never silent, never a lament.
          The Suggestions section is owned by the cold-read stage — do NOT emit it.
          Do NOT write any file. Do NOT post.
          REPLY CONTRACT: your ENTIRE reply is ONE JSON object and NOTHING else.
          The first character is '{'. No prose, no preamble, no markdown fences
          (never wrap the object in ```json — the fence breaks the parse). The
          object carries EXACTLY the declared outputs: the "tests" field IS the
          ENTIRE Tests section — one compact user-voice paragraph (what I pulled
          and applied, what I ran, what worked and what didn't, exactly as
          observed). Do NOT emit any other field (no "report", no "summary" —
          the narrative goes IN the tests field).
      - id: cold-read
        kind: agent
        skill: [omarchy-eval-lane, omarchy-eval-cold-reader]
        tools: [ledger]
        max_turns: 6
        skip_when: "@eval.verdict != PASS && @eval.verdict != FAIL"
        redo:
          max: 3
          escalate_after: 4
          triggers: { redo-plan: cold-read }
        outputs:
          verdict: { type: enum, enum: [PASS, FAIL, NO_VALIDATION], description: "the packet verdict" }
          suggestions: { type: string, description: "the user-voice suggestions" }
        prompt: |-
          Fresh-context validation of the evidence packet against the ledger facts
          in your user message — the deterministic gates first (executed_checks >= 1,
          control_ok, media_ok from the ledger-gate stage, plus the corpus facts:
          corpus_run/corpus_ok/corpus_skipped — the omarchy-corpus surfaces that ran
          upstream's own contract; a corpus result contradicted by a report claim is
          a FAIL), then the prose gates (every material claim corroborated,
          user-voice, no verdict language, no lament). A packet with zero executed
          checks is a SETUP_DEFECT — say so plainly. The suggestions are actionable
          user words, informed by the setup-defects ledger (what the lane already
          learned).
          REPLY CONTRACT: your ENTIRE reply is ONE JSON object and NOTHING else.
          The first character is '{'. No prose, no preamble, no markdown fences
          (never wrap the object in ```json — the fence breaks the parse). The
          object carries EXACTLY the declared outputs (verdict, suggestions).
          The verdict is the PACKET verdict: PASS | FAIL | NO_VALIDATION — never
          the lane state (SETUP_DEFECT is a lane classification, not a verdict).
      - id: render-report
        kind: generate
        template: "$report.template"
        vars:
          pr: "$pr"
          sha: "$env.PR_HEAD_SHA"
          class: "@triage.class"
          channel: "@triage.channel"
          tier: "@triage.tier"
          golden: "@channel-map.golden"
          tests_body: "@report.tests"
          corpus_run: "@ledger-gate.corpus_run"
          corpus_ok: "@ledger-gate.corpus_ok"
          corpus_skipped: "@ledger-gate.corpus_skipped"
          suggestions_body: "@cold-read.suggestions"
          cast: "media/pr-$pr-$calver/pr-$pr.cast"
          mp4: "media/pr-$pr-$calver/pr-$pr.mp4"
          png: "media/pr-$pr-$calver/pr-$pr.png"
          gif: "media/pr-$pr-$calver/pr-$pr.gif"
        out: "eval/pr-$pr.md"
        skip_when: "@eval.verdict != PASS && @eval.verdict != FAIL"
        validate: |
          set -eu
          f="eval/pr-$pr.md"
          test -s "$f"
          for s in "## Tests" "## Suggestions"; do grep -qF "$s" "$f" || { echo "report: missing section: $s" >&2; exit 1; }; done
          grep -qE "^\\*Assisted-by: .+\\*" "$f" || { echo "report: missing/empty Assisted-by footer" >&2; exit 1; }
          grep -qE "^\\*Tested-by: .+\\*" "$f" || { echo "report: missing/empty Tested-by footer" >&2; exit 1; }
          if grep -qE "^## (What|How|Recordings|Result)" "$f"; then echo "report: legacy or verdict heading present" >&2; exit 1; fi
          if grep -qE "^#.*\\b(PASS|FAIL|NO_VALIDATION)\\b" "$f"; then echo "report: verdict language present - the eval is user-voice" >&2; exit 1; fi
          # the SUBSTANCE validate (the anti-whine gate): the Tests section must
          # name at least one executed check with an observed outcome, and the
          # evidence paths must RESOLVE on the tree — a worthless eval fails here.
          sed -n "/^## Tests/,/^## Suggestions/p" "$f" | grep -qiE "(worked|didn't|did not|failed|passed|N/A|not testable|could not|couldn't)" || { echo "report: Tests lacks observed outcomes or N/A reasons" >&2; exit 1; }
          if grep -qE "no entity|ktree is not installed|harness failed|NO_VALIDATION" "$f"; then echo "report: harness-failure language - this is a SETUP_DEFECT, not an eval" >&2; exit 1; fi
          for p in "media/pr-$pr-$calver/pr-$pr.cast" "media/pr-$pr-$calver/pr-$pr.mp4" "media/pr-$pr-$calver/pr-$pr.png" "media/pr-$pr-$calver/pr-$pr.gif"; do
            test -s "$p" || { echo "report: evidence path missing: $p" >&2; exit 1; }
          done
          test -d ".check/check-omarchy-pr-$pr-vm" || { echo "report: the run matrix dir is missing" >&2; exit 1; }
          if grep -qE "^  - name:" "$f"; then echo "report: inlined step matrix - link the evidence packet instead" >&2; exit 1; fi
      - id: publish
        kind: gate
        condition: "$env.EVAL_PUBLISH == approve"
        # the designed skip: no approval, no publication — the R10 gate must
        # complete at ZERO failures (validator finding R10/B12), so the
        # unset-approval run reports a skip, never a fail. The cold-read's
        # verdict is a GATE too: a NO_VALIDATION packet is never published.
        skip_when: "$env.EVAL_PUBLISH != approve || @cold-read.verdict == NO_VALIDATION"
      - id: metrics
        kind: generate
        template: |-
          # Lane metrics — $pr @ $calver
          - eval verdict: @eval.verdict
          - control verdict: @control.verdict
          - executed checks: @ledger-gate.executed_checks
          - control ok: @ledger-gate.control_ok
          - media ok: @ledger-gate.media_ok
          - cold-read verdict: @cold-read.verdict
          - report: eval/pr-$pr.md (TESTED / NOT_TESTABLE_PR) or setup-defects/ (SETUP_DEFECT)
        vars:
          pr: "$pr"
          calver: "$calver"
        out: "metrics/$calver-pr-$pr.md"
        skip_when: "@triage.class == skip"