# session — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-session:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - '@github.com/opencharly/plugin-cdp/candy/plugin-cdp:v2026.254.0539'
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the ground-up health checks
            - check: the compositor reports a monitor
              id: a-monitors
              context: [runtime]
              wl: {method: hypr-monitors}
              stdout:
                  - contains: Virtual-1
            - check: the shell answers the IPC ping
              id: a-shell-ping
              context: [runtime]
              quickshell: {method: ping, config: /usr/share/omarchy/shell}
            - check: the 13 core shell plugins are loaded
              id: a-plugins
              context: [runtime]
              omarchy: {method: shell-list-plugins}
              stdout:
                  - contains: omarchy.audio
                  - contains: omarchy.weather
            - check: the bar and background layers are on screen
              id: a-layers
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-bar
                  - contains: omarchy-background
            # G-4: the desktop layers surface — a real frame of the full desktop
            # (bar + background) landed straight into the direct-write media dir.
            - check: capture the desktop layers surface
              id: a-layers-shot
              context: [runtime]
              wl: {method: screenshot, artifact: 'media/${CALVER}/${BED}/${BED}-layers.png', artifact_min_bytes: 1024, artifact_not_uniform: true}
            - check: pipewire is running
              id: a-pipewire
              context: [runtime]
              command: 'wpctl status'
            - check: the root filesystem is btrfs
              id: a-btrfs
              context: [runtime]
              command: 'findmnt -no FSTYPE /'
              stdout:
                  - contains: btrfs
            - check: omarchy reports its version
              id: a-version
              context: [runtime]
              omarchy: {method: version}
              stdout:
                  - matches: '^[0-9]+.[0-9]+.[0-9]+'
            - check: no failed system units
              id: a-failed-system
              context: [runtime]
              command: 'systemctl --failed --system --no-legend'
              stdout:
                  - matches: '^$'
            - check: no failed user units
              id: a-failed-user
              context: [runtime]
              command: 'systemctl --failed --user --no-legend'
              stdout:
                  - matches: '^$'
            - check: the shell restart is idempotent
              id: a-restart
              context: [runtime]
              command: 'OMARCHY_PATH=/usr/share/omarchy omarchy-restart-shell'
              eventually: 30s
              retry_interval: 5s
            - check: the shell answers after the restart
              id: a-restart-ping
              context: [runtime]
              quickshell: {method: ping, config: /usr/share/omarchy/shell}
              eventually: 30s
              retry_interval: 5s

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# shell-surfaces — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-shell-surfaces:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the shell surface round-trips
            - check: the emoji picker opens
              id: a-emoji-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.emojis}
            - check: the emoji picker layer is present
              id: a-emoji-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-emojis
              eventually: 15s
              retry_interval: 3s
            - check: type into the emoji picker
              id: a-emoji-type
              context: [runtime]
              wl: {method: type, text: rocket}
            - check: the emoji picker selection closes
              id: a-emoji-close
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the clipboard history captures seeded text
              id: a-clipboard-seed
              context: [runtime]
              command: 'export WAYLAND_DISPLAY=$(ls -t /run/user/1000/wayland-* 2>/dev/null | grep -v "\.lock$" | head -1 | xargs -r basename); printf "Omarchy acceptance clipboard %s" "$(date +%s)" | wl-copy >/dev/null 2>&1'
            - check: the clipboard history file records it
              id: a-clipboard-history
              context: [runtime]
              command: 'grep -Fq "Omarchy acceptance clipboard" "$HOME/.local/state/omarchy/clipboard-history.json"'
              eventually: 15s
              retry_interval: 3s
            - check: the clipboard picker opens
              id: a-clipboard-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.clipboard}
            - check: the clipboard search finds the text
              id: a-clipboard-search
              context: [runtime]
              wl: {method: type, text: Omarchy acceptance clipboard}
            - check: the clipboard selection restores the text
              id: a-clipboard-restore
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the notification popup renders
              id: a-notify-send
              context: [runtime]
              omarchy: {args: 'notification send "Acceptance notification" "Shell notification rendering" --expire-time=15000'}
            - check: the notification layer is present
              id: a-notify-layer
              context: [runtime]
              wl: {method: hypr-layers}
              stdout:
                  - contains: omarchy-notifications
              eventually: 15s
              retry_interval: 3s
            - check: the notification dismisses
              id: a-notify-dismiss
              context: [runtime]
              omarchy: {args: 'shell notifications dismissOne'}
            # G-4: the shell-surfaces bed captures the bar surface (the always-on
            # shell layer, post-notification) and the weather surface (the panel
            # round-trip) — each landed straight into the direct-write media dir.
            - check: capture the bar surface
              id: a-bar-shot
              context: [runtime]
              wl: {method: screenshot, artifact: 'media/${CALVER}/${BED}/${BED}-bar.png', artifact_min_bytes: 1024, artifact_not_uniform: true}
            - check: open the weather surface for capture
              id: a-weather-shot-open
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.weather}
            - check: capture the weather surface
              id: a-weather-shot
              context: [runtime]
              wl: {method: screenshot, artifact: 'media/${CALVER}/${BED}/${BED}-weather.png', artifact_min_bytes: 1024, artifact_not_uniform: true}
            - check: close the weather surface
              id: a-weather-shot-close
              context: [runtime]
              omarchy: {method: shell-hide, plugin: omarchy.weather}
            - check: the apps menu launcher loop (omawrite)
              id: a-apps-menu
              context: [runtime]
              omarchy: {method: shell-summon, plugin: omarchy.menu, payload: '{"menu":"apps"}'}
            - check: the apps menu launches the top hit
              id: a-apps-launch
              context: [runtime]
              wl: {method: type, text: omawrite}
            - check: the apps menu confirms the top hit
              id: a-apps-enter
              context: [runtime]
              wl: {method: key, key: Return}
            - check: the omawrite window appears
              id: a-apps-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: omawrite
              eventually: 60s
              retry_interval: 5s
            - check: the omawrite window closes
              id: a-apps-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.class == "omawrite") | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -q '"class": "omawrite"'

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# menu-bar — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-menu-bar:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
