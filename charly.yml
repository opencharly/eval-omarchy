        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the system audit
            - check: the core package manifest exists
              id: a-manifest
              context: [runtime]
              file:
                  file: /usr/share/omarchy/install/omarchy-base.packages
            - check: the core packages are installed (the manifest audit)
              id: a-packages
              context: [runtime]
              command: 'while read -r p; do [ -z "$p" ] && continue; case "$p" in \#*) continue;; esac; pacman -Q "$p" >/dev/null 2>&1 || exit 1; done < /usr/share/omarchy/install/omarchy-base.packages'
            - check: a current theme is configured
              id: a-theme
              context: [runtime]
              omarchy: {method: theme-current}
              stdout:
                  - matches: '.+'
            - check: a current background is configured
              id: a-bg
              context: [runtime]
              omarchy: {method: theme-bg-current}
              stdout:
                  - matches: '.+'
            - check: a monospace font is configured
              id: a-font
              context: [runtime]
              omarchy: {method: font-current}
              stdout:
                  - matches: '.+'
            - check: the printing packages are in the base package set (the upstream cups-hardening assertion)
              id: a-cups-pkgs
              context: [runtime]
              command: 'for p in cups cups-filters system-config-printer cups-pk-helper; do grep -qxF "$p" /usr/share/omarchy/install/omarchy-base.packages || exit 1; done'
            - check: cups-browsed is out of the base package set (the upstream cups-hardening assertion)
              id: a-cups-browsed
              context: [runtime]
              command: '! grep -qxF cups-browsed /usr/share/omarchy/install/omarchy-base.packages'
            - check: the cups service is enabled
              id: a-cups-service
              context: [runtime]
              service:
                  service: cups
                  enabled: true
            - check: the timezone is UTC
              id: a-timezone
              context: [runtime]
              command: 'timedatectl show -p Timezone'
              stdout:
                  - contains: UTC
            - check: the locale is en_US.UTF-8
              id: a-locale
              context: [runtime]
              command: 'localectl status'
              stdout:
                  - contains: en_US.UTF-8

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# security — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-security:
    vm:
        from: check-omarchy-eval-edge-inst:golden
        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the security posture
            - check: the user is not in the input group
              id: a-input-group
              context: [runtime]
              command: '! id -nG | grep -qw input'
            - check: the asdcontrol sudoers grant is absent
              id: a-asdcontrol
              context: [runtime]
              file:
                  file: /etc/sudoers.d/omarchy-asdcontrol
                  exists: false
            - check: the fido2 opt-in is absent
              id: a-fido2
              context: [runtime]
              command: '! pacman -Q fido2-* >/dev/null 2>&1'
            - check: the sshd hardening flow completes (the golden's passwordless sudo)
              id: a-sshd-setup
              context: [runtime]
              command: 'ssh-keygen -t ed25519 -N "" -q -f /tmp/omarchy-sshd-key && omarchy-setup-security-sshd --key="$(cat /tmp/omarchy-sshd-key.pub)"'
            - check: sshd is active after the setup
              id: a-sshd-active
              context: [runtime]
              service:
                  service: sshd
                  running: true
            - check: password authentication is off
              id: a-sshd-password
              context: [runtime]
              command: 'sudo -n sshd -T | grep -qixF "passwordauthentication no"'
            - check: the key is authorized
              id: a-sshd-key
              context: [runtime]
              command: 'grep -Fq "$(cat /tmp/omarchy-sshd-key.pub)" "$HOME/.ssh/authorized_keys"'
            - check: the dns sudoers grant is absent
              id: a-dns-sudoers
              context: [runtime]
              file:
                  file: /etc/sudoers.d/omarchy-dns
                  exists: false

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

