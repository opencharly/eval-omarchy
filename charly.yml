        disposable: true
        lifecycle: dev
        update_gate: restart-only
        add_candy:
            - omarchy-accept-plugins
            - omarchy-corpus
        plan:
            # R0 — the recordings START here (the shared wrapper, ${INSTANCE}-keyed)
            - include: candy:omarchy-accept-rec-start
            # A — the app launch round-trips
            - check: the default browser is chromium
              id: a-default-browser
              context: [runtime]
              omarchy: {method: default-browser}
              stdout:
                  - contains: chromium
            - check: the default terminal is foot
              id: a-default-terminal
              context: [runtime]
              omarchy: {method: default-terminal}
              stdout:
                  - contains: foot
            - check: the default editor is nvim
              id: a-default-editor
              context: [runtime]
              omarchy: {method: default-editor}
              stdout:
                  - contains: nvim
            - check: the HTTP MIME handler is chromium
              id: a-mime-http
              context: [runtime]
              command: 'xdg-mime query default x-scheme-handler/http'
              stdout:
                  - contains: chromium.desktop
            - check: the directory MIME handler is nautilus
              id: a-mime-dir
              context: [runtime]
              command: 'xdg-mime query default inode/directory'
              stdout:
                  - contains: org.gnome.Nautilus.desktop
            - check: foot launches a window
              id: a-foot-launch
              context: [runtime]
              wl: {method: exec, command: foot}
            - check: the foot window appears
              id: a-foot-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: foot
              eventually: 45s
              retry_interval: 5s
            # G-4: the foot surface while its window is up (right after the
            # window-appears gate).
            - check: capture the foot surface
              id: a-foot-shot
              context: [runtime]
              wl: {method: screenshot, artifact: 'media/${CALVER}/${BED}/${BED}-foot.png', artifact_min_bytes: 1024, artifact_not_uniform: true}
            - check: the foot window closes
              id: a-foot-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.class == "foot") | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -q '"class": "foot"'
            - check: chromium launches a window
              id: a-chromium-launch
              context: [runtime]
              wl: {method: exec, command: 'chromium --new-window'}
            - check: the chromium window appears
              id: a-chromium-window
              context: [runtime]
              wl: {method: windows}
              stdout:
                  - contains: Chromium
              eventually: 60s
              retry_interval: 5s
            # G-4: the chromium surface while its window is up (right after the
            # window-appears gate).
            - check: capture the chromium surface
              id: a-chromium-shot
              context: [runtime]
              wl: {method: screenshot, artifact: 'media/${CALVER}/${BED}/${BED}-chromium.png', artifact_min_bytes: 1024, artifact_not_uniform: true}
            - check: the chromium window closes
              id: a-chromium-close
              context: [runtime]
              command: |
                  export HYPRLAND_INSTANCE_SIGNATURE=$(ls /run/user/1000/hypr/ 2>/dev/null | head -1)
                  ADDR=$(hyprctl -j clients 2>/dev/null | jq -r '.[] | select(.title | test("Chromium")) | .address' | head -1)
                  [ -n "$ADDR" ] && hyprctl dispatch "hl.dsp.window.close({ window = \"address:$ADDR\" })" >/dev/null
                  sleep 1
                  ! hyprctl -j clients 2>/dev/null | grep -qi chromium

            # R1 — the recordings STOP here (the shared wrapper)
            - include: candy:omarchy-accept-rec-stop

# system — the acceptance bed (the shared recording WRAPPER via include:)
check-omarchy-accept-system:
