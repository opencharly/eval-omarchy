use the live check failed before the system reached a passing state — so I have no observed visual outcome for the Service.qml remainingLifetime/showCountdown wiring or the NotificationCard countdownTrack, only the failing check. The four triage assertions (service-exposes-countdown, card-reserves-countdown-height, card-renders-countdown-track, test-covers-countdown) are all known-red and the eval bed's check-live step is what failed against them; the control bed passing the same step on the golden confirms the assertions are real. Bottom line: the PR as applied does not make the notifications live check pass on this machine, so I can't call it working."}
