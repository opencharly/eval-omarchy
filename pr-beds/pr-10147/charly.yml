version: 2026.249.2125
check-omarchy-pr-10147-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
      # the updated pr-apply (the test-context closure) overwrites the
      # golden's baked script at deploy time — no golden re-provision.
      - omarchy-pr-apply
      # upstream's own contract surfaces run per PR (the whole corpus is
      # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
      # drives the report emphasis, the corpus facts land in the ledger)
      - omarchy-corpus
    plan:
      - check: apply PR 10147 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10147 99f9df932cca937404feeadc2144c0ea53c4076f default/omarchy/omarchy-menu.jsonc test/shell.d/menu-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/menu-test.sh; do bash "$t" || exit 1; done'
      - check: 'the install menu JSONC carries the new install.ai.vibecad-preview row'
        id: behavior-1
        context: [runtime]
        command: 'grep -q ''"install.ai.vibecad-preview"'' /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc'
      - check: 'the row''s action installs vibecad-preview-bin from the Omarchy package repository and launches vibecad'
        id: behavior-2
        context: [runtime]
        command: 'grep -qF "omarchy-install-and-launch ''VibeCAD Preview'' vibecad-preview-bin vibecad" /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc'
      - check: 'the row dims itself once vibecad-preview-bin is present (omarchy-pkg-present guard)'
        id: behavior-3
        context: [runtime]
        command: 'grep -qF ''"disabled":"omarchy-pkg-present vibecad-preview-bin"'' /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc'
      - check: 'the row is labeled VibeCAD Preview and no stable install.ai.vibecad row is offered before upstream publishes one'
        id: behavior-4
        context: [runtime]
        command: 'grep -qF ''"label":"VibeCAD Preview"'' /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc && ! grep -q ''"install.ai.vibecad":'' /usr/share/omarchy/default/omarchy/omarchy-menu.jsonc'
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10147}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10147, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10147
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            cd /usr/share/omarchy && bash test/shell.d/menu-test.sh; grep -n 'vibecad' default/omarchy/omarchy-menu.jsonc
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10147.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10147, artifact: /tmp/pr-10147.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10147, artifact: /tmp/pr-10147.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10147, artifact: /tmp/pr-10147.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10147.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10147.mp4'