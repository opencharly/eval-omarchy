version: 2026.249.2125
check-omarchy-pr-10130-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10130 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10130 21992f03f72c2b15bdeb135e9ae8e8bb21274e95 shell/plugins/lock/Service.qml test/shell.d/fixtures/lock-activity-reblank/shell.qml test/shell.d/lock-activity-reblank-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/lock-activity-reblank-test.sh; do bash "$t" || exit 1; done'
      - agent-check: >-
          activity monitor is enabled while locked, ignores inhibitors, and re-arms the blank on every resume - verify with: grep -q 'respectInhibitors: false' /usr/share/omarchy/shell/plugins/lock/Service.qml && grep -q 'onIsIdleChanged: if (!isIdle) root.handleActivityResumed()' /usr/share/omarchy/shell/plugins/lock/Service.qml
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          handleActivityResumed() exists and re-arms the blank timer while locked - verify with: grep -q 'function handleActivityResumed' /usr/share/omarchy/shell/plugins/lock/Service.qml
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          blankArmed status property is exposed on the lock service - verify with: grep -q 'readonly property bool blankArmed' /usr/share/omarchy/shell/plugins/lock/Service.qml
        id: behavior-3
        context: [runtime]
      - agent-check: >-
          blank process logs blank-started when it spawns - verify with: grep -q 'onStarted: root.logEvent("blank-started")' /usr/share/omarchy/shell/plugins/lock/Service.qml
        id: behavior-4
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10130}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10130, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10130
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/test/shell.d/lock-activity-reblank-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10130.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10130, artifact: /tmp/pr-10130.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10130, artifact: /tmp/pr-10130.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10130, artifact: /tmp/pr-10130.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10130.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10130.mp4'