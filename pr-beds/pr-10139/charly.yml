version: 2026.249.2125
check-omarchy-pr-10139-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10139 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10139 38c07810ee3d06e22eaa069c630d7a33fbbf3475 bin/omarchy-cmd-apple-sd-reader bin/omarchy-hw-apple-sd-reader install/hardware/all.sh install/hardware/apple/fix-sd-card-reader.sh manual/44-mac-support.md migrations/1788508170.sh test/shell.d/apple-sd-reader-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/apple-sd-reader-test.sh; do bash "$t" || exit 1; done'
      - agent-check: >-
          hardware detector matches MacBookPro12,1 - verify with: printf 'MacBookPro12,1\n' >/tmp/omarchy-dmi && OMARCHY_DMI_PRODUCT_NAME=/tmp/omarchy-dmi /usr/share/omarchy/bin/omarchy-hw-apple-sd-reader
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          hardware detector skips MacBookPro14,1 - verify with: printf 'MacBookPro14,1\n' >/tmp/omarchy-dmi2 && ! OMARCHY_DMI_PRODUCT_NAME=/tmp/omarchy-dmi2 /usr/share/omarchy/bin/omarchy-hw-apple-sd-reader
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          all.sh runs the SD reader fix during hardware setup - verify with: grep -q 'apple/fix-sd-card-reader.sh' /usr/share/omarchy/install/hardware/all.sh
        id: behavior-3
        context: [runtime]
      - agent-check: >-
          install leaf puts the Apple reader quirk on the kernel command line - verify with: grep -q 'usbcore.quirks=05ac:8406:bk' /usr/share/omarchy/install/hardware/apple/fix-sd-card-reader.sh
        id: behavior-4
        context: [runtime]
      - agent-check: >-
          helper calls Apple XHCI SPWR ACPI method - verify with: grep -q 'SPWR' /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader
        id: behavior-5
        context: [runtime]
      - agent-check: >-
          migration sources the SD reader fix on existing installs - verify with: grep -q 'fix-sd-card-reader.sh' /usr/share/omarchy/migrations/1788508170.sh
        id: behavior-6
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10139}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10139, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10139
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/test/shell.d/apple-sd-reader-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10139.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10139, artifact: /tmp/pr-10139.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10139, artifact: /tmp/pr-10139.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10139, artifact: /tmp/pr-10139.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10139.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10139.mp4'