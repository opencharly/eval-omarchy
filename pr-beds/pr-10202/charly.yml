version: 2026.249.2125
check-omarchy-pr-10202-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
      # the updated pr-apply (the test-context closure) overwrites the
      # golden's baked script at deploy time — no golden re-provision.
      - omarchy-pr-apply
      # upstream's own contract surfaces run per PR (the whole corpus is
      # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
      # drives the report emphasis, the corpus facts land in the ledger)
      - omarchy-corpus
    plan:
      - check: apply PR 10202 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10202 ecb69659d9d66cb56ec2b8a5a1f9bf846e8ebe2d install/config/locate.sh migrations/1784809451.sh test/shell.d/locate-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/locate-test.sh; do bash "$t" || exit 1; done'
      - check: 'install/config/locate.sh pins the privileged config target to /etc/updatedb.conf'
        id: behavior-1
        context: [runtime]
        command: 'grep -qxF ''UPDATEDB_CONF_PATH=/etc/updatedb.conf'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'the environment-controlled OMARCHY_UPDATEDB_CONF_PATH is gone from the locate config script'
        id: behavior-2
        context: [runtime]
        command: '! grep -qF ''OMARCHY_UPDATEDB_CONF_PATH'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'PRUNEPATHS is rewritten by the fixed awk program fed through the environment, not interpolated into a sed program'
        id: behavior-3
        context: [runtime]
        command: 'grep -qF ''rewrite_updatedb_prunepaths() ('' /usr/share/omarchy/install/config/locate.sh && grep -qF ''UPDATEDB_PRUNEPATHS="$replacement" awk'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'the PRUNEPATHS branch calls the new rewrite helper instead of sed -i'
        id: behavior-4
        context: [runtime]
        command: 'grep -qF ''rewrite_updatedb_prunepaths "/.snapshots${pruned:+ $pruned}"'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'the old sed -i PRUNEPATHS rewrite that compiled config data into a sed program is gone'
        id: behavior-5
        context: [runtime]
        command: '! grep -qF ''sed -i -E "s|^[[:space:]]*PRUNEPATHS'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'the rewrite preserves ownership/mode and publishes atomically via mv -fT'
        id: behavior-6
        context: [runtime]
        command: 'grep -qF ''cp --attributes-only --preserve=all -- "$UPDATEDB_CONF_PATH" "$rewritten_conf"'' /usr/share/omarchy/install/config/locate.sh && grep -qF ''mv -fT -- "$rewritten_conf" "$UPDATEDB_CONF_PATH"'' /usr/share/omarchy/install/config/locate.sh'
      - check: 'migrations/1784809451.sh pins the config path and no longer forwards an env-selected path through sudo'
        id: behavior-7
        context: [runtime]
        command: 'grep -qxF ''UPDATEDB_CONF_PATH=/etc/updatedb.conf'' /usr/share/omarchy/migrations/1784809451.sh && ! grep -qF ''OMARCHY_UPDATEDB_CONF_PATH'' /usr/share/omarchy/migrations/1784809451.sh && grep -qF ''as_root bash -euo pipefail "$locate_config_script"'' /usr/share/omarchy/migrations/1784809451.sh'
      - check: 'a sed-like PRUNEPATHS value is preserved verbatim as data and never executed by the rewrite'
        id: behavior-8
        context: [runtime]
        command: 'tmp=$(mktemp -d); grep -qxF ''UPDATEDB_CONF_PATH=/etc/updatedb.conf'' /usr/share/omarchy/install/config/locate.sh || exit 1; payload=''\x22;id > ''"$tmp"''/pwned;:|ew ''; printf ''PRUNEPATHS = "%s"\n'' "$payload" > "$tmp/updatedb.conf"; sed "s|^UPDATEDB_CONF_PATH=/etc/updatedb.conf$|UPDATEDB_CONF_PATH=$tmp/updatedb.conf|" /usr/share/omarchy/install/config/locate.sh | bash -euo pipefail; test ! -e "$tmp/pwned" && grep -qF ''PRUNEPATHS = "/.snapshots'' "$tmp/updatedb.conf"'
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10202}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10202, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10202
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            tmp=$(mktemp -d); payload='\x22;id > '"$tmp"'/pwned;:|ew '; printf 'PRUNEPATHS = "%s"\n' "$payload" > "$tmp/updatedb.conf"; sed "s|^UPDATEDB_CONF_PATH=/etc/updatedb.conf$|UPDATEDB_CONF_PATH=$tmp/updatedb.conf|" /usr/share/omarchy/install/config/locate.sh | bash -euo pipefail; echo '--- rewritten conf ---'; cat "$tmp/updatedb.conf"; echo '--- proof file (must not exist) ---'; ls -l "$tmp/pwned" 2>&1 || true
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10202.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10202, artifact: /tmp/pr-10202.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10202, artifact: /tmp/pr-10202.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10202, artifact: /tmp/pr-10202.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10202.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10202.mp4'