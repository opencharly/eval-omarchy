version: 2026.249.2125
check-omarchy-pr-10139-control:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    plan:
      # the NEGATIVE CONTROL: the negated checks on the PRISTINE golden.
      # Every negated step must PASS (every original check failed without
      # the PR = every knownRed claim holds). A control step failing means
      # the original check passed without the PR — a FAKE assertion,
      # caught at render, never shipped to a real eval.
      - check: 'the new omarchy cmd helper is installed and carries the Apple XHCI SPWR/SRST ACPI recovery path'
        id: behavior-1
        context: [runtime]
        command: '! ( test -f /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader && grep -q ''\\_SB.PCI0.XHC1.SPWR'' /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader && grep -q ''\\_SB.PCI0.XHC1.SRST'' /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader && grep -q ''05ac'' /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader )'
      - check: 'the helper''s status subcommand reports reader/acpi_call state and an unknown subcommand prints the usage line'
        id: behavior-2
        context: [runtime]
        command: '! ( out=$(bash /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader status 2>&1 || true); printf ''%s\n'' "$out" | grep -q ''acpi_call''; u=$(bash /usr/share/omarchy/bin/omarchy-cmd-apple-sd-reader bogus 2>&1 || true); printf ''%s\n'' "$u" | grep -q ''usage: omarchy cmd apple-sd-reader'' )'
      - check: 'the DMI detector accepts MacBookPro12,1 and rejects a Mac without the Apple USB reader'
        id: behavior-3
        context: [runtime]
        command: '! ( d=$(mktemp); printf ''MacBookPro12,1\n'' >"$d"; OMARCHY_DMI_PRODUCT_NAME="$d" bash /usr/share/omarchy/bin/omarchy-hw-apple-sd-reader && printf ''MacBookPro14,1\n'' >"$d" && ! OMARCHY_DMI_PRODUCT_NAME="$d" bash /usr/share/omarchy/bin/omarchy-hw-apple-sd-reader; rc=$?; rm -f "$d"; exit $rc )'
      - check: 'the install leaf, on matching DMI, writes the Limine usbcore quirk drop-in, the udev keep-alive rule and the post-resume sleep hook'
        id: behavior-4
        context: [runtime]
        command: '! ( t=$(mktemp -d); mkdir -p "$t/bin" "$t/out"; printf ''#!/bin/bash\nexit 0\n'' >"$t/bin/omarchy-hw-apple-sd-reader"; printf ''#!/bin/bash\nexit 0\n'' >"$t/bin/omarchy-pkg-add"; printf ''#!/bin/bash\n[[ $1 == limine-mkinitcpio ]]\n'' >"$t/bin/omarchy-cmd-present"; printf ''#!/bin/bash\nexit 0\n'' >"$t/bin/omarchy-state"; printf ''#!/bin/bash\n"$@"\n'' >"$t/bin/sudo"; printf ''#!/bin/bash\nexit 0\n'' >"$t/bin/limine-mkinitcpio"; chmod +x "$t"/bin/*; printf ''MacBookPro12,1\n'' >"$t/dmi"; PATH="$t/bin:$PATH" OMARCHY_DMI_PRODUCT_NAME="$t/dmi" OMARCHY_PATH=/usr/share/omarchy OMARCHY_APPLE_SD_LIMINE_CONF="$t/out/limine.conf" OMARCHY_APPLE_SD_UDEV_RULES="$t/out/udev.rules" OMARCHY_APPLE_SD_SLEEP_HOOK="$t/out/sleep-hook" bash -euo pipefail -c ''source "$1"'' _ /usr/share/omarchy/install/hardware/apple/fix-sd-card-reader.sh && grep -q ''usbcore.quirks=05ac:8406:bk'' "$t/out/limine.conf" && grep -q ''idProduct}="8406"'' "$t/out/udev.rules" && grep -q ''omarchy-cmd-apple-sd-reader'' "$t/out/sleep-hook" )'
      - check: 'hardware setup invokes the Apple SD reader leaf'
        id: behavior-5
        context: [runtime]
        command: '! ( grep -q ''apple/fix-sd-card-reader.sh'' /usr/share/omarchy/install/hardware/all.sh )'
      - check: 'the new migration re-applies the leaf on existing Macs'
        id: behavior-6
        context: [runtime]
        command: '! ( test -f /usr/share/omarchy/migrations/1788508170.sh && grep -q ''omarchy-hw-apple-sd-reader'' /usr/share/omarchy/migrations/1788508170.sh && grep -q ''fix-sd-card-reader.sh'' /usr/share/omarchy/migrations/1788508170.sh )'
      - check: 'the Mac support manual documents the SD reader keep-alive and the manual reset command'
        id: behavior-7
        context: [runtime]
        command: '! ( grep -q ''05ac:8406'' /usr/share/omarchy/manual/44-mac-support.md && grep -q ''omarchy cmd apple-sd-reader reset'' /usr/share/omarchy/manual/44-mac-support.md )'