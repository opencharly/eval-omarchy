version: 2026.249.2125
check-omarchy-pr-10144-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10144 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10144 ca17c1854aca4c0ed4d1bcd7818e4132c172ad05 bin/omarchy-remove-launcher-entry bin/omarchy-rename-launcher-entry docs/menu.md shell/plugins/menu/Menu.qml shell/services/AppLibrary.qml test/shell.d/launcher-remove-test.sh test/shell.d/launcher-rename-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/launcher-rename-test.sh /usr/share/omarchy/test/shell.d/launcher-remove-test.sh; do bash "$t" || exit 1; done'
      - agent-check: >-
          omarchy-rename-launcher-entry exists and is executable at the system bin path - verify with: test -x /usr/share/omarchy/bin/omarchy-rename-launcher-entry
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          rename writes a per-user desktop override carrying the X-Omarchy-Renamed marker and the new Name - verify with: d=$(mktemp -d); mkdir -p "$d/data/applications" "$d/system/applications"; printf '[Desktop Entry]\nName=Editor\nExec=editor\n' > "$d/system/applications/org.example.Editor.desktop"; XDG_DATA_HOME="$d/data" XDG_DATA_DIRS="$d/system" bash /usr/share/omarchy/bin/omarchy-rename-launcher-entry org.example.Editor 'New Name'; grep -Fx 'Name=New Name' "$d/data/applications/org.example.Editor.desktop" && grep -Fx 'X-Omarchy-Renamed=true' "$d/data/applications/org.example.Editor.desktop"; rc=$?; rm -rf "$d"; exit $rc
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          Menu.qml binds Ctrl+R to the rename flow for the selected application row - verify with: grep -q 'event.key === Qt.Key_R' /usr/share/omarchy/shell/plugins/menu/Menu.qml && grep -q 'root.requestRenameSelected()' /usr/share/omarchy/shell/plugins/menu/Menu.qml
        id: behavior-3
        context: [runtime]
      - agent-check: >-
          AppLibrary.qml exposes the rename helper invocation - verify with: grep -q 'omarchy-rename-launcher-entry' /usr/share/omarchy/shell/services/AppLibrary.qml
        id: behavior-4
        context: [runtime]
      - agent-check: >-
          remove-launcher-entry cleans up managed rename overrides during uninstall - verify with: grep -q 'X-Omarchy-Renamed' /usr/share/omarchy/bin/omarchy-remove-launcher-entry && grep -q 'update-desktop-database' /usr/share/omarchy/bin/omarchy-remove-launcher-entry
        id: behavior-5
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10144}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10144, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10144
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/test/shell.d/launcher-rename-test.sh && bash /usr/share/omarchy/test/shell.d/launcher-remove-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10144.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10144, artifact: /tmp/pr-10144.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10144, artifact: /tmp/pr-10144.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10144, artifact: /tmp/pr-10144.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10144.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10144.mp4'