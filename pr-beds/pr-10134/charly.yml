version: 2026.249.2125
check-omarchy-pr-10134-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10134 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10134 977e0fcdc2ca46b2fbf7dbeab6bd5b29b49b1398 bin/omarchy-theme-set-vscode'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in ; do bash "$t" || exit 1; done'
      - agent-check: >-
          extension version is derived from the theme file cksum so palette changes invalidate the editor cache - verify with: grep -q 'GENERATED_EXTENSION_VERSION="1.0.$(cksum' /usr/share/omarchy/bin/omarchy-theme-set-vscode
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          theme contribution declares _watch:true so VS Code attaches a file watcher for live reload - verify with: grep -q '"_watch": true' /usr/share/omarchy/bin/omarchy-theme-set-vscode
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          theme is written as a real file (cat) instead of a symlink so the watcher gets a same-inode rewrite - verify with: grep -q 'cat "$GENERATED_THEME" >"$ext_dir/themes/omarchy-color-theme.json"' /usr/share/omarchy/bin/omarchy-theme-set-vscode
        id: behavior-3
        context: [runtime]
      - agent-check: >-
          pre-existing symlink from older versions is removed before the first real-file copy - verify with: grep -q 'rm -f "$ext_dir/themes/omarchy-color-theme.json"' /usr/share/omarchy/bin/omarchy-theme-set-vscode
        id: behavior-4
        context: [runtime]
      - agent-check: >-
          derived version is valid semver (1.0.<digits>) as produced by the cksum pipeline - verify with: v="1.0.$(cksum /etc/hostname | cut -d' ' -f1)"; case "$v" in 1.0.[0-9]*) exit 0;; *) exit 1;; esac
        id: behavior-5
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10134}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10134, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10134
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash -n /usr/share/omarchy/bin/omarchy-theme-set-vscode && grep -q '"_watch": true' /usr/share/omarchy/bin/omarchy-theme-set-vscode
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10134.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10134, artifact: /tmp/pr-10134.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10134, artifact: /tmp/pr-10134.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10134, artifact: /tmp/pr-10134.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10134.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10134.mp4'