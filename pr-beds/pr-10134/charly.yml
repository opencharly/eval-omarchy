version: 2026.249.2125
check-omarchy-pr-10134-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
      # the updated pr-apply (the test-context closure) overwrites the
      # golden's baked script at deploy time — no golden re-provision.
      - omarchy-pr-apply
      # upstream's own contract surfaces run per PR (the whole corpus is
      # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
      # drives the report emphasis, the corpus facts land in the ledger)
      - omarchy-corpus
    plan:
      - check: apply PR 10134 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10134 977e0fcdc2ca46b2fbf7dbeab6bd5b29b49b1398 bin/omarchy-theme-set-vscode'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in ; do bash "$t" || exit 1; done'
      - check: 'The generated Omarchy color theme inside the VS Code-family extension dir is a real file, not a symlink into current/theme'
        id: behavior-1
        context: [runtime]
        command: 'bash /usr/share/omarchy/bin/omarchy-theme-set-vscode >/dev/null 2>&1; f=$(find "$HOME" -maxdepth 6 -path ''*extensions*'' -name omarchy-color-theme.json 2>/dev/null | head -1); [ -n "$f" ] && [ -f "$f" ] && [ ! -L "$f" ]'
      - check: 'The generated extension manifest declares "_watch": true on the Omarchy theme contribution so VS Code attaches its ThemeFileWatcher'
        id: behavior-2
        context: [runtime]
        command: 'p=$(find "$HOME" -maxdepth 6 -path ''*extensions*omarchy*'' -name package.json 2>/dev/null | head -1); [ -n "$p" ] && grep -q ''"_watch": true'' "$p"'
      - check: 'The generated extension version is derived from the theme content (1.0.<cksum of the theme file>) so a palette change invalidates the editor''s cached registry entry'
        id: behavior-3
        context: [runtime]
        command: 'p=$(find "$HOME" -maxdepth 6 -path ''*extensions*omarchy*'' -name package.json 2>/dev/null | head -1); f=$(find "$HOME" -maxdepth 6 -path ''*extensions*'' -name omarchy-color-theme.json 2>/dev/null | head -1); [ -n "$p" ] && [ -n "$f" ] && [ "$(grep -o ''"version": *"[^"]*"'' "$p" | head -1 | cut -d''"'' -f4)" = "1.0.$(cksum "$f" | cut -d'' '' -f1)" ]'
      - check: 'The script no longer symlinks the theme into the extension dir (the removed ln -sfn line)'
        id: behavior-4
        context: [runtime]
        command: '! grep -q ''ln -sfn "$GENERATED_THEME" "$ext_dir/themes/omarchy-color-theme.json"'' /usr/share/omarchy/bin/omarchy-theme-set-vscode'
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10134}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10134, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10134
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/bin/omarchy-theme-set-vscode; p=$(find "$HOME" -maxdepth 6 -path '*extensions*omarchy*' -name package.json 2>/dev/null | head -1); echo "manifest=$p"; grep -E '"version"|_watch' "$p"; f=$(find "$HOME" -maxdepth 6 -path '*extensions*' -name omarchy-color-theme.json 2>/dev/null | head -1); echo "theme=$f"; ls -l "$f"; cksum "$f"
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10134.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10134, artifact: /tmp/pr-10134.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10134, artifact: /tmp/pr-10134.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10134, artifact: /tmp/pr-10134.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10134.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10134.mp4'