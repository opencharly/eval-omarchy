version: 2026.249.2125
check-omarchy-pr-10138-vm:
  vm:
    from: check-omarchy-eval-dev-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
      # the updated pr-apply (the test-context closure) overwrites the
      # golden's baked script at deploy time — no golden re-provision.
      - omarchy-pr-apply
      # upstream's own contract surfaces run per PR (the whole corpus is
      # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
      # drives the report emphasis, the corpus facts land in the ledger)
      - omarchy-corpus
    plan:
      - check: apply PR 10138 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10138 87f2bf1e72e60de3a49531f0e65aeb7c5d4f5f02 docs/omarchy-shell.md shell/Commons/Wallclock.qml shell/Commons/WallclockMath.js shell/Commons/qmldir shell/plugins/panels/clock/BarWidget.qml shell/plugins/panels/clock/Panel.qml test/shell.d/clock-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/clock-test.sh; do bash "$t" || exit 1; done'
      - check: 'the new qs.Commons Wallclock singleton is installed and reports a step through the tested predicate, with resync toggling SystemClock.enabled'
        id: behavior-1
        context: [runtime]
        command: 'test -f /usr/share/omarchy/shell/Commons/Wallclock.qml && grep -q ''isDiscontinuity(elapsed, root.interval, root.threshold)'' /usr/share/omarchy/shell/Commons/Wallclock.qml && grep -q ''clock.enabled = false'' /usr/share/omarchy/shell/Commons/Wallclock.qml && grep -q ''clock.enabled = true'' /usr/share/omarchy/shell/Commons/Wallclock.qml'
      - check: 'WallclockMath.isDiscontinuity flags a real step (forward, eight-hour suspend, backwards) and ignores an on-time or merely-late tick'
        id: behavior-2
        context: [runtime]
        command: 'node -e "const m=require(''/usr/share/omarchy/shell/Commons/WallclockMath.js''); process.exit(m.isDiscontinuity(4000,1000,3000) && m.isDiscontinuity(8*60*60*1000,1000,3000) && m.isDiscontinuity(-5000,1000,3000) && !m.isDiscontinuity(1000,1000,3000) && !m.isDiscontinuity(1400,1000,3000) && !m.isDiscontinuity(3999,1000,3000) ? 0 : 1)"'
      - check: 'Wallclock is registered as a Commons singleton so the clock widget and panel can import it'
        id: behavior-3
        context: [runtime]
        command: 'grep -q ''^singleton Wallclock 1.0 Wallclock.qml'' /usr/share/omarchy/shell/Commons/qmldir'
      - check: 'the bar clock widget wires Wallclock.onJumped to Wallclock.resync(clock)'
        id: behavior-4
        context: [runtime]
        command: 'grep -Pzoq ''target: Wallclock\s*\n\s*function onJumped\(\) \{ Wallclock\.resync\(clock\) \}'' /usr/share/omarchy/shell/plugins/panels/clock/BarWidget.qml'
      - check: 'the calendar panel resyncs on a wall-clock step and does not call refresh() (which would drag an open calendar back to today)'
        id: behavior-5
        context: [runtime]
        command: 'grep -Pzoq ''target: Wallclock\s*\n\s*function onJumped\(\) \{ Wallclock\.resync\(clock\) \}'' /usr/share/omarchy/shell/plugins/panels/clock/Panel.qml && ! grep -Pzoq ''function onJumped\(\) \{[^}]*refresh\(\)'' /usr/share/omarchy/shell/plugins/panels/clock/Panel.qml'
      - check: 'docs/omarchy-shell.md documents the Wallclock jump signal and Wallclock.resync(clock) for third-party clock plugins'
        id: behavior-6
        context: [runtime]
        command: 'grep -q ''Wallclock.resync(clock)'' /usr/share/omarchy/docs/omarchy-shell.md && grep -q ''onJumped'' /usr/share/omarchy/docs/omarchy-shell.md'
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10138}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10138, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10138
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            cd /usr/share/omarchy && bash test/shell.d/clock-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10138.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10138, artifact: /tmp/pr-10138.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10138, artifact: /tmp/pr-10138.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10138, artifact: /tmp/pr-10138.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10138.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10138.mp4'