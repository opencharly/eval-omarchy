omarchy-vm-clone-10138:
    vm:
        source:
            kind: clone
            from_vm: check-omarchy-eval-base
            from_snapshot: golden
        disk_size: 40G
        ram: 4G
        cpu: 4
        machine: q35
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: user, port_auto: true, key_source: generate}
        backend: libvirt
        libvirt:
            devices:
                channels: [{type: spicevmc, name: com.redhat.spice.0}]
                graphics: [{type: spice, listen: [{type: socket}]}]
                video: [{model: virtio, vram: 65536, heads: 1, accel3d: false}]
                rng: [{model: virtio, backend: /dev/urandom}]
                memballoon: {model: virtio}
            snippets:
                - "<channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>"
# GENERATED by scripts/scaffold-pr-eval.py from pr-plans/eval-plan-10138.json — DO NOT hand-edit (S8).
# The ONE apply seam: pr-apply <pr> <sha> <files...> (candy/omarchy-pr-apply).
# Linked-disk model (§6): immutable golden + fresh COW overlay per run; NO snapshot on the eval bed.
check-omarchy-pr-10138-vm:
    vm:
        from: omarchy-vm-clone-10138
        disposable: true
        lifecycle: dev
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
            - omarchy-autologin
            - omarchy-eval-record
            - omarchy-pr-apply
            - '@github.com/opencharly/layer-asciinema:v2026.246.1622'
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            with_service: true
            skip_incompatible: true
        plan:
            - check: apply PR #10138 via the single apply seam
              id: pr-apply
              context: [runtime]
              command: 'pr-apply 10138 87f2bf1e72e60de3a49531f0e65aeb7c5d4f5f02 docs/omarchy-shell.md shell/Commons/Wallclock.qml shell/Commons/WallclockMath.js shell/Commons/qmldir shell/plugins/panels/clock/BarWidget.qml shell/plugins/panels/clock/Panel.qml test/shell.d/clock-test.sh'
            - check: the PR's Wallclock.qml is installed over the tree
              id: pr-applied
              context: [runtime]
              file:
                  file: /usr/share/omarchy/shell/Commons/Wallclock.qml
                  exists: true
            - check: the Wallclock singleton is declared in qmldir
              id: pr-wired-qmldir
              context: [runtime]
              command: "grep -q Wallclock /usr/share/omarchy/shell/Commons/qmldir"
            - check: the bar clock resyncs via the Wallclock singleton
              id: pr-wired-bar
              context: [runtime]
              command: "grep -q Wallclock /usr/share/omarchy/shell/plugins/panels/clock/BarWidget.qml"
            - check: the calendar panel resyncs (not refreshes) via Wallclock
              id: pr-wired-panel
              context: [runtime]
              command: "grep -q Wallclock /usr/share/omarchy/shell/plugins/panels/clock/Panel.qml"

            - check: start a terminal recording
              id: rec-start
              context: [runtime]
              record: {method: start, record_mode: terminal, record_name: pr-10138}
            - check: drive the PR's key command inside the recording
              id: rec-drive
              context: [runtime]
              record: {method: run, record_name: pr-10138, text: 'grep -n wallclock /usr/share/omarchy/shell/plugins/panels/clock/BarWidget.qml; echo clock-check-done', settle_ms: 1000}
            - check: capture the VM display via SPICE
              id: rec-screen-spice
              context: [runtime]
              spice: {method: screenshot, artifact: /tmp/pr-10138-screen.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
            - check: stop the recording and pull the .cast
              id: rec-stop
              context: [runtime]
              record: {method: stop, record_name: pr-10138, artifact: /tmp/pr-10138.cast, artifact_min_bytes: 200}
            - check: render the .cast to an animated GIF
              id: rec-gif
              context: [runtime]
              record: {method: gif, record_name: pr-10138, artifact: /tmp/pr-10138.gif, artifact_min_bytes: 100}
        description: >-
            Tier-2 linked-disk PR eval for omacom/omarchy#10138 (Resync the clock when the wall clock is stepped) — immutable-golden
            clone + the single apply seam + behavior checks + the record:gif/spice evidence
            loop. RED-PROBE twin: check-omarchy-pr-10138-vm-probe (no apply; must FAIL).
            Generated; run with the fresh per-worktree binary.
