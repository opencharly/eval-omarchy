            - run: transcode the SPICE MJPEG capture to MP4 (screen.mp4)
              id: rec-mp4
              context: [runtime]
              command: 'if [ -s /tmp/pr-10225.mjpeg ]; then ffmpeg -y -loglevel error -i /tmp/pr-10225.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10225-screen.mp4 && echo "pr-10225-screen.mp4 transcoded in venue"; else echo "pr-10225: MJPEG is host-side (SPICE capture) — the host runner performs the container transcode into media/ (lane runner assembly)" >&2; fi'


