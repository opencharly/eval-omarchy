              id: rec-spice-stop
              context: [runtime]
              spice: {method: record, action: stop, record_name: pr-10225, artifact: /tmp/pr-10225.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
            - check: stop the terminal recording and pull the .cast
