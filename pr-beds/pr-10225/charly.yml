        from: omarchy-vm-clone-10225
        disposable: true
        lifecycle: dev
        add_candy:
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
            - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
        plan:
            - check: apply PR #10225 via the single apply seam
              id: pr-apply
              context: [runtime]
              command: 'pr-apply 10225 70047956fac8bdfe36aabb9dea82b4eee50e1b2c bin/omarchy-apply-lock bin/omarchy-upgrade-to-quattro test/shell.d/apply-lock-test.sh test/shell.d/upgrade-to-quattro-test.sh'
            - check: the lock helper pins fprintd-list to the trusted absolute path /usr/bin/fprintd-list
              id: pr-behavior
              context: [runtime]
              command: 'grep -qiF /usr/bin/fprintd-list /usr/share/omarchy/bin/omarchy-apply-lock'
