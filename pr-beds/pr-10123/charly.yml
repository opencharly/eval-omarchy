version: 2026.249.2125
check-omarchy-pr-10123-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
      # the updated pr-apply (the test-context closure) overwrites the
      # golden's baked script at deploy time — no golden re-provision.
      - omarchy-pr-apply
      # upstream's own contract surfaces run per PR (the whole corpus is
      # 25 cheap file-presence/CLI assertions (the selection vocabulary in the skill); the oracle's selection
      # drives the report emphasis, the corpus facts land in the ledger)
      - omarchy-corpus
    plan:
      - check: apply PR 10123 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10123 51c4cf8148922ccb6f213f6f399856ace93bff32 manual/42-common-tweaks.md'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in ; do bash "$t" || exit 1; done'
      - check: 'the installed manual carries the new ''Tile the Steam window'' section the PR adds'
        id: behavior-1
        context: [runtime]
        command: 'grep -q ''^### Tile the Steam window$'' /usr/share/omarchy/manual/42-common-tweaks.md'
      - check: 'the documented override is the exact o.window rule the PR adds (class steam + title Steam, tile = true)'
        id: behavior-2
        context: [runtime]
        command: 'grep -qF ''o.window({ class = "steam", title = "Steam" }, { tile = true })'' /usr/share/omarchy/manual/42-common-tweaks.md'
      - check: 'the doc tells the user to append the rule to ~/.config/hypr/hyprland.lua (the file the drive then loads)'
        id: behavior-3
        context: [runtime]
        command: 'grep -q ''~/.config/hypr/hyprland.lua'' /usr/share/omarchy/manual/42-common-tweaks.md'
      - check: 'the doc states the last-match-wins scoping so only the main client tiles and the other Steam windows keep floating'
        id: behavior-4
        context: [runtime]
        command: 'grep -q ''last match wins'' /usr/share/omarchy/manual/42-common-tweaks.md && grep -q ''keep floating'' /usr/share/omarchy/manual/42-common-tweaks.md'
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10123}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10123, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10123
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash -c 'cp ~/.config/hypr/hyprland.lua /tmp/hyprland.lua.bak && grep -F "o.window({ class = \"steam\", title = \"Steam\" }, { tile = true })" /usr/share/omarchy/manual/42-common-tweaks.md >> ~/.config/hypr/hyprland.lua && hyprctl reload && hyprctl configerrors; cp /tmp/hyprland.lua.bak ~/.config/hypr/hyprland.lua && hyprctl reload'
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10123.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10123, artifact: /tmp/pr-10123.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10123, artifact: /tmp/pr-10123.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10123, artifact: /tmp/pr-10123.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10123.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10123.mp4'