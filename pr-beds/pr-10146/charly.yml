version: 2026.249.2125
check-omarchy-pr-10146-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10146 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10146 a3e951158dcac624ced50d4df9b0a33e68539468 docs/notifications.md shell/plugins/notifications/NotificationLogic.js shell/plugins/notifications/Service.qml test/shell.d/notifications-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/notifications-test.sh; do bash "$t" || exit 1; done'
      - agent-check: >-
          popupGroup is defined and exported by NotificationLogic.js - verify with: grep -q 'function popupGroup' /usr/share/omarchy/shell/plugins/notifications/NotificationLogic.js && grep -q 'popupGroup: popupGroup' /usr/share/omarchy/shell/plugins/notifications/NotificationLogic.js
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          Service.qml derives the visible group, hides non-leaders, and prefixes the summary with the group size - verify with: grep -q 'readonly property var group: NotificationLogic.popupGroup(popupModel, cardSlot.index)' /usr/share/omarchy/shell/plugins/notifications/Service.qml && grep -q 'visible: cardSlot.group.leader' /usr/share/omarchy/shell/plugins/notifications/Service.qml && grep -q 'cardSlot.group.count > 1' /usr/share/omarchy/shell/plugins/notifications/Service.qml
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          popupGroup reports count=2/leader=true for the newest of two identical rows, hides the older member, and does not group a different body - verify with: node -e "const n=require('/usr/share/omarchy/shell/plugins/notifications/NotificationLogic.js');const rows=[{app:'A',summary:'S',body:'B'},{app:'A',summary:'S',body:'B'},{app:'A',summary:'S',body:'X'}];const g=n.popupGroup(rows,0);const h=n.popupGroup(rows,1);const x=n.popupGroup(rows,2);if(!(g.count===2&&g.leader===true&&h.count===2&&h.leader===false&&x.count===1&&x.leader===true))process.exit(1)"
        id: behavior-3
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10146}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10146, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10146
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/test/shell.d/notifications-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10146.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10146, artifact: /tmp/pr-10146.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10146, artifact: /tmp/pr-10146.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10146, artifact: /tmp/pr-10146.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10146.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10146.mp4'