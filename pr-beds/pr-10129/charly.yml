version: 2026.249.2125
check-omarchy-pr-10129-vm:
  vm:
    from: check-omarchy-eval-base-inst:golden
    disposable: true
    lifecycle: dev
    update_gate: restart-only
    add_candy:
      - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.246.1624'
      - '@github.com/opencharly/plugin-spice/candy/plugin-spice:v2026.245.1508'
    plan:
      - check: apply PR 10129 via the single apply seam
        id: pr-apply
        context: [runtime]
        command: 'pr-apply 10129 0681cadf28aae14f9cc46271ecb2af76e5958a36 bin/omarchy-hyprland-window-restore-presentation bin/omarchy-restart-shell test/shell.d/hyprland-window-restore-presentation-test.sh'
      - check: the PR's OWN test suite passes on the applied system
        id: pr-tests
        context: [runtime]
        command: 'for t in /usr/share/omarchy/test/shell.d/hyprland-window-restore-presentation-test.sh; do bash "$t" || exit 1; done'
      - agent-check: >-
          The restore-presentation helper script is installed at its system path and targets the presentation terminal class. - verify with: test -f /usr/share/omarchy/bin/omarchy-hyprland-window-restore-presentation && grep -q 'org.omarchy.terminal' /usr/share/omarchy/bin/omarchy-hyprland-window-restore-presentation
        id: behavior-1
        context: [runtime]
      - agent-check: >-
          Running the helper with a mocked hyprctl re-applies float, 875x600 resize, center, and focus to a presentation terminal. - verify with: tmp=$(mktemp -d); mkdir -p "$tmp/bin"; cat >"$tmp/bin/hyprctl" <<SH
          #!/bin/bash
          if [[ \$1 == "clients" ]]; then printf '%s\n' '[{"address":"0xabc","class":"org.omarchy.terminal","initialClass":"org.omarchy.terminal"}]'; else printf '%s\n' "\$*" >>"\$HYPRCTL_LOG"; fi
          SH
          chmod +x "$tmp/bin/hyprctl"; HYPRCTL_LOG="$tmp/log" PATH="$tmp/bin:$PATH" bash /usr/share/omarchy/bin/omarchy-hyprland-window-restore-presentation; grep -q 'window = "address:0xabc"' "$tmp/log" && grep -q 'x = 875, y = 600' "$tmp/log" && grep -q 'center' "$tmp/log" && grep -q 'focus' "$tmp/log"
        id: behavior-2
        context: [runtime]
      - agent-check: >-
          The helper is a no-op (issues no hyprctl dispatch) when no presentation terminal client exists. - verify with: tmp=$(mktemp -d); mkdir -p "$tmp/bin"; cat >"$tmp/bin/hyprctl" <<SH
          #!/bin/bash
          if [[ \$1 == "clients" ]]; then printf '%s\n' '[]'; else printf '%s\n' "\$*" >>"\$HYPRCTL_LOG"; fi
          SH
          chmod +x "$tmp/bin/hyprctl"; HYPRCTL_LOG="$tmp/log" PATH="$tmp/bin:$PATH" bash /usr/share/omarchy/bin/omarchy-hyprland-window-restore-presentation; test ! -s "$tmp/log"
        id: behavior-3
        context: [runtime]
      - agent-check: >-
          omarchy-restart-shell invokes the restore helper after the new shell answers ping. - verify with: grep -q 'omarchy-hyprland-window-restore-presentation' /usr/share/omarchy/bin/omarchy-restart-shell
        id: behavior-4
        context: [runtime]
      - check: start a terminal recording
        id: rec-start
        context: [runtime]
        record: {method: start, record_mode: terminal, record_name: pr-10129}
      - check: start the SPICE display video capture
        id: rec-spice-start
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: start, record_name: pr-10129, fps: 5}
      - check: drive the PR key command inside the recording
        id: rec-drive
        context: [runtime]
        record:
          method: run
          record_name: pr-10129
          # the drive is ARBITRARY shell — a block scalar, never a flow
          # mapping (RCA 2026.252.2250: the inlined text broke the
          # rendered YAML on shell metacharacters).
          text: |-
            bash /usr/share/omarchy/test/shell.d/hyprland-window-restore-presentation-test.sh
          settle_ms: 1000
      - check: capture the VM display via SPICE
        id: rec-screen-spice
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: screenshot, artifact: /tmp/pr-10129.png, artifact_min_bytes: 1000, artifact_not_uniform: true}
      - check: stop the SPICE capture and pull the MJPEG stream
        id: rec-spice-stop
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        spice: {method: record, action: stop, record_name: pr-10129, artifact: /tmp/pr-10129.mjpeg, artifact_min_bytes: 10000, artifact_not_uniform: true}
      - check: stop the terminal recording and pull the .cast
        id: rec-stop
        context: [runtime]
        record: {method: stop, record_name: pr-10129, artifact: /tmp/pr-10129.cast, artifact_min_bytes: 200}
      - check: render the .cast to an animated GIF
        id: rec-gif
        eventually: 25s
        retry_interval: 3s
        context: [runtime]
        record: {method: gif, record_name: pr-10129, artifact: /tmp/pr-10129.gif, artifact_min_bytes: 100}
      - run: transcode the SPICE MJPEG capture to MP4
        id: rec-mp4
        context: [runtime]
        command: 'ffmpeg -y -loglevel error -i /tmp/pr-10129.mjpeg -c:v libx264 -pix_fmt yuv420p /tmp/pr-10129.mp4'